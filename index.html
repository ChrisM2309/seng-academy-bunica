    const CHAPTER_HTML = {"a1":"\n      \u003cdiv class=\"callout\">\u003cb>Idea central:\u003c/b> una consultoría no vende una lista de herramientas. Encuentra qué operación importa, qué puede detenerla, quién decide y cómo se comprobará que el tratamiento funciona. SENG diseña una línea base de seguridad para el banco ficticio BUNICA.\u003c/div>\n      \u003cdiv class=\"two-col\">\u003csection class=\"panel\">\u003ch3>El encargo, desde cero\u003c/h3>\u003cp>BUNICA es una organización simulada. SENG es el equipo consultor que interpreta su perfil, estudia continuidad, inventaría activos, evalúa riesgos y propone un programa IG3 con responsables, indicadores, auditoría y presupuesto. El producto final es el informe integrado E.11 y la defensa ejecutiva E.12, respaldados por los entregables anteriores.\u003c/p>\u003cp>\u003cb>Analogía:\u003c/b> si el banco fuera una ciudad, el BIA decide qué servicios deben volver primero; el inventario ubica edificios y carreteras; la matriz de riesgos anticipa accidentes; los controles son barreras y protocolos; los indicadores prueban que las barreras sirven.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E01/E01_Acta_Equipo_Seleccion_Empresa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.01 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E11/E11_Documento_Final_LineaBase_BUNICA_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.11 ↗\u003c/a>\u003c/div>\u003c/section>\u003csection class=\"panel soft\">\u003ch3>La cadena que tenés que poder narrar\u003c/h3>\u003cdiv class=\"flow\">\u003cspan>Negocio\u003c/span>\u003ci>→\u003c/i>\u003cspan>BIA\u003c/span>\u003ci>→\u003c/i>\u003cspan>Activos\u003c/span>\u003ci>→\u003c/i>\u003cspan>Riesgos\u003c/span>\u003ci>→\u003c/i>\u003cspan>Responsables\u003c/span>\u003ci>→\u003c/i>\u003cspan>Controles\u003c/span>\u003ci>→\u003c/i>\u003cspan>Baseline\u003c/span>\u003ci>→\u003c/i>\u003cspan>Indicadores\u003c/span>\u003ci>→\u003c/i>\u003cspan>Auditoría\u003c/span>\u003ci>→\u003c/i>\u003cspan>Roadmap\u003c/span>\u003ci>→\u003c/i>\u003cspan>Informe\u003c/span>\u003c/div>\u003cp class=\"small\">Cada flecha es una pregunta: ¿qué dato del paso anterior justifica la decisión siguiente?\u003c/p>\u003cbutton class=\"plain-btn\" data-nav=\"mapa\">Explorar la cadena →\u003c/button>\u003c/section>\u003c/div>\n      \u003ch2>Los doce entregables, sin perder su relación\u003c/h2>\u003cdiv class=\"cards three\">\u003cdiv class=\"mini-card\">\u003cspan class=\"eyebrow\">E.01\u003c/span>\u003ch3>Equipo y organización\u003c/h3>\u003cp>Define SENG, BUNICA, roles y responsables del trabajo.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E01/E01_Acta_Equipo_Seleccion_Empresa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.01 ↗\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"mini-card\">\u003cspan class=\"eyebrow\">E.02\u003c/span>\u003ch3>Dirección y alcance\u003c/h3>\u003cp>Da autoridad al SGSI, cinco objetivos y límites de la propuesta.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E02/E02_Compromiso_Direccion_Alcance_SGSI_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.02 ↗\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"mini-card\">\u003cspan class=\"eyebrow\">E.03\u003c/span>\u003ch3>BIA\u003c/h3>\u003cp>Prioriza procesos por efecto de la interrupción y fija tiempos de continuidad.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E03/E03_BIA_Consolidacion_Procesos_Criticos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.03 ↗\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"mini-card\">\u003cspan class=\"eyebrow\">E.04\u003c/span>\u003ch3>Activos\u003c/h3>\u003cp>Identifica 24 bienes, datos, personas y terceros que sostienen los procesos.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E04/E04_Inventario_Clasificacion_Activos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.04 ↗\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"mini-card\">\u003cspan class=\"eyebrow\">E.05\u003c/span>\u003ch3>Riesgos\u003c/h3>\u003cp>Valora 14 escenarios y propone tratamientos y residuales esperados.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E05/E05_Matriz_Riesgos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.05 ↗\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"mini-card\">\u003cspan class=\"eyebrow\">E.06\u003c/span>\u003ch3>RACI\u003c/h3>\u003cp>Asigna ejecución, rendición de cuentas, consulta e información en 34 actividades.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E06/E06_Matriz_RACI_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.06 ↗\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"mini-card\">\u003cspan class=\"eyebrow\">E.07\u003c/span>\u003ch3>Seis controles\u003c/h3>\u003cp>Desarrolla políticas, SOP y medidas para CIS 12, 15, 13, 6, 11 y 5.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_12_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS12 ↗\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"mini-card\">\u003cspan class=\"eyebrow\">E.08\u003c/span>\u003ch3>Baseline IG3\u003c/h3>\u003cp>Mapea 108 salvaguardas adicionales; junto con E.07 cubre 153.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E08/E08_Checklist_Baseline_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.08 ↗\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"mini-card\">\u003cspan class=\"eyebrow\">E.09\u003c/span>\u003ch3>Indicadores y auditoría\u003c/h3>\u003cp>Define 16 medidas de desempeño y un programa de auditoría propuesto.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E09/E09_Indicadores_Auditoria_Interna_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.09 ↗\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"mini-card\">\u003cspan class=\"eyebrow\">E.10\u003c/span>\u003ch3>Roadmap\u003c/h3>\u003cp>Ordena capacidades por dependencias y horizonte hasta 2029.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E10/E10_Roadmap_Madurez_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.10 ↗\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"mini-card\">\u003cspan class=\"eyebrow\">E.11\u003c/span>\u003ch3>Informe integrado\u003c/h3>\u003cp>Une hallazgos, decisión económica, prioridad y recomendaciones.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E11/E11_Documento_Final_LineaBase_BUNICA_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.11 ↗\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"mini-card\">\u003cspan class=\"eyebrow\">E.12\u003c/span>\u003ch3>Presentación ejecutiva\u003c/h3>\u003cp>Versión actual de 13 diapositivas: nueve para exponer, una de preparación y tres de respaldo.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_originales/E12/E12_Presentacion_Ejecutiva_BUNICA_SENG.pptx\" target=\"_blank\" rel=\"noopener\">E.12 ↗\u003c/a>\u003c/div>\u003c/div>\u003c/div>\n      \u003cdiv class=\"detail-only panel\">\u003ch3>Cómo defender la secuencia\u003c/h3>\u003cp>El BIA E.03 precede a la matriz E.05 porque primero hay que saber cuánto importa que se detenga cada proceso. E.04 identifica dónde se materializa ese impacto. E.05 convierte la exposición en escenarios. E.06 asigna un responsable real. E.07 y E.08 diseñan el tratamiento, E.09 lo hace medible y auditable, E.10 ordena la implantación, y E.11 documenta las decisiones. E.12 debería comunicar esa cadena con cifras y fuentes.\u003c/p>\u003cp>No confundás «completo en la documentación» con «implantado en BUNICA». La mayoría de las salvaguardas se marca por implementar y su operación se propone para 2027–2029.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E03/E03_BIA_Consolidacion_Procesos_Criticos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.03 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E04/E04_Inventario_Clasificacion_Activos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.04 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E05/E05_Matriz_Riesgos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.05 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E06/E06_Matriz_RACI_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.06 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_12_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS12 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E08/E08_Checklist_Baseline_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.08 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E09/E09_Indicadores_Auditoria_Interna_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.09 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E10/E10_Roadmap_Madurez_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.10 ↗\u003c/a>\u003c/div>\u003c/div>\n      \u003cdiv class=\"defense-only callout\">\u003cb>Si preguntan «¿cuál es el aporte de SENG?»\u003c/b> Respondé: «Convertimos la continuidad del negocio en una secuencia trazable de controles, evidencia y decisiones de inversión. Diseñamos un programa; su eficacia se demostraría cuando BUNICA lo implante y mida».\u003c/div>","a2":"\n      \u003cdiv class=\"stat-grid\">\u003cdiv class=\"stat\">\u003cb>1,200\u003c/b>\u003cspan>empleados\u003c/span>\u003c/div>\u003cdiv class=\"stat\">\u003cb>650,000\u003c/b>\u003cspan>clientes\u003c/span>\u003c/div>\u003cdiv class=\"stat\">\u003cb>420,000\u003c/b>\u003cspan>usuarios digitales\u003c/span>\u003c/div>\u003cdiv class=\"stat\">\u003cb>USD 210 M\u003c/b>\u003cspan>ingresos anuales del caso\u003c/span>\u003c/div>\u003c/div>\n      \u003cdiv class=\"callout\">\u003cb>Modelo mental:\u003c/b> el core es el libro mayor de la ciudad bancaria: registra saldos y transacciones. Los canales son las ventanillas digitales, compensación enlaza al banco con otras entidades, AML/KYC verifica identidades y operaciones, e infraestructura e identidades sostienen a todos.\u003c/div>\n      \u003ch2>Seis procesos que alimentan el análisis\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable class=\"data-table\">\u003cthead>\u003ctr>\u003cth>ID\u003c/th>\u003cth>Proceso\u003c/th>\u003cth>Clase BIA\u003c/th>\u003cth>Puntaje\u003c/th>\u003cth>Dueño\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>P-01\u003c/td>\u003ctd>Procesamiento del Core Bancario\u003c/td>\u003ctd>Crítico\u003c/td>\u003ctd>4,42\u003c/td>\u003ctd>Operaciones y Tecnología\u003c/td>\u003c/tr>\u003ctr>\u003ctd>P-03\u003c/td>\u003ctd>Compensación y Liquidación de Pagos\u003c/td>\u003ctd>Crítico\u003c/td>\u003ctd>3,54\u003c/td>\u003ctd>Finanzas (tesorería)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>P-02\u003c/td>\u003ctd>Gestión de Canales Digitales\u003c/td>\u003ctd>Importante\u003c/td>\u003ctd>2,70\u003c/td>\u003ctd>Banca de Personas\u003c/td>\u003c/tr>\u003ctr>\u003ctd>P-05\u003c/td>\u003ctd>Operación y recuperación de la infraestructura tecnológica\u003c/td>\u003ctd>Importante\u003c/td>\u003ctd>2,25\u003c/td>\u003ctd>Operaciones y Tecnología\u003c/td>\u003c/tr>\u003ctr>\u003ctd>P-04\u003c/td>\u003ctd>Cumplimiento Normativo (AML/KYC)\u003c/td>\u003ctd>Importante\u003c/td>\u003ctd>2,20\u003c/td>\u003ctd>Riesgos y Cumplimiento\u003c/td>\u003c/tr>\u003ctr>\u003ctd>P-06\u003c/td>\u003ctd>Administración de identidades y accesos\u003c/td>\u003ctd>Diferible\u003c/td>\u003ctd>1,88\u003c/td>\u003ctd>Operaciones y Tecnología\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>El perfil inicial llama críticos a cuatro procesos del negocio. El BIA distingue solo \u003cb>P-01 y P-03\u003c/b> como críticos por disponibilidad; P-02 y P-04 son importantes por confidencialidad de datos, y P-06 es diferible por disponibilidad. Esta diferencia está documentada, no es un error a ocultar.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E02/E02_Compromiso_Direccion_Alcance_SGSI_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.02 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/E03_BIA_Consolidacion_Procesos_Criticos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.03 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/BIA_P01_Inventario_Procesos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P01 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/BIA_P05_Matriz_Criticidad_Priorizacion_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P05 ↗\u003c/a>\u003c/div>\n      \u003cdiv class=\"cards\">\u003cdiv class=\"mini-card\">\u003ch3>Operación bancaria concreta\u003c/h3>\u003cp>Un cliente inicia una transferencia en la app (P-02). El core (P-01) registra saldo y asiento. Si la operación sale a otro banco, compensación (P-03) genera un lote y usa el portal del BCR. La identidad del empleado que opera el lote depende del directorio (P-06). Este es un ejemplo didáctico de la secuencia; los documentos no especifican el protocolo exacto entre aplicaciones.\u003c/p>\u003c/div>\u003cdiv class=\"mini-card\">\u003ch3>Lo que sostiene a todos\u003c/h3>\u003cp>P-05 opera la red MPLS, los sistemas de recuperación y la plataforma de identidades. Una red plana facilita movimiento lateral; un directorio único sin MFA administrativo es un punto único de falla. La cinta diaria del core es la única copia independiente descrita.\u003c/p>\u003c/div>\u003c/div>\n      \u003cdiv class=\"detail-only panel\">\u003ch3>Tecnologías declaradas y función conocida\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"data-table\">\u003cthead>\u003ctr>\u003cth>Tecnología\u003c/th>\u003cth>Papel documentado\u003c/th>\u003cth>Precaución\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>IBM i 7.4 + IBM Power\u003c/td>\u003ctd>Plataforma del core bancario propio.\u003c/td>\u003ctd>La ficha no confirma si los perfiles IBM i autentican contra AD.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RHEL 8 + Oracle 19c + Java\u003c/td>\u003ctd>Canales digitales a medida y su base de datos.\u003c/td>\u003ctd>La edición de Oracle y el servidor de aplicaciones deben verificarse.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Active Directory + Entra ID\u003c/td>\u003ctd>Directorio local sincronizado con identidades de nube.\u003c/td>\u003ctd>Es un directorio único y no registra MFA administrativo.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Azure + Microsoft 365\u003c/td>\u003ctd>Servicios híbridos y oficina; soporte de expedientes KYC según el BIA.\u003c/td>\u003ctd>No se debe atribuir la infraestructura física de Microsoft al banco.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Salesforce\u003c/td>\u003ctd>CRM dentro del alcance del SGSI.\u003c/td>\u003ctd>E.04 no lo incluye entre los 24 activos por su recorte de procesos.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Palo Alto + MPLS\u003c/td>\u003ctd>Cortafuegos perimetrales y conectividad de sucursales/cajeros.\u003c/td>\u003ctd>Fuera de tarjetas, la red interna se describe mayormente plana.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cb>Relaciones verificadas:\u003c/b> E.04 y BIA_P04 enlazan procesos con activos. No hay diagrama técnico de todas las interfaces; una dependencia de negocio no prueba una conexión directa ni un protocolo concreto.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E02/E02_Compromiso_Direccion_Alcance_SGSI_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.02 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E04/E04_Inventario_Clasificacion_Activos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.04 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/BIA_P04_Mapa_Dependencias_Recursos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P04 ↗\u003c/a>\u003c/div>\u003c/div>\n      \u003cdiv class=\"defense-only callout\">\u003cb>Si preguntan por qué P-02 no es «crítico» en el BIA:\u003c/b> el perfil lo llama crítico para el alcance. BIA_P05 lo puntúa 2.70, importante en disponibilidad; la exposición de 420,000 usuarios hace que su confidencialidad siga siendo prioritaria en E.05. Alcance y criticidad BIA responden preguntas distintas.\u003c/div>","a3":"\n      \u003cdiv class=\"callout\">\u003cb>BIA significa impacto al negocio.\u003c/b> Pregunta cuánto puede detenerse un servicio antes de causar daño intolerable. Se hace antes de asignar un riesgo porque la probabilidad de un ataque no dice cuánto perdería el banco si sucede.\u003c/div>\n      \u003cdiv class=\"cards three\">\u003cdiv class=\"mini-card\">\u003ch3>MTPD · límite máximo\u003c/h3>\u003cp>El techo de interrupción tolerable. P-01 tiene 24 horas. Superarlo pone al negocio en una zona de daño grave.\u003c/p>\u003c/div>\u003cdiv class=\"mini-card\">\u003ch3>RTO + WRT · recuperación\u003c/h3>\u003cp>RTO es volver técnicamente; WRT es normalizar el trabajo. Para el core: 8 h + 4 h = 12 h, dentro del MTPD de 24 h.\u003c/p>\u003c/div>\u003cdiv class=\"mini-card\">\u003ch3>RPO · pérdida de datos\u003c/h3>\u003cp>El punto más viejo al que puede volver la información. El core aspira a 15 minutos; una réplica cada hora deja una brecha de hasta 45 minutos.\u003c/p>\u003c/div>\u003c/div>\n      \u003csection class=\"panel blue\">\u003ch3>Una interrupción del core, paso a paso\u003c/h3>\u003cdiv class=\"flow\">\u003cspan>0 h · falla\u003c/span>\u003ci>→\u003c/i>\u003cspan>8 h · RTO\u003c/span>\u003ci>→\u003c/i>\u003cspan>12 h · RTO + WRT\u003c/span>\u003ci>→\u003c/i>\u003cspan>24 h · MTPD\u003c/span>\u003c/div>\u003cp>La última prueba parcial tardó \u003cb>11 h\u003c/b>: excede el RTO de 8 h aunque, sumando 4 h de WRT, 15 h todavía quede bajo el MTPD supuesto. La prueba no fue completa, por lo que no demuestra continuidad. El procedimiento alterno de sucursales usa saldos impresos y retiros limitados; compensación puede enviar lotes urgentes por el portal del BCR, pero esa alternativa comparte el portal y no está probada por 24 h.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E03/E03_BIA_Consolidacion_Procesos_Criticos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.03 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/BIA_P02_Ficha_BIA_Proceso_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P02 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/BIA_P04_Mapa_Dependencias_Recursos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P04 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/BIA_P06_Registro_Supuestos_SPOF_Brechas_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P06 ↗\u003c/a>\u003c/div>\u003c/section>\n      \u003cdiv class=\"two-col\">\u003csection class=\"panel\">\u003ch3>Costos y pérdida\u003c/h3>\u003cp>En horario de sucursales, cada hora sin core se estimó en \u003cb>USD 10,924\u003c/b>; fuera de ese horario, el costo baja a USD 5,274. El caso de cifrado de 72 h usa \u003cb>SLE = USD 612,000\u003c/b>. Con una frecuencia anual supuesta de 0.5, \u003cb>ALE = 612,000 × 0.5 = USD 306,000\u003c/b>. SLE es por evento; ALE es exposición anual, no un desembolso observado.\u003c/p>\u003cdiv class=\"formula\">ALE = SLE × ARO = 612,000 × 0.5 = USD 306,000 / año\u003c/div>\u003c/section>\u003csection class=\"panel\">\u003ch3>Lo que falta probar\u003c/h3>\u003cp>La réplica horaria también puede copiar corrupción o cifrado. La cinta diaria es la única copia independiente descrita, y sus restauraciones han sido parciales y poco frecuentes. La red MPLS, el directorio y el procesador de tarjetas tienen dependencias únicas; algunos contratos y niveles de servicio no constan en la ficha.\u003c/p>\u003cp>\u003cb>MBCO\u003c/b> es el servicio mínimo aceptable durante la contingencia, como atender retiros limitados; no equivale a operación normal.\u003c/p>\u003c/section>\u003c/div>\n      \u003ch2>Las siete piezas del BIA\u003c/h2>\u003cdiv class=\"cards three\">\u003cdiv class=\"mini-card\">\u003cspan class=\"eyebrow\">BIA_P01\u003c/span>\u003ch3>Inventario de procesos\u003c/h3>\u003cp>Censa P-01–P-06, sus dueños, productos, entradas y sistemas de soporte.\u003c/p>\u003cp class=\"small\">\u003cb>Qué revela en BUNICA:\u003c/b> P-05 sostiene la recuperación tecnológica; P-06 administra identidades. Ambos habilitan a los procesos de negocio.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E03/BIA_P01_Inventario_Procesos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P01 ↗\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"mini-card\">\u003cspan class=\"eyebrow\">BIA_P02\u003c/span>\u003ch3>Ficha por proceso\u003c/h3>\u003cp>Documenta impacto, tiempos, costos, mínimos de operación y alternos declarados por los dueños.\u003c/p>\u003cp class=\"small\">\u003cb>Qué revela en BUNICA:\u003c/b> El core (P-01) exige RTO 8 h y RPO 15 min; su última prueba parcial tardó 11 h. P-03 tiene RTO 4 h.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E03/BIA_P02_Ficha_BIA_Proceso_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P02 ↗\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"mini-card\">\u003cspan class=\"eyebrow\">BIA_P03\u003c/span>\u003ch3>Impacto en el tiempo\u003c/h3>\u003cp>Evalúa impactos operativo, financiero, legal, reputacional y en personas en distintos cortes.\u003c/p>\u003cp class=\"small\">\u003cb>Qué revela en BUNICA:\u003c/b> P-01 y P-03 cruzan el umbral de tolerancia a las 24 h; ese punto determina su MTPD.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E03/BIA_P03_Matriz_Impacto_Tiempo_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P03 ↗\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"mini-card\">\u003cspan class=\"eyebrow\">BIA_P04\u003c/span>\u003ch3>Dependencias\u003c/h3>\u003cp>Registra seis clases de recursos, mínimos para operar y puntos únicos de falla (SPOF).\u003c/p>\u003cp class=\"small\">\u003cb>Qué revela en BUNICA:\u003c/b> P-05 se recupera primero; después P-01 y P-03. Destaca el directorio único, la red MPLS y la cinta diaria.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E03/BIA_P04_Mapa_Dependencias_Recursos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P04 ↗\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"mini-card\">\u003cspan class=\"eyebrow\">BIA_P05\u003c/span>\u003ch3>Criticidad\u003c/h3>\u003cp>Pondera impactos y dependencias para ordenar los seis procesos y fijar clases.\u003c/p>\u003cp class=\"small\">\u003cb>Qué revela en BUNICA:\u003c/b> P-01 (4,42) y P-03 (3,54) quedan críticos; P-03 supera el corte crítico gracias al ajuste por procesos dependientes.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E03/BIA_P05_Matriz_Criticidad_Priorizacion_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P05 ↗\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"mini-card\">\u003cspan class=\"eyebrow\">BIA_P06\u003c/span>\u003ch3>Supuestos y brechas\u003c/h3>\u003cp>Reúne supuestos sensibles, SPOF y diferencias entre lo requerido y lo que se ha demostrado.\u003c/p>\u003cp class=\"small\">\u003cb>Qué revela en BUNICA:\u003c/b> Registra 18 supuestos, 6 SPOF y 10 brechas. BR-01: prueba de 11 h frente a RTO 8 h; BR-02: réplica horaria frente a RPO 15 min.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E03/BIA_P06_Registro_Supuestos_SPOF_Brechas_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P06 ↗\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"mini-card\">\u003cspan class=\"eyebrow\">BIA_P07\u003c/span>\u003ch3>Informe ejecutivo\u003c/h3>\u003cp>Resume el método, prioridades y decisiones que corresponden a dirección.\u003c/p>\u003cp class=\"small\">\u003cb>Qué revela en BUNICA:\u003c/b> Pide aprobar MFA administrativo, recuperación y respaldo aislado, contratos y enlaces alternos; costos sin cotizar y pruebas pendientes deben reconocerse.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E03/BIA_P07_Informe_Ejecutivo_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P07 ↗\u003c/a>\u003c/div>\u003c/div>\u003c/div>\n      \u003cdiv class=\"detail-only panel\">\u003ch3>Supuestos, sensibilidad y límites\u003c/h3>\u003cp>El estudio registra 18 supuestos globales S-01 a S-18. Los más sensibles son la duración de los procedimientos alternos, el costo horario y la frecuencia anual (ARO) usada en E.05. Si la falla ocurre en quincena, diciembre o en la ventana del BCR, el daño cambia. La cifra de USD 612,000 no debe sumarse mecánicamente a pérdidas de escenarios que describen el mismo proceso y evento: eso duplicaría exposición.\u003c/p>\u003cp>La matriz BIA clasifica P-01 (4.42) y P-03 (3.54) como críticos; P-02 (2.70), P-05 (2.25) y P-04 (2.20) como importantes; P-06 (1.88) como diferible en disponibilidad. P-02 y P-04 conservan alto valor por los datos que manejan.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E03/BIA_P03_Matriz_Impacto_Tiempo_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P03 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/BIA_P05_Matriz_Criticidad_Priorizacion_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P05 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/BIA_P06_Registro_Supuestos_SPOF_Brechas_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P06 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E05/E05_Matriz_Riesgos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.05 ↗\u003c/a>\u003c/div>\u003c/div>\n      \u003cdiv class=\"defense-only callout\">\u003cb>Objeción probable:\u003c/b> «Si 11 + 4 es menor que 24, ¿por qué hay una brecha?» Porque el objetivo RTO de 8 h se incumplió en la prueba parcial. MTPD es un máximo tolerable, no la meta de recuperación; además, el RPO de 15 min tampoco se cumple con réplica horaria.\u003c/div>","a6":"\n      \u003csection class=\"panel blue\">\u003cspan class=\"eyebrow\">Gobierno de seguridad · el encargo\u003c/span>\u003ch2>¿Qué estás construyendo?\u003c/h2>\u003cp>Estás definiendo cómo BUNICA dirige la seguridad como un programa: qué resultados prioriza, quién decide y ejecuta, qué evidencia demuestra avances y quién revisa si funciona. El SGSI (Sistema de Gestión de Seguridad de la Información) coordina esas piezas; no es un software ni una lista de controles.\u003c/p>\u003cp>En esta sección pasás del compromiso formal de la dirección (E.02) a cinco objetivos medibles, delimitás qué entra en el alcance y asignás responsabilidades en la RACI (E.06). Después, E.07–E.10 convierten esos compromisos en controles, medición y un plan por etapas.\u003c/p>\u003cdiv class=\"flow\">\u003cspan>Riesgos y obligaciones\u003c/span>\u003ci>→\u003c/i>\u003cspan>Objetivos\u003c/span>\u003ci>→\u003c/i>\u003cspan>Responsables\u003c/span>\u003ci>→\u003c/i>\u003cspan>Controles\u003c/span>\u003ci>→\u003c/i>\u003cspan>Evidencia e indicadores\u003c/span>\u003ci>→\u003c/i>\u003cspan>Revisión y mejora\u003c/span>\u003c/div>\u003cp>\u003cb>La pregunta que guía el capítulo:\u003c/b> ¿cómo sabe la dirección qué se debe proteger primero, quién debe actuar y cuándo puede afirmar con evidencia que el resultado se alcanzó?\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E02/E02_Compromiso_Direccion_Alcance_SGSI_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.02 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E06/E06_Matriz_RACI_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.06 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E09/E09_Indicadores_Auditoria_Interna_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.09 ↗\u003c/a>\u003c/div>\u003c/section>\n      \u003ch2>1 · El marco organiza el trabajo\u003c/h2>\u003cp>Los marcos cumplen papeles distintos y complementarios. Primero se gobierna el programa; luego se seleccionan y calendarizan las medidas que reducirán los riesgos de BUNICA.\u003c/p>\u003cdiv class=\"cards three\">\u003cdiv class=\"mini-card\">\u003cspan class=\"eyebrow\">SISTEMA DE GESTIÓN\u003c/span>\u003ch3>ISO/IEC 27001\u003c/h3>\u003cp>Ayuda a organizar compromiso directivo, alcance, evaluación de riesgos, operación, medición, auditoría y mejora. Responde: \u003cb>¿cómo se dirige y revisa la seguridad?\u003c/b>\u003c/p>\u003c/div>\u003cdiv class=\"mini-card\">\u003cspan class=\"eyebrow\">CATÁLOGO Y MEDIDAS\u003c/span>\u003ch3>ISO/IEC 27002 + CIS\u003c/h3>\u003cp>Ofrecen referencias para escoger controles y convertirlos en salvaguardas. El baseline CIS v8.1.2 de BUNICA reúne 153: 56 IG1, 74 adicionales IG2 y 23 adicionales IG3. Responde: \u003cb>¿qué medidas concretas ayudan a tratar el riesgo?\u003c/b>\u003c/p>\u003c/div>\u003cdiv class=\"mini-card\">\u003cspan class=\"eyebrow\">LENGUAJE COMÚN\u003c/span>\u003ch3>NIST CSF 2.0\u003c/h3>\u003cp>Ordena resultados en Gobernar, Identificar, Proteger, Detectar, Responder y Recuperar. Sirve para explicar si la propuesta cubre el ciclo completo, sin sustituir la asignación concreta de responsables.\u003c/p>\u003c/div>\u003c/div>\n      \u003ch2>2 · Los objetivos convierten prioridades en compromisos\u003c/h2>\u003cp>Un objetivo de seguridad debe decir \u003cb>qué resultado\u003c/b> busca la dirección, \u003cb>para cuándo\u003c/b>, \u003cb>cómo se medirá\u003c/b> y \u003cb>qué evidencia\u003c/b> permitirá verificarlo. E.02 fija cinco compromisos; E.09 les asigna indicadores y E.10 los convierte en hitos del roadmap. Las fechas parten del inicio del programa, el 4 de enero de 2027.\u003c/p>\u003cdiv class=\"callout\">\u003cb>Cómo leer cada tarjeta:\u003c/b> la brecha explica por qué existe el objetivo; la meta describe el estado que se quiere conseguir; la prueba/indicador muestra cómo comprobarlo. Una meta futura no significa que hoy ya esté cumplida.\u003c/div>\u003cdiv class=\"cards objective-cards\">\u003carticle class=\"mini-card objective-card\">\u003cspan class=\"eyebrow\">OBJ-01 · HITO 30 JUN 2027\u003c/span>\u003ch3>Demostrar recuperación del core\u003c/h3>\u003cp>\u003cb>Brecha:\u003c/b> el proceso depende de una recuperación que aún no se ha probado de extremo a extremo dentro del tiempo objetivo.\u003c/p>\u003cp>\u003cb>Meta:\u003c/b> completar una prueba en el sitio alterno en ≤8 horas y repetirla cada año.\u003c/p>\u003cp>\u003cb>Cómo se comprueba:\u003c/b> acta con hora real de recuperación frente al RTO; indicador IND-09.\u003c/p>\u003c/article>\u003carticle class=\"mini-card objective-card\">\u003cspan class=\"eyebrow\">OBJ-02 · HITO 30 JUN 2027\u003c/span>\u003ch3>Encontrar y corregir vulnerabilidades\u003c/h3>\u003cp>\u003cb>Brecha:\u003c/b> una falla en banca en línea o la app expuesta puede ser aprovechada antes de que el banco la detecte y corrija.\u003c/p>\u003cp>\u003cb>Meta:\u003c/b> escanear mensualmente el 100 % de los activos expuestos y trimestralmente los internos; remediar por ciclos documentados.\u003c/p>\u003cp>\u003cb>Cómo se comprueba:\u003c/b> cobertura del escaneo y porcentaje remediado; IND-13/14.\u003c/p>\u003c/article>\u003carticle class=\"mini-card objective-card\">\u003cspan class=\"eyebrow\">OBJ-03 · HITO 31 DIC 2027\u003c/span>\u003ch3>Centralizar alertas del core y canales\u003c/h3>\u003cp>\u003cb>Brecha:\u003c/b> sin registros reunidos y revisados, cuesta reconocer un incidente que cruza varios sistemas.\u003c/p>\u003cp>\u003cb>Meta:\u003c/b> integrar en el SIEM los registros y alertas del 100 % de los sistemas que soportan core y canales, con revisión al menos semanal.\u003c/p>\u003cp>\u003cb>Cómo se comprueba:\u003c/b> fuentes integradas frente al inventario E.04; IND-05.\u003c/p>\u003c/article>\u003carticle class=\"mini-card objective-card\">\u003cspan class=\"eyebrow\">OBJ-04 · HITO 31 DIC 2027\u003c/span>\u003ch3>Separar la red del core y compensación\u003c/h3>\u003cp>\u003cb>Brecha:\u003c/b> la conectividad con sucursales puede ampliar el alcance de una intrusión o interrupción.\u003c/p>\u003cp>\u003cb>Meta:\u003c/b> ubicar el 100 % de los sistemas del core y compensación en segmentos separados, con reglas de filtrado aprobadas.\u003c/p>\u003cp>\u003cb>Cómo se comprueba:\u003c/b> porcentaje de sistemas segmentados y sus reglas; IND-01.\u003c/p>\u003c/article>\u003carticle class=\"mini-card objective-card\">\u003cspan class=\"eyebrow\">OBJ-05 · VIGENTE DESDE 4 ENE 2027\u003c/span>\u003ch3>Responder a una vulneración de datos personales\u003c/h3>\u003cp>\u003cb>Brecha:\u003c/b> una notificación tardía perjudica a clientes y puede incumplir el requisito recogido en E.02.\u003c/p>\u003cp>\u003cb>Meta:\u003c/b> notificar en un máximo de 72 horas y ensayar el procedimiento antes del 30 de junio de 2027; repetir cada año.\u003c/p>\u003cp>\u003cb>Cómo se comprueba:\u003c/b> porcentaje de avisos dentro del plazo y acta del ejercicio; IND-15/16.\u003c/p>\u003c/article>\u003c/div>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E02/E02_Compromiso_Direccion_Alcance_SGSI_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.02 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E09/E09_Indicadores_Auditoria_Interna_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.09 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E10/E10_Roadmap_Madurez_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.10 ↗\u003c/a>\u003c/div>\n      \u003ch2>3 · Definir el alcance y las obligaciones\u003c/h2>\u003cp>Ahora se fija dónde puede tomar decisiones directas el SGSI y qué requisitos del caso condicionan sus prioridades. Una exclusión pone un límite de control; no hace desaparecer la dependencia ni el riesgo.\u003c/p>\u003cdiv class=\"two-col\">\u003csection class=\"panel\">\u003ch3>Alcance y exclusiones\u003c/h3>\u003cp>El SGSI cubre los cuatro procesos del perfil, sedes, core, canales, identidad, nube contratada, red, terceros e interfaces. Excluye la infraestructura interna del procesador, la plataforma física del proveedor de nube, la infraestructura del BCR, los dispositivos de clientes y otros procesos no vinculados. Las interfaces, contratos, identidades, configuraciones y datos que BUNICA controla sí quedan dentro.\u003c/p>\u003cp>La exclusión delimita control directo; no elimina el riesgo de dependencia.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E02/E02_Compromiso_Direccion_Alcance_SGSI_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.02 ↗\u003c/a>\u003c/div>\u003c/section>\u003csection class=\"panel\">\u003ch3>Regulación recogida por el proyecto\u003c/h3>\u003cp>E.02 registra LPDP (notificación en 72 h), Ley de Ciberseguridad con aplicabilidad condicionada a calificación de infraestructura crítica, normas técnicas sectoriales del BCR/SSF, PCI DSS por tarjetas y obligaciones AML/KYC. Los documentos no identifican el número de todas las normas sectoriales; la academia conserva esa limitación.\u003c/p>\u003cp>Son requisitos del caso académico. Para una aplicación real habría que confirmar texto, vigencia y alcance con asesoría legal.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E02/E02_Compromiso_Direccion_Alcance_SGSI_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.02 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E11/E11_Documento_Final_LineaBase_BUNICA_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.11 ↗\u003c/a>\u003c/div>\u003c/section>\u003c/div>\n      \u003csection class=\"panel raci-section\">\u003cspan class=\"eyebrow\">E.06 · MATRIZ DE RESPONSABILIDADES\u003c/span>\u003ch2>4 · Asignar quién responde y quién ejecuta\u003c/h2>\u003cp>Presidencia aprueba políticas, riesgos y recursos; el oficial de seguridad de BUNICA coordina y escala; Operaciones y Tecnología ejecuta la mayoría de las medidas; los dueños de proceso validan datos y prioridades; Auditoría Interna revisa con independencia. Christopher es arquitecto de SENG: diseña la propuesta, no ocupa el puesto interno del oficial.\u003c/p>\u003cp>Después de fijar los objetivos y el alcance, hay que asignar el trabajo. En cada fila, \u003cb>A\u003c/b> es una sola persona/función que responde por el resultado; \u003cb>R\u003c/b> es quien lo ejecuta y puede haber más de uno. \u003cb>C\u003c/b> aporta criterio antes de decidir; \u003cb>I\u003c/b> recibe información. La vista resumida presenta A y R para que se lea el reparto operativo; E.06 contiene las cuatro letras.\u003c/p>\u003cdiv class=\"raci-legend\">\u003cspan>\u003cb>A\u003c/b> · garantiza que el resultado ocurra\u003c/span>\u003cspan>\u003cb>R\u003c/b> · realiza la tarea\u003c/span>\u003cspan>\u003cb>C\u003c/b> · aporta antes de decidir\u003c/span>\u003cspan>\u003cb>I\u003c/b> · se mantiene al tanto\u003c/span>\u003c/div>\u003cp>Son 34 actividades concretas, no una lista genérica de cargos. Por ejemplo, Presidencia aprueba la política (A) y el oficial la prepara (R). Luego la misma RACI asigna quién ejecuta los controles, mide los indicadores y lleva iniciativas al roadmap. Así conecta E.02 con E.07, E.09 y E.10.\u003c/p>\u003cdetails class=\"accordion\">\u003csummary>Ver las 34 actividades de E.06 · reparto A y R\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cdiv class=\"raci-list\" aria-label=\"34 actividades con responsable final y ejecutor\">\u003cdiv class=\"raci-header\">\u003cspan>ACTIVIDAD\u003c/span>\u003cspan>A · RINDE CUENTAS\u003c/span>\u003cspan>R · EJECUTA\u003c/span>\u003c/div>\u003carticle class=\"raci-row\">\u003cdiv class=\"raci-activity\">\u003cspan class=\"eyebrow\">ACTIVIDAD\u003c/span>\u003cb>1. Aprobar la política de seguridad de la información y las políticas de los controles\u003c/b>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label accountable\">A · RINDE CUENTAS\u003c/span>\u003cp>Presidencia\u003c/p>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label responsible\">R · EJECUTA\u003c/span>\u003cp>Oficial de seguridad de la información\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"raci-row\">\u003cdiv class=\"raci-activity\">\u003cspan class=\"eyebrow\">ACTIVIDAD\u003c/span>\u003cb>2. Gestionar las vulnerabilidades y los parches, con escaneo y remediación en ciclos\u003c/b>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label accountable\">A · RINDE CUENTAS\u003c/span>\u003cp>Oficial de seguridad de la información\u003c/p>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label responsible\">R · EJECUTA\u003c/span>\u003cp>Operaciones y Tecnología (TI)\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"raci-row\">\u003cdiv class=\"raci-activity\">\u003cspan class=\"eyebrow\">ACTIVIDAD\u003c/span>\u003cb>3. Administrar las cuentas y los accesos: altas, cambios, bajas y revisión de privilegios\u003c/b>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label accountable\">A · RINDE CUENTAS\u003c/span>\u003cp>Oficial de seguridad de la información\u003c/p>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label responsible\">R · EJECUTA\u003c/span>\u003cp>Banca de Personas, Operaciones y Tecnología (TI), Riesgos y Cumplimiento, Finanzas, Recursos Humanos\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"raci-row\">\u003cdiv class=\"raci-activity\">\u003cspan class=\"eyebrow\">ACTIVIDAD\u003c/span>\u003cb>4. Respaldar los datos y proteger las copias, con una copia aislada del core\u003c/b>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label accountable\">A · RINDE CUENTAS\u003c/span>\u003cp>Oficial de seguridad de la información\u003c/p>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label responsible\">R · EJECUTA\u003c/span>\u003cp>Operaciones y Tecnología (TI)\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"raci-row\">\u003cdiv class=\"raci-activity\">\u003cspan class=\"eyebrow\">ACTIVIDAD\u003c/span>\u003cb>5. Responder a los incidentes de seguridad: contener, erradicar, recuperar y documentar\u003c/b>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label accountable\">A · RINDE CUENTAS\u003c/span>\u003cp>Oficial de seguridad de la información\u003c/p>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label responsible\">R · EJECUTA\u003c/span>\u003cp>Operaciones y Tecnología (TI)\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"raci-row\">\u003cdiv class=\"raci-activity\">\u003cspan class=\"eyebrow\">ACTIVIDAD\u003c/span>\u003cb>6. Notificar en 72 horas las vulneraciones de datos personales a la Agencia de Ciberseguridad del Estado, a la Fiscalía General de la República y a los titulares, y probar el procedimiento cada año\u003c/b>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label accountable\">A · RINDE CUENTAS\u003c/span>\u003cp>Presidencia\u003c/p>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label responsible\">R · EJECUTA\u003c/span>\u003cp>Banca de Personas, Banca Corporativa, Oficial de seguridad de la información, Gerencia Legal\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"raci-row\">\u003cdiv class=\"raci-activity\">\u003cspan class=\"eyebrow\">ACTIVIDAD\u003c/span>\u003cb>7. Concientizar y capacitar al personal en seguridad, incluida la ingeniería social\u003c/b>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label accountable\">A · RINDE CUENTAS\u003c/span>\u003cp>Oficial de seguridad de la información\u003c/p>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label responsible\">R · EJECUTA\u003c/span>\u003cp>Recursos Humanos\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"raci-row\">\u003cdiv class=\"raci-activity\">\u003cspan class=\"eyebrow\">ACTIVIDAD\u003c/span>\u003cb>8. Auditar el SGSI y los controles de forma independiente\u003c/b>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label accountable\">A · RINDE CUENTAS\u003c/span>\u003cp>Junta Directiva y Comité de Auditoría\u003c/p>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label responsible\">R · EJECUTA\u003c/span>\u003cp>Auditoría Interna\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"raci-row\">\u003cdiv class=\"raci-activity\">\u003cspan class=\"eyebrow\">ACTIVIDAD\u003c/span>\u003cb>9. Reportar a la Superintendencia toda interrupción del core y las caídas de canales que superen el umbral de su norma\u003c/b>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label accountable\">A · RINDE CUENTAS\u003c/span>\u003cp>Presidencia\u003c/p>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label responsible\">R · EJECUTA\u003c/span>\u003cp>Riesgos y Cumplimiento\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"raci-row\">\u003cdiv class=\"raci-activity\">\u003cspan class=\"eyebrow\">ACTIVIDAD\u003c/span>\u003cb>10. Declarar la contingencia del core o de la compensación y activar su procedimiento alterno\u003c/b>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label accountable\">A · RINDE CUENTAS\u003c/span>\u003cp>Presidencia\u003c/p>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label responsible\">R · EJECUTA\u003c/span>\u003cp>Operaciones y Tecnología (TI), Finanzas\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"raci-row\">\u003cdiv class=\"raci-activity\">\u003cspan class=\"eyebrow\">ACTIVIDAD\u003c/span>\u003cb>11. Mantener el cumplimiento de PCI DSS como emisor en el entorno de tarjetas\u003c/b>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label accountable\">A · RINDE CUENTAS\u003c/span>\u003cp>Oficial de seguridad de la información\u003c/p>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label responsible\">R · EJECUTA\u003c/span>\u003cp>Operaciones y Tecnología (TI), Finanzas\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"raci-row\">\u003cdiv class=\"raci-activity\">\u003cspan class=\"eyebrow\">ACTIVIDAD\u003c/span>\u003cb>12. Proteger los expedientes KYC y los reportes a la UIF con permisos según la necesidad y una configuración segura de Microsoft 365\u003c/b>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label accountable\">A · RINDE CUENTAS\u003c/span>\u003cp>Oficial de seguridad de la información\u003c/p>\u ecnología (TI)\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"raci-row\">\u003cdiv class=\"raci-activity\">\u003cspan class=\"eyebrow\">ACTIVIDAD\u003c/span>\u003cb>33. Desarrollar de forma segura la banca en línea, la app y la aplicación del core\u003c/b>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label accountable\">A · RINDE CUENTAS\u003c/span>\u003cp>Oficial de seguridad de la información\u003c/p>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label responsible\">R · EJECUTA\u003c/span>\u003cp>Operaciones y Tecnología (TI)\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"raci-row\">\u003cdiv class=\"raci-activity\">\u003cspan class=\"eyebrow\">ACTIVIDAD\u003c/span>\u003cb>34. Contratar y supervisar las pruebas de penetración y remediar sus hallazgos\u003c/b>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label accountable\">A · RINDE CUENTAS\u003c/span>\u003cp>Oficial de seguridad de la información\u003c/p>\u003c/div>\u003cdiv class=\"raci-role\">\u003cspan class=\"raci-label responsible\">R · EJECUTA\u003c/span>\u003cp>Operaciones y Tecnología (TI)\u003c/p>\u003c/div>\u003c/article>\u003c/div>\u003c/div>\u003c/details>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E06/E06_Matriz_RACI_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.06 ↗\u003c/a>\u003c/div>\u003c/section>\n      \u003cdiv class=\"defense-only callout\">\u003cb>Pregunta:\u003c/b> «¿Por qué Auditoría Interna no implementa el SIEM?» Porque perdería independencia al auditar su propio trabajo. TI ejecuta, el oficial rinde cuentas y Auditoría verifica evidencia y hallazgos.\u003c/div>","a8":"\n      \u003cdiv class=\"callout\">\u003cb>Mensaje para dirección:\u003c/b> el proyecto concentra la exposición en el cifrado del core y la toma de cuentas administrativas. Propone cerrar esas entradas, demostrar recuperación y luego madurar segmentación y detección. Las 153 salvaguardas son la meta de 2029, no el estado actual.\u003c/div>\n      \u003cdiv class=\"cards three\">\u003cdiv class=\"mini-card\">\u003ch3>Fortalezas\u003c/h3>\u003cp>La cadena BIA → activos → riesgos → controles → indicadores → roadmap se puede recalcular por identificador. E.05 declara supuestos, residual esperado y sensibilidad económica; E.09 une políticas con evidencia y auditoría.\u003c/p>\u003c/div>\u003cdiv class=\"mini-card\">\u003ch3>Debilidades\u003c/h3>\u003cp>Faltan pruebas completas de recuperación, copia con RPO de 15 min, SIEM, MFA administrativo y segmentación fuera de tarjetas. Los contratos y algunos costos necesitan verificación o cotización.\u003c/p>\u003c/div>\u003cdiv class=\"mini-card\">\u003ch3>Incertidumbres reales\u003c/h3>\u003cp>La duración del alterno no se ha probado, la generación del IBM Power no consta, la edición de Oracle no se confirma y las entrevistas/firma del caso son simuladas. E.12 ya tiene una versión de trabajo; falta actualizarla y ensayarla con cronómetro.\u003c/p>\u003c/div>\u003c/div>\n      \u003ch2>Qué pide E.11 a la dirección\u003c/h2>\u003col class=\"dense-list\">\u003cli>\u003cb>Aprobar roadmap y costo 2027\u003c/b>, incluido el SIEM por OBJ-03 y PCI DSS aunque su ROSI baja con la ARO mínima.\u003c/li>\u003cli>\u003cb>Resolver soporte del IBM i 7.4\u003c/b> antes de abril de 2027: contratar extensión o firmar excepción con compensaciones; determinar generación del IBM Power para presupuestar migración.\u003c/li>\u003cli>\u003cb>Autorizar prueba completa del core\u003c/b> y simulacros antes del 30 de junio de 2027; corregir en 30 días si supera 8 h, repetir la prueba y activar automatización si la conmutación manual es la causa.\u003c/li>\u003c/ol>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E11/E11_Documento_Final_LineaBase_BUNICA_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.11 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E10/E10_Roadmap_Madurez_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.10 ↗\u003c/a>\u003c/div>\n      \u003cdiv class=\"callout warning\">\u003cb>E.12 es una versión de trabajo:\u003c/b> la PPT vigente tiene nueve diapositivas de exposición, un anexo y tres respaldos. El guion asigna exactamente 10:00; ensayen para terminar entre 9:00 y 9:40 y actualicen esta guía cuando cambie la PPT.\u003c/div>\u003cbutton class=\"plain-btn\" data-nav=\"b8\">Preparar las preguntas del cliente →\u003c/button>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_originales/E12/E12_Presentacion_Ejecutiva_BUNICA_SENG.pptx\" target=\"_blank\" rel=\"noopener\">E.12 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E12/Guion_Defensa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">Guion ↗\u003c/a>\u003c/div>\n      \u003cdiv class=\"two-col\">\u003csection class=\"panel\">\u003ch3>Versión de 90 segundos\u003c/h3>\u003cp>«SENG estudió a BUNICA, un banco ficticio de 650 mil clientes. Primero medimos el impacto de detener sus procesos: el core y la compensación resultaron críticos. Luego ubicamos 24 activos y 14 riesgos. Dos escenarios son críticos: ransomware del core y robo de credenciales administrativas, ambos con valor inherente 20. El diseño propone MFA resistente al phishing, copia aislada y recuperación probada, segmentación, SIEM y gestión de terceros. Un ejemplo muestra la brecha: el RTO del core es 8 horas, pero la última prueba parcial tardó 11; el RPO es 15 minutos, pero la réplica es horaria. Los controles se detallan en E.07 y E.08, se miden con 16 indicadores y se ordenan en un roadmap de 153 salvaguardas hasta 2029. La inversión cuantificada de 2027 es USD 278,360, con partidas por cotizar. Pedimos a la dirección aprobar el plan y la prueba completa; el residual es una expectativa, no un resultado comprobado».\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Versión de cinco minutos · orden\u003c/h3>\u003col>\u003cli>\u003cb>30 s:\u003c/b> negocio, clientes y la cadena de entregables.\u003c/li>\u003cli>\u003cb>60 s:\u003c/b> BIA, core/compensación, 8 h de RTO y 15 min de RPO frente a las brechas.\u003c/li>\u003cli>\u003cb>60 s:\u003c/b> activos y 14 riesgos; explicar R-01/R-02 y apetito residual Medio.\u003c/li>\u003cli>\u003cb>90 s:\u003c/b> seis controles E.07, 108 filas E.08, políticas frente a SOP, evidencia e indicadores.\u003c/li>\u003cli>\u003cb>45 s:\u003c/b> auditoría propuesta y 8 acciones correctivas.\u003c/li>\u003cli>\u003cb>45 s:\u003c/b> roadmap 75/137/153 y tres decisiones de dirección.\u003c/li>\u003cli>\u003cb>30 s:\u003c/b> límites: supuestos, costos por cotizar, versión actual de E.12 y ausencia de implementación.\u003c/li>\u003c/ol>\u003c/section>\u003c/div>\n      \u003cdiv class=\"defense-only callout\">\u003cb>Pregunta incómoda:\u003c/b> «¿Demostraron que el riesgo residual ya bajó?» No. E.05 calcula un residual esperado si el tratamiento se implanta y prueba. E.09 define la evidencia que debería demostrarlo; mientras tanto, la revisión de dirección informa el inherente.\u003c/div>","b1":"\n      \u003cdiv class=\"callout\">\u003cb>Tu responsabilidad, según E.01:\u003c/b> Christopher figura como arquitecto de controles y responsable de E.07, E.08 y E.09. E.10 tiene como responsable al consultor líder. Tu papel es convertir la matriz de riesgos en requisitos ejecutables, medibles y auditables.\u003c/div>\n      \u003cdiv class=\"cards three\">\u003cdiv class=\"mini-card\">\u003ch3>Recibís\u003c/h3>\u003cp>E.03 entrega criticidad y tiempos; E.04, activos y dueños; E.05, amenazas, brechas, tratamientos y residuales; E.06, quién ejecuta y quién responde.\u003c/p>\u003c/div>\u003cdiv class=\"mini-card\">\u003ch3>Diseñás\u003c/h3>\u003cp>E.07: seis controles con política, SOP y medidas. E.08: baseline IG3 completo, incluida tu asignación directa de CIS 4 y CIS 16. E.09: 16 indicadores y programa de auditoría.\u003c/p>\u003c/div>\u003cdiv class=\"mini-card\">\u003ch3>Entregás a otros\u003c/h3>\u003cp>Al consultor líder: dependencias, prioridades y costos que E.10 ordena. A documentación y calidad: referencias, coherencia entre cifras, reglas, estados y evidencia.\u003c/p>\u003c/div>\u003c/div>\n      \u003csection class=\"panel\">\u003ch3>No confundás los dos roles de seguridad\u003c/h3>\u003cp>\u003cb>Arquitecto de SENG:\u003c/b> diseña la propuesta académica, explica por qué CIS 12, 15, 13, 6, 11 y 5 tienen prioridad y cómo se medirían. \u003cb>Oficial de seguridad de BUNICA:\u003c/b> función interna simulada que aprueba reglas o rinde cuentas según RACI, evalúa excepciones y reporta a Presidencia. La responsabilidad de operar recae mayormente en Operaciones y Tecnología.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E01/E01_Acta_Equipo_Seleccion_Empresa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.01 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E06/E06_Matriz_RACI_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.06 ↗\u003c/a>\u003c/div>\u003c/section>\n      \u003cdiv class=\"detail-only panel\">\u003ch3>Decisiones que tenés que saber defender\u003c/h3>\u003col class=\"dense-list\">\u003cli>Por qué el diseño se ancla en R-01/R-02 y en los objetivos con fecha de E.02.\u003c/li>\u003cli>Por qué algunos IG2/IG3 se adelantan y otros se difieren; la dependencia pesa más que el número del grupo.\u003c/li>\u003cli>Por qué una política fija un umbral, un SOP produce una evidencia y un indicador usa esa evidencia.\u003c/li>\u003cli>Por qué el estado «Por implementar» de E.08 se mantiene aunque la medida esté descrita con detalle.\u003c/li>\u003cli>Cómo se reparte la RACI entre TI, oficial, dueños, Presidencia y Auditoría.\u003c/li>\u003cli>Qué ocurre si falla la prueba del core, una alerta, una evaluación de proveedor o una medición mensual.\u003c/li>\u003c/ol>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_12_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS12 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E08/E08_Checklist_Baseline_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.08 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E09/E09_Indicadores_Auditoria_Interna_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.09 ↗\u003c/a>\u003c/div>\u003c/div>\n      \u003cdiv class=\"defense-only callout\">\u003cb>Respuesta corta:\u003c/b> «Mi aporte no fue configurar BUNICA; fue diseñar controles con regla, procedimiento, evidencia, indicador y prueba. Debo poder mostrar la trazabilidad desde un riesgo y reconocer que la implantación futura requiere verificación».\u003c/div>","b2":"\n      \u003cdiv class=\"callout\">\u003cb>Método:\u003c/b> riesgo → control CIS → salvaguarda → política → SOP → medida técnica/administrativa/física → evidencia → indicador → auditoría → roadmap. Cada paso tiene que resolver una pregunta que el anterior deja abierta.\u003c/div>\n      \u003cdiv class=\"flow\">\u003cspan>R-01 · ransomware\u003c/span>\u003ci>→\u003c/i>\u003cspan>CIS 11/12/13\u003c/span>\u003ci>→\u003c/i>\u003cspan>11.4 · copia aislada\u003c/span>\u003ci>→\u003c/i>\u003cspan>política\u003c/span>\u003ci>→\u003c/i>\u003cspan>SOP\u003c/span>\u003ci>→\u003c/i>\u003cspan>acta de prueba\u003c/span>\u003ci>→\u003c/i>\u003cspan>IND-09\u003c/span>\u003ci>→\u003c/i>\u003cspan>auditoría\u003c/span>\u003ci>→\u003c/i>\u003cspan>INI-06\u003c/span>\u003c/div>\n      \u003cdiv class=\"two-col\">\u003csection class=\"panel blue\">\u003ch3>Política: qué se exige\u003c/h3>\u003cp>Es una regla aprobada que fija alcance, responsables, umbral y excepciones. Ejemplo de BUNICA: la recuperación del core debe demostrarse en ≤8 h; la copia aislada debe mantenerse separada de la réplica que puede copiar el cifrado. La política expresa una obligación que un auditor puede contrastar.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>SOP: cómo se ejecuta\u003c/h3>\u003cp>Es la secuencia operativa: quién declara la prueba, cómo restaura en el sitio alterno, qué datos comprueba el dueño, desde cuándo y hasta cuándo se mide, dónde se guarda el acta y a quién se escala si excede 8 h. Sin pasos y registro, la política queda como intención.\u003c/p>\u003c/section>\u003c/div>\n      \u003cdiv class=\"panel\">\u003ch3>La cadena de prueba, completa\u003c/h3>\u003col class=\"dense-list\">\u003cli>\u003cb>Riesgo:\u003c/b> R-01 combina red plana, réplica que copia el cifrado y recuperación no demostrada.\u003c/li>\u003cli>\u003cb>Control y salvaguarda:\u003c/b> CIS 11 con 11.4 (copia aislada) y 11.5 (prueba), apoyado por CIS 12 y 13.\u003c/li>\u003cli>\u003cb>Medidas:\u003c/b> técnica (copia aislada, reglas de red); administrativa (procedimiento, aprobación, calendario); física (cinta custodiada, sitio alterno y energía verificada).\u003c/li>\u003cli>\u003cb>Evidencia:\u003c/b> configuración, cadena de custodia de la cinta, acta con inicio/fin y verificación del dueño.\u003c/li>\u003cli>\u003cb>Indicador:\u003c/b> IND-09 compara horas reales con RTO 8 h; el acta informa además pérdida de datos frente al RPO 15 min.\u003c/li>\u003cli>\u003cb>Auditoría:\u003c/b> recalcula el indicador, inspecciona la prueba y abre AC-01 o AC-02 si RPO/RTO fallan.\u003c/li>\u003cli>\u003cb>Roadmap:\u003c/b> INI-06 primero, INI-33 para cerrar la brecha de réplica; INI-50 solo si la prueba muestra conmutación manual como causa.\u003c/li>\u003c/ol>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E05/E05_Matriz_Riesgos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.05 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_11_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS11 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E09/E09_Indicadores_Auditoria_Interna_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.09 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E10/E10_Roadmap_Madurez_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.10 ↗\u003c/a>\u003c/div>\u003c/div>\n      \u003cdiv class=\"detail-only panel\">\u003ch3>Cómo diseñar una medida defendible\u003c/h3>\u003cp>Escribí primero el escenario y el cambio de probabilidad o impacto que esperás. Indicá el activo y su dueño. Elegí una salvaguarda que realmente interrumpa el camino del ataque o reduzca la pérdida; evitá escogerla solo por moda. La política debe tener un criterio binario o medible, el SOP debe producir un registro con fecha y firma, el indicador debe tener universo y frecuencia, y la auditoría debe poder reproducir el cálculo. Si hay una dependencia sin resolver, marcá la salvaguarda al roadmap y explicá cuál iniciativa la habilita.\u003c/p>\u003cp>\u003cb>Ejemplo de mala formulación:\u003c/b> «mejorar los respaldos». \u003cb>Mejor formulación:\u003c/b> «prueba completa anual del core en el sitio de contingencia, ≤8 h, con acta de tiempo y datos perdidos; restauración trimestral de una muestra validada por su dueño».\u003c/p>\u003c/div>\n      \u003cdiv class=\"defense-only callout\">\u003cb>Pregunta:\u003c/b> «¿Qué diferencia una política de un SOP?» La política dice qué resultado exige la dirección y a quién aplica; el SOP dice cómo una persona concreta lo consigue y qué evidencia deja. Una no sustituye a la otra.\u003c/div>","b8":"\n      \u003cdiv class=\"callout\">\u003cb>Esta es la versión de trabajo de E.12:\u003c/b> nueve diapositivas para exponer en diez minutos, más anexo y tres respaldos. Las preguntas siguientes son las que el profesor, actuando como cliente, necesita poder responder al escuchar cada bloque. La PPT puede cambiar; contrastá esta guía con la versión vigente antes de ensayar.\u003c/div>\n      \u003csection class=\"panel blue\">\u003ch2>Tu intervención: diapositiva 5\u003c/h2>\u003cp>\u003cb>Dos minutos.\u003c/b> Decí primero el criterio: seleccionamos los seis controles por cobertura de riesgos Críticos y Altos de E.05. Luego uní cada control con una acción visible: \u003cb>CIS 12\u003c/b> segmenta la red; \u003cb>15\u003c/b> exige cláusulas y evaluación a proveedores; \u003cb>13\u003c/b> centraliza alertas en SIEM; \u003cb>6\u003c/b> pone FIDO2 a administradores y segundo factor en la app; \u003cb>11\u003c/b> aísla la copia y prueba recuperación ≤8 h; \u003cb>5\u003c/b> separa las cuentas de administración.\u003c/p>\u003cp>\u003cb>Cifra de cierre:\u003c/b> cubren 9 de 11 riesgos Críticos y Altos. Para R-02, las llaves de 30 administradores cuestan USD 7 994/año en el supuesto de E.05 y el beneficio anual esperado es USD 275 400; ROSI calculado 3 345 %. Presentá el retorno como estimación, no ahorro observado.\u003c/p>\u003cp>\u003cb>Tu aporte además de la diapositiva 5:\u003c/b> E.08 te asigna CIS 4 y 16, con 26 salvaguardas del baseline; en E.12 sos suplente de las diapositivas 6 y 7. Tené listas las cifras 0 completas / 4 parciales / 125 diseñadas / 24 al roadmap y los ejemplos IND-07 e IND-09.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E05/E05_Matriz_Riesgos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.05 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_12_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS12 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E08/E08_Checklist_Baseline_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.08 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E09/E09_Indicadores_Auditoria_Interna_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.09 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E12/Guion_Defensa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">Guion ↗\u003c/a> · \u003ca href=\"fuentes_originales/E12/E12_Presentacion_Ejecutiva_BUNICA_SENG.pptx\" target=\"_blank\" rel=\"noopener\">E.12 ↗\u003c/a>\u003c/div>\u003c/section>\n      \u003ch2>Las nueve preguntas del cliente\u003c/h2>\u003cp>Leé cada tarjeta como una respuesta de 20 a 30 segundos: \u003cb>decisión → cifra o ID → fuente → condición que aún debe comprobarse.\u003c/b> El profesor puede escoger a cualquier integrante para cualquiera de las dos preguntas finales. La diapositiva 5 está abierta primero porque es tu intervención principal.\u003c/p>\u003cdetails class=\"accordion client-question\" >\u003csummary>\u003cspan class=\"eyebrow\">DIAPOSITIVA 1 · Portada · Diego · 0:30\u003c/span>\u003cspan>¿Sé quién integra el equipo consultor y qué IG tiene asignado mi organización?\u003c/span>\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>\u003cb>Respuesta al cliente:\u003c/b> SENG tiene seis integrantes con roles definidos; BUNICA tiene asignado IG3, cuyo baseline suma 153 salvaguardas (56 IG1 + 74 IG2 + 23 IG3). Es una meta asignada al caso, no una certificación ni el estado actual.\u003c/p>\u003cp>\u003cb>Repregunta o límite:\u003c/b> ¿Por qué IG3? Por el perfil bancario, los datos regulados y los servicios críticos del caso; E.08 confirma el baseline asignado.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E01/E01_Acta_Equipo_Seleccion_Empresa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.01 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E08/E08_Checklist_Baseline_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.08 ↗\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"accordion client-question\" >\u003csummary>\u003cspan class=\"eyebrow\">DIAPOSITIVA 2 · Organización y alcance · Diego · 1:00\u003c/span>\u003cspan>¿Sé qué parte de mi organización cubre el trabajo y qué quedó fuera?\u003c/span>\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>\u003cb>Respuesta al cliente:\u003c/b> El SGSI cubre los cuatro procesos del perfil y los dos soportes que añadió el BIA, además de sedes, sistemas, identidades, datos e interfaces que BUNICA controla. La infraestructura operada por terceros queda fuera del control directo, pero sus contratos, configuraciones, interfaces y riesgos sí se gestionan.\u003c/p>\u003cp>\u003cb>Repregunta o límite:\u003c/b> Si preguntan por Azure o tarjetas: explicá la responsabilidad compartida y enlazá R-07 con CIS 15.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E02/E02_Compromiso_Direccion_Alcance_SGSI_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.02 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/E03_BIA_Consolidacion_Procesos_Criticos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.03 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E05/E05_Matriz_Riesgos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.05 ↗\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"accordion client-question\" >\u003csummary>\u003cspan class=\"eyebrow\">DIAPOSITIVA 3 · Panorama del BIA · Roberto Morán · 1:30\u003c/span>\u003cspan>¿Sé cuál es mi proceso más crítico y cuánto me cuesta cada hora detenido?\u003c/span>\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>\u003cb>Respuesta al cliente:\u003c/b> P-01, el core, tiene puntaje BIA 4,42. Cada hora sin core cuesta al menos USD 10 924 en horario de sucursales. Su RTO es 8 h y la última prueba parcial tardó 11 h; el RPO exige 15 min frente a una réplica horaria.\u003c/p>\u003cp>\u003cb>Repregunta o límite:\u003c/b> La cifra por hora es un piso: no monetiza todas las sanciones. No sumés el costo horario a la SLE de USD 612 000 como si fueran pérdidas independientes.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E03/E03_BIA_Consolidacion_Procesos_Criticos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.03 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E05/E05_Matriz_Riesgos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.05 ↗\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"accordion client-question\" >\u003csummary>\u003cspan class=\"eyebrow\">DIAPOSITIVA 4 · Mapa de calor · Oscar · 1:30\u003c/span>\u003cspan>¿Sé cuáles son mis riesgos prioritarios?\u003c/span>\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>\u003cb>Respuesta al cliente:\u003c/b> R-01 y R-02 son los dos Críticos, 20/25. Ambos pueden terminar en el core cifrado: uno por ransomware que cruza la red plana y otro por una credencial administrativa sin segundo factor. Hay 14 riesgos: 2 Críticos, 9 Altos, 2 Medios y 1 Bajo.\u003c/p>\u003cp>\u003cb>Repregunta o límite:\u003c/b> El residual máximo Medio es una expectativa condicionada a que las medidas operen y se prueben; hoy se informa el inherente.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E05/E05_Matriz_Riesgos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.05 ↗\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"accordion client-question\" open>\u003csummary>\u003cspan class=\"eyebrow\">DIAPOSITIVA 5 · Seis controles clave · Christopher · 2:00\u003c/span>\u003cspan>¿Sé qué seis controles me proponen y qué riesgo trata cada uno?\u003c/span>\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>\u003cb>Respuesta al cliente:\u003c/b> CIS 12 trata R-01/R-03/R-08/R-10; CIS 15, R-07/R-10/R-11; CIS 13, R-01/R-03; CIS 6, R-02/R-05; CIS 11, R-01/R-06; CIS 5, R-02. Los seis cubren 9 de los 11 riesgos Críticos y Altos; R-04 y R-09 se cubren con el baseline E.08.\u003c/p>\u003cp>\u003cb>Repregunta o límite:\u003c/b> Si preguntan por la selección: el 12 cubre 4 riesgos, el 15 cubre 3; el 13, 6 y 11 cubren 2 y un Crítico; el 5 gana el último lugar porque cubre R-02, Crítico.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E05/E05_Matriz_Riesgos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.05 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_12_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS12 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E08/E08_Checklist_Baseline_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.08 ↗\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"accordion client-question\" >\u003csummary>\u003cspan class=\"eyebrow\">DIAPOSITIVA 6 · Baseline IG3 · Angie · 0:45; Christopher suplente\u003c/span>\u003cspan>¿Sé cuántas de las 153 salvaguardas cumplo hoy y cuántas faltan?\u003c/span>\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>\u003cb>Respuesta al cliente:\u003c/b> Hoy hay 0 salvaguardas completas; 4 existen parcialmente, 125 tienen medida diseñada para implementar y 24 quedan al roadmap por dependencias. El universo de 153 se documenta en E.07 (45) y E.08 (108). Ninguna salvaguarda se cuenta como operativa solo por estar escrita.\u003c/p>\u003cp>\u003cb>Repregunta o límite:\u003c/b> Si el cliente pregunta por tus CIS 4 y 16: son 26 filas dentro de las 108 de E.08; desarrollaste sus medidas, estado y evidencia, aunque no pertenecen a los seis E.07.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_12_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS12 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E08/E08_Checklist_Baseline_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.08 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E10/E10_Roadmap_Madurez_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.10 ↗\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"accordion client-question\" >\u003csummary>\u003cspan class=\"eyebrow\">DIAPOSITIVA 7 · Indicadores y auditoría · Angie · 0:45; Christopher suplente\u003c/span>\u003cspan>¿Sé cómo voy a comprobar que los controles funcionan?\u003c/span>\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>\u003cb>Respuesta al cliente:\u003c/b> E.09 propone 16 indicadores y auditoría independiente. IND-07 mide administradores con FIDO2: 0 % hoy, meta 100 % al 30 jun 2027. IND-09 mide la recuperación del core: última prueba parcial 11 h frente a meta ≤8 h. Auditoría Interna contrasta registros, recalcula medidas y verifica correcciones.\u003c/p>\u003cp>\u003cb>Repregunta o límite:\u003c/b> Una política, un SOP o una cotización no prueban eficacia: pedí evidencia fechada, indicador calculado y revisión independiente.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E06/E06_Matriz_RACI_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.06 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E09/E09_Indicadores_Auditoria_Interna_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.09 ↗\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"accordion client-question\" >\u003csummary>\u003cspan class=\"eyebrow\">DIAPOSITIVA 8 · Roadmap · Roberto Polanco · 1:30\u003c/span>\u003cspan>¿Sé qué se hace primero y en qué plazo?\u003c/span>\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>\u003cb>Respuesta al cliente:\u003c/b> Primero, cuentas dedicadas, FIDO2, copia aislada y prueba del core para R-02/R-01. E.10 propone 75 salvaguardas operativas al 30 jun 2027, 137 acumuladas al 30 jun 2028 y 153 al 31 dic 2029. Segmentación y SIEM siguen inventario, zonas y compras.\u003c/p>\u003cp>\u003cb>Repregunta o límite:\u003c/b> La secuencia es una propuesta con dependencias; 75/137/153 son metas acumuladas futuras, no cobertura actual.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E10/E10_Roadmap_Madurez_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.10 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E11/E11_Documento_Final_LineaBase_BUNICA_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.11 ↗\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"accordion client-question\" >\u003csummary>\u003cspan class=\"eyebrow\">DIAPOSITIVA 9 · Decisiones al cliente · Diego · 0:30\u003c/span>\u003cspan>¿Sé qué decisión debo tomar hoy?\u003c/span>\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>\u003cb>Respuesta al cliente:\u003c/b> Solicitamos aprobar el roadmap y el costo cuantificado de 2027 (USD 278 360); contratar la extensión de IBM i 7.4 antes del 30 abr 2027 o formalizar la excepción; y autorizar la prueba completa del core antes del 30 jun 2027.\u003c/p>\u003cp>\u003cb>Repregunta o límite:\u003c/b> El costo cuantificado no incluye toda partida por cotizar. Si la prueba supera 8 h, se corrige, se repite y se mantiene visible la brecha.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E02/E02_Compromiso_Direccion_Alcance_SGSI_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.02 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E10/E10_Roadmap_Madurez_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.10 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E11/E11_Documento_Final_LineaBase_BUNICA_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.11 ↗\u003c/a>\u003c/div>\u003c/div>\u003c/details>\n      \u003cdiv class=\"two-col\">\u003csection class=\"panel\">\u003ch3>Cómo ensayar las dos preguntas\u003c/h3>\u003col>\u003cli>Elegí dos tarjetas al azar, incluso fuera de tu bloque.\u003c/li>\u003cli>Respondé en 30 segundos y nombrá al menos un ID o una cifra con su entregable.\u003c/li>\u003cli>Pedí una repregunta: «¿Cómo lo comprobarían?» o «¿Qué pasa si falla?».\u003c/li>\u003cli>Separá diseño, meta y operación real. Si falta una cifra exacta, indicá el documento y el razonamiento.\u003c/li>\u003c/ol>\u003cbutton class=\"primary-btn\" data-nav=\"entrenador\">Abrir entrenador →\u003c/button>\u003c/section>\u003csection class=\"panel\">\u003ch3>Tiempo y material de respaldo\u003c/h3>\u003cp>El reparto del guion suma \u003cb>10:00 asignados\u003c/b>, exactamente el corte del docente. El propio guion pide ensayar entre \u003cb>9:00 y 9:40\u003c/b>; recorten dentro de cada bloque para conservar margen. La presentación activa usa las diapositivas 1–9. La 10 es anexo; la 11 cuantifica riesgos, la 12 lista los 14 riesgos y la 13 verifica trazabilidad. Abran estas tres solo ante una pregunta.\u003c/p>\u003cp>Tu suplente en la 5 es Diego; vos sos suplente de Angie en la 6 y la 7.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E12/Guion_Defensa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">Guion ↗\u003c/a> · \u003ca href=\"fuentes_originales/E12/E12_Presentacion_Ejecutiva_BUNICA_SENG.pptx\" target=\"_blank\" rel=\"noopener\">E.12 ↗\u003c/a>\u003c/div>\u003c/section>\u003c/div>\n      \u003csection class=\"panel\">\u003ch3>Fuentes vigentes de esta defensa\u003c/h3>\u003cp>Estudiá el guion y la PPT juntos. La PPT es la versión recibida hoy y se actualizará; al recibir otra, habrá que revisar cifras, tiempos y reparto en esta página.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E12/Guion_Defensa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">Guion ↗\u003c/a> · \u003ca href=\"fuentes_originales/E12/E12_Presentacion_Ejecutiva_BUNICA_SENG.pptx\" target=\"_blank\" rel=\"noopener\">E.12 ↗\u003c/a>\u003c/div>\u003c/section>","c0":"\u003cdiv class=\"callout\">\u003cb>Parte C · preparación individual.\u003c/b> El guion actual reparte la exposición entre seis integrantes. Cada persona tiene una guía con tres secciones detalladas, sus fuentes y preguntas de ensayo. El profesor puede preguntar a cualquiera sobre cualquier diapositiva: estudien su bloque y luego ensayen preguntas cruzadas.\u003c/div>\u003cdiv class=\"cards three\">\u003carticle class=\"mini-card\">\u003cspan class=\"eyebrow\">Consultor líder\u003c/span>\u003ch3>Diego Francisco Arévalo Miranda\u003c/h3>\u003cp>Diapositivas 1, 2 y 9 · 2:00 · suplente: Roberto Polanco (1–2); Angie (9)\u003c/p>\u003cbutton class=\"plain-btn\" data-nav=\"c1\">Abrir guía →\u003c/button>\u003c/article>\u003carticle class=\"mini-card\">\u003cspan class=\"eyebrow\">Analista de riesgos · responsable declarado\u003c/span>\u003ch3>Roberto Carlos Morán Gómez\u003c/h3>\u003cp>Diapositivas 3 · 1:30 · suplente: Oscar Pleités (3)\u003c/p>\u003cbutton class=\"plain-btn\" data-nav=\"c2\">Abrir guía →\u003c/button>\u003c/article>\u003carticle class=\"mini-card\">\u003cspan class=\"eyebrow\">Analista de riesgos · rol compartido\u003c/span>\u003ch3>Oscar José Pleités Lemus\u003c/h3>\u003cp>Diapositivas 4 · 1:30 · suplente: Roberto Morán (4)\u003c/p>\u003cbutton class=\"plain-btn\" data-nav=\"c3\">Abrir guía →\u003c/button>\u003c/article>\u003carticle class=\"mini-card\">\u003cspan class=\"eyebrow\">Arquitecto de controles\u003c/span>\u003ch3>Christopher Alexander Marroquín Figueroa\u003c/h3>\u003cp>Diapositivas 5 · 2:00 · suplente: Diego Arévalo (5); Christopher también suple 6 y 7\u003c/p>\u003cbutton class=\"plain-btn\" data-nav=\"c4\">Abrir guía →\u003c/button>\u003c/article>\u003carticle class=\"mini-card\">\u003cspan class=\"eyebrow\">Oficial de documentación\u003c/span>\u003ch3>Roberto Josué Polanco Hernández\u003c/h3>\u003cp>Diapositivas 8 · 1:30 · suplente: Diego Arévalo (8)\u003c/p>\u003cbutton class=\"plain-btn\" data-nav=\"c5\">Abrir guía →\u003c/button>\u003c/article>\u003carticle class=\"mini-card\">\u003cspan class=\"eyebrow\">Oficial de Calidad\u003c/span>\u003ch3>Angie Fiorella Alberto Guzmán\u003c/h3>\u003cp>Diapositivas 6 y 7 · 1:30 · suplente: Christopher Marroquín (6–7)\u003c/p>\u003cbutton class=\"plain-btn\" data-nav=\"c6\">Abrir guía →\u003c/button>\u003c/article>\u003c/div>\u003csection class=\"panel blue\">\u003ch3>Una respuesta útil ante el cliente\u003c/h3>\u003cp>Contestá en este orden: \u003cb>respuesta directa → ID o cifra → fuente → condición o límite.\u003c/b> Por ejemplo: «El core debe volver en ocho horas (P-01, E.03); la prueba parcial tardó once, así que aún no demostramos cumplir el RTO. La prueba completa propuesta medirá la brecha».\u003c/p>\u003cbutton class=\"primary-btn\" data-nav=\"b8\">Practicar las nueve preguntas del profesor →\u003c/button>\u003cbutton class=\"plain-btn\" data-nav=\"entrenador\">Abrir entrenador de preguntas →\u003c/button>\u003c/section>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E01/E01_Acta_Equipo_Seleccion_Empresa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.01 ↗\u003c/a> · \u003ca href=\"fuentes_originales/E12/E12_Presentacion_Ejecutiva_BUNICA_SENG.pptx\" target=\"_blank\" rel=\"noopener\">E.12 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E12/Guion_Defensa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">Guion ↗\u003c/a>\u003c/div>","c1":"\u003cdiv class=\"callout\">\u003cb>Diego Francisco Arévalo Miranda · Consultor líder\u003c/b>\u003cbr>Exponés las diapositivas 1, 2 y 9 (2:00 en total). Suplencia según el guion: Roberto Polanco (1–2); Angie (9). El rol y la presentación son dos responsabilidades distintas; esta guía prepara ambas sin reemplazar E.12.\u003c/div>\u003csection class=\"panel blue\">\u003ch2>Tu objetivo al presentar\u003c/h2>\u003cp>Abrir como firma consultora, delimitar lo que se analizó y cerrar pidiendo decisiones concretas a dirección.\u003c/p>\u003cp>\u003cb>Antes del ensayo:\u003c/b> leé en voz alta tu guion, comprobá cada cifra en la fuente enlazada y prepará una respuesta de 20–30 segundos para la pregunta probable. Después practicá dos preguntas de otros bloques; el profesor puede dirigirlas a cualquiera.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E01/E01_Acta_Equipo_Seleccion_Empresa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.01 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E02/E02_Compromiso_Direccion_Alcance_SGSI_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.02 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/E03_BIA_Consolidacion_Procesos_Criticos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.03 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E10/E10_Roadmap_Madurez_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.10 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E11/E11_Documento_Final_LineaBase_BUNICA_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.11 ↗\u003c/a> · \u003ca href=\"fuentes_originales/E12/E12_Presentacion_Ejecutiva_BUNICA_SENG.pptx\" target=\"_blank\" rel=\"noopener\">E.12 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E12/Guion_Defensa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">Guion ↗\u003c/a>\u003c/div>\u003c/section>\u003ch2>Estudio en profundidad\u003c/h2>\u003cp>Seguí estas secciones en orden: primero entendé el mensaje del bloque, luego las cifras y finalmente las objeciones. Abrí los documentos fuente

      if(row){
        const cells=[...row.cells].map(cell=>cell.innerText.replace(/\s+/g," ").trim()).filter(Boolean);
        const headers=[...(row.closest("table")?.querySelectorAll("thead th")||[])].map(cell=>cell.innerText.replace(/\s+/g," ").trim());
        const relation=cells.map((value,index)=>`${headers[index]||`Dato ${index+1}`}: ${value}`).join(" · ");
        return relation.length>230?relation.slice(0,227)+"…":relation;
      }
      const parent=target?.closest?.("p,li,summary,.mini-card,.callout,.panel,section");
      const context=parent?.innerText?.replace(/\s+/g," ").trim().replace(/\b(?:P|R)-\d{2}\b/g,"").replace(/\s+/g," ").trim();
      return context?context.slice(0,200)+(context.length>200?"…":""):"Referencia en el contenido de esta sección.";
    }
    function entityPreviewHTML(id,target){
      const context=previewContext(target);
      const contextHTML=`<p class="preview-context"><b>En este contexto:</b> ${esc(context)}</p>`;
      if(id.startsWith("CIS-")){
        const number=Number(id.slice(4));if(!CIS_NAMES[number])return "";
        const developed=D.developedSafeguards.filter(x=>x.control===number),baseline=D.baseline.filter(x=>x.control===number);
        const risks=D.risks.filter(r=>r.controls.includes(number)).map(r=>r.id);
        return `${contextHTML}<strong>CIS ${number} · ${esc(CIS_NAMES[number])}</strong><p>${esc(CONTROL_ANALOGY[number]||"Familia de salvaguardas para reducir exposición y mejorar la capacidad de respuesta.")}</p><p class="preview-meta"><b>Por qué se usa:</b> ${esc(CONTROL_REASON[number]||"Forma parte del baseline de seguridad mapeado para BUNICA.")}</p><p class="preview-meta">${developed.length} salvaguardas desarrolladas en E.07 · ${baseline.length} mapeadas en E.08</p><p class="preview-meta">Riesgos vinculados en E.05: ${risks.map(esc).join(", ")||"no aparecen asociados directamente"}</p>`;
      }
      if(id.startsWith("P-")){
        const p=D.processes.find(x=>x.id===id);if(!p)return "";
        const assets=D.assets.filter(a=>a.processes.includes(id));
        const risks=[...new Set(assets.flatMap(a=>a.risks))];
        const timing=[["MTPD",p.mtpd],["RTO",p.rto],["WRT",p.wrt],["RPO",p.rpo]].map(([k,v])=>v&&v!=="—"?`<span><b>${k}</b> ${esc(v)}</span>`:"").filter(Boolean).join(" · ");
        return `${contextHTML}<strong>${esc(p.id)} · ${esc(p.name)}</strong><p>${esc(p.criticality)} · puntaje BIA ${esc(p.score)} · dueño: ${esc(p.owner.split(" — ")[0])}</p><p class="preview-meta">${timing||"El BIA no fijó métricas individuales de recuperación."}</p><p class="preview-meta">${assets.length?`Activos ${assets.map(a=>esc(a.id)).join(", ")} · riesgos ${risks.map(esc).join(", ")||"sin riesgo vinculado"}`:"E.04 no asigna activos en el inventario priorizado."}</p>`;
      }
      const r=D.risks.find(x=>x.id===id);if(!r)return "";
      return `${contextHTML}<strong>${esc(r.id)} · ${esc(r.threat)}</strong><p>${esc(r.vulnerability)}</p><p class="preview-meta">Inherente: ${r.p} × ${r.i} = ${r.p*r.i} · residual esperado: ${r.residualP} × ${r.residualI} = ${r.residual}</p><p class="preview-meta">Activos: ${r.assets.map(esc).join(", ")||"—"} · controles: ${r.controls.map(n=>"CIS "+n).map(esc).join(", ")||"aceptación"}</p>`;
    }
    function positionEntityPreview(){
      if(!entityTarget?.isConnected||entityPreview.hidden)return closeEntityPreview();
      const rect=entityTarget.getBoundingClientRect(),w=entityPreview.offsetWidth,h=entityPreview.offsetHeight,gap=9,pad=12;
      const left=Math.max(pad,Math.min(rect.left,window.innerWidth-w-pad));
      let top=rect.bottom+gap;if(top+h>window.innerHeight-pad)top=rect.top-h-gap;
      entityPreview.style.left=`${left}px`;entityPreview.style.top=`${Math.max(pad,Math.min(top,window.innerHeight-h-pad))}px`;
    }
    function showEntityPreview(target,pinned=false){
      const id=target?.dataset.previewId;if(!id)return;
      if(entityTarget&&entityTarget!==target&&entityTarget.isConnected)entityTarget.setAttribute("aria-expanded","false");
      clearTimeout(entityTimer);entityTarget=target;entityPinned=pinned;
      target.setAttribute("aria-expanded","true");entityPreview.innerHTML=entityPreviewHTML(id,target);entityPreview.hidden=!entityPreview.innerHTML;
      requestAnimationFrame(positionEntityPreview);
    }
    function closeEntityPreview(){
      clearTimeout(entityTimer);if(entityTarget?.isConnected)entityTarget.setAttribute("aria-expanded","false");
      entityTarget=null;entityPinned=false;entityPreview.hidden=true;entityPreview.innerHTML="";
    }
    function decorateEntityReferences(){
      const root=document.getElementById("view"),skip="button,a,[data-action],[data-preview-id],svg,script,style,textarea,select,option";
      if(!root)return;
      const reference=/\b(?:P|R)-\d{2}\b|\bCIS\s+\d{1,2}(?:\s*(?:\/|,|\by\b)\s*\d{1,2})*/i;
      const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(node){return reference.test(node.nodeValue)&&!node.parentElement?.closest(skip)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});
      const textNodes=[];while(walker.nextNode())textNodes.push(walker.currentNode);
      const pattern=/\b(?:P|R)-\d{2}\b|\bCIS\s+\d{1,2}(?:\s*(?:\/|,|\by\b)\s*\d{1,2})*/gi;
      for(const node of textNodes){
        const value=node.nodeValue,fragment=document.createDocumentFragment();let cursor=0,match;
        pattern.lastIndex=0;
        while((match=pattern.exec(value))){
          fragment.append(document.createTextNode(value.slice(cursor,match.index)));
          const raw=match[0],isControl=/^CIS\s/i.test(raw),numbers=isControl?[...raw.matchAll(/\d{1,2}/g)]:[];
          const addButton=(id,label)=>{const button=document.createElement("button");button.type="button";button.className="entity-inline";button.dataset.previewId=id;button.setAttribute("aria-haspopup","true");button.setAttribute("aria-expanded","false");button.title=isControl?`CIS ${id.slice(4)} · ${CIS_NAMES[Number(id.slice(4))]||"Ver control"}`:`Ver resumen de ${id}`;button.setAttribute("aria-label",button.title);button.textContent=label;fragment.append(button);};
          if(isControl&&numbers.length&&numbers.every(item=>CIS_NAMES[Number(item[0])])){
            let partStart=0;numbers.forEach(item=>{const start=item.index;fragment.append(document.createTextNode(raw.slice(partStart,start)));addButton(`CIS-${item[0]}`,item[0]);partStart=start+item[0].length;});fragment.append(document.createTextNode(raw.slice(partStart)));
          }else if(isControl){fragment.append(document.createTextNode(raw));}
          else addButton(raw,raw);
          cursor=pattern.lastIndex;
        }
        fragment.append(document.createTextNode(value.slice(cursor)));node.parentNode.replaceChild(fragment,node);
      }
    }
    document.addEventListener("pointerover",event=>{if(event.pointerType==="touch")return;const target=event.target.closest?.("[data-preview-id]");if(target)showEntityPreview(target,false);});
    document.addEventListener("pointerout",event=>{const target=event.target.closest?.("[data-preview-id]");if(!target||entityPinned||event.relatedTarget?.closest?.("[data-preview-id]")===target)return;entityTimer=setTimeout(()=>{if(!entityTarget?.matches(":hover")&&!entityTarget?.matches(":focus"))closeEntityPreview();},130);});
    document.addEventListener("focusin",event=>{const target=event.target.closest?.("[data-preview-id]");if(target)showEntityPreview(target,false);});
    document.addEventListener("focusout",event=>{if(event.target.closest?.("[data-preview-id]")&&!entityPinned)entityTimer=setTimeout(()=>{if(!entityTarget?.matches(":hover")&&!entityTarget?.matches(":focus"))closeEntityPreview();},130);});
    window.addEventListener("scroll",positionEntityPreview,true);window.addEventListener("resize",positionEntityPreview);
    function applyAssetFilter(){const q=normalize(state.assetQuery),cat=state.assetCategory;let count=0;document.querySelectorAll("[data-asset-row]").forEach(row=>{const visible=(!q||normalize(row.dataset.search).includes(q))&&(!cat||row.dataset.cat===cat);row.hidden=!visible;if(visible)count++;});const el=document.getElementById("asset-count");if(el)el.textContent=`${count} de 24`;}
    function applyBaselineFilter(){const q=normalize(state.baselineQuery),status=state.baselineState;let count=0;document.querySelectorAll("[data-baseline-row]").forEach(row=>{const visible=(!q||normalize(row.dataset.search).includes(q))&&(status==="Todos"||row.dataset.state===status);row.hidden=!visible;if(visible)count++;});const el=document.getElementById("baseline-count");if(el)el.textContent=`${count} de 108`;}
    function afterRender(){closeEntityPreview();decorateEntityReferences();const asset=document.getElementById("asset-filter");if(asset){asset.value=state.assetQuery;document.getElementById("asset-category").value=state.assetCategory;applyAssetFilter();}const base=document.getElementById("baseline-filter");if(base){base.value=state.baselineQuery;document.getElementById("baseline-state").value=state.baselineState;applyBaselineFilter();}}
    const originalRender=render;render=function(){originalRender();afterRender();};
    const SEARCH_INDEX=[];
    for(const c of CHAPTERS){const copy=(CHAPTER_HTML[c.id]||"").replace(/<[^>]*>/g," ");SEARCH_INDEX.push({page:c.id,id:c.id,title:`${c.id.toUpperCase()} · ${c.title}`,content:normalize(c.title+" "+c.sub+" "+copy)});}
    for(const a of D.assets)SEARCH_INDEX.push({page:"a4",id:a.id,title:`${a.id} · ${a.name}`,content:normalize(a.name+" "+a.category+" "+a.processes.join(" ")+" "+a.risks.join(" "))});
    for(const r of D.risks)SEARCH_INDEX.push({page:"a5",id:r.id,title:`${r.id} · ${r.threat}`,content:normalize(r.threat+" "+r.vulnerability+" "+r.assets.join(" ")+" "+r.controlText)});
    for(const s of D.baseline.filter(x=>x.control===4||x.control===16))SEARCH_INDEX.push({page:"b5",id:s.id,title:`${s.id} · ${s.name}`,content:normalize(s.name+" "+s.measure+" "+s.evidence)});
    for(const i of D.indicators)SEARCH_INDEX.push({page:"b6",id:i.id,title:`${i.id} · ${i.name}`,content:normalize(i.name+" "+i.formula+" "+i.goal)});
    for(const x of D.initiatives)SEARCH_INDEX.push({page:"a7",id:x.id,title:`${x.id} · ${x.name}`,content:normalize(x.name+" "+x.safeguards+" "+x.outcome)});
    for(const n of [5,6,11,12,13,15])SEARCH_INDEX.push({page:"b3",id:"CIS-"+n,title:`CIS ${n} · ${CIS_NAMES[n]}`,content:normalize(CIS_NAMES[n]+" "+CONTROL_REASON[n])});
    function showSearch(){const input=document.getElementById("search"),host=document.getElementById("search-results"),q=normalize(input.value.trim());if(q.length<2){host.classList.remove("open");host.innerHTML="";return;}const found=SEARCH_INDEX.map(item=>({...item,score:(normalize(item.title).includes(q)?4:0)+(item.content.includes(q)?1:0)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.title.localeCompare(b.title)).slice(0,12);host.innerHTML=found.length?found.map(x=>`<button class="search-result" data-search-page="${x.page}" data-search-id="${esc(x.id)}"><b>${esc(x.title)}</b><small>${esc(CHAPTERS.find(c=>c.id===x.page)?.title||x.page)}</small></button>`).join(""):`<div class="no-results">Sin resultados. Probá con R-01, 16.14, RTO o IND-09.</div>`;host.classList.add("open");}
    function openSearchResult(page,id){document.getElementById("search-results").classList.remove("open");document.getElementById("search").value="";let target=null;if(page==="a4"&&id.startsWith("A-"))state.assetSelected=id;if(page==="a5"&&id.startsWith("R-"))state.riskSelected=id;if(page==="b5"&&/^\d+\.\d+$/.test(id)){state.safeguardFilter="Todos";target="safe-"+id.replace(".","-");}if(page==="b6"&&id.startsWith("IND-")){state.indicatorFilter="Todos";target="indicator-"+id;}if(page==="b3"&&id.startsWith("CIS-"))target="cis-"+id.slice(4);if(page==="a7"&&id.startsWith("INI-")){const ini=D.initiatives.find(x=>x.id===id);state.timeline=(ini?.horizon||"Corto").split(" ")[0].toLowerCase();}navigate(page);if(target)setTimeout(()=>{const el=document.getElementById(target);if(el){if(el.tagName==="DETAILS")el.open=true;el.scrollIntoView({block:"start"});}},0);}
    function updateDemo(){const p=state.demoP,i=state.demoI;const a=document.getElementById("demo-p-value"),b=document.getElementById("demo-i-value"),c=document.getElementById("demo-result");if(a)a.value=p;if(b)b.value=i;if(c)c.textContent=`${p} × ${i} = ${p*i} · ${riskLevel(p*i)}`;}
    function resetQuestion(){state.trainerAnswered=false;state.trainerChoice=null;state.trainerDraft="";}
    document.addEventListener("click",event=>{
      const entity=event.target.closest("[data-preview-id]");if(entity){event.preventDefault();if(entity.hasAttribute("data-action")){showEntityPreview(entity,true);}else{if(entityTarget===entity&&entityPinned)closeEntityPreview();else showEntityPreview(entity,true);return;}}
      if(entityTarget)closeEntityPreview();
      const mode=event.target.closest("[data-mode-btn]");if(mode){state.mode=mode.dataset.modeBtn;saveState();document.body.dataset.mode=state.mode;document.querySelectorAll("[data-mode-btn]").forEach(b=>b.classList.toggle("active",b.dataset.modeBtn===state.mode));const note=document.querySelector(".mode-note");if(note)note.textContent=state.mode==="express"?"Ruta rápida: ideas, decisiones y cifras esenciales.":state.mode==="detallado"?"Lectura completa: registros, procedimientos, evidencias y supuestos.":"Preparación oral: argumentá y reconocé los límites de la evidencia.";return;}
      const result=event.target.closest("[data-search-page]");if(result){openSearchResult(result.dataset.searchPage,result.dataset.searchId);return;}
      const nav=event.target.closest("[data-nav]");if(nav){event.preventDefault();navigate(nav.dataset.nav);return;}
      const action=event.target.closest("[data-action]");if(!action)return;
      const a=action.dataset.action,id=action.dataset.id;
      if(a==="toggle-done"){const y=window.scrollY;if(state.done.has(id))state.done.delete(id);else state.done.add(id);saveState();render();window.scrollTo(0,y);}
      else if(a==="asset-detail"){state.assetSelected=id;render();document.getElementById("asset-detail")?.scrollIntoView({block:"start"});}
      else if(a==="risk-detail"||a==="matrix-risk"){state.riskSelected=id;render();}
      else if(a==="risk-filter"){state.riskFilter=id;render();}
      else if(a==="timeline"){state.timeline=id;render();}
      else if(a==="safeguard-filter"){state.safeguardFilter=id;render();}
      else if(a==="map-view"){state.mapView=id;state.mapNode=state.mapProcess;render();}
      else if(a==="map-node"){state.mapNode=id;render();document.getElementById("map-panel")?.scrollIntoView({block:"nearest"});}
      else if(a==="trainer-mode"){state.trainerMode=id;resetQuestion();render();}
      else if(a==="trainer-random"){const list=filteredQuestions();state.trainerIndex=Math.floor(Math.random()*list.length);resetQuestion();render();}
      else if(a==="trainer-prev"||a==="trainer-next"){const list=filteredQuestions();state.trainerIndex=(state.trainerIndex+(a==="trainer-next"?1:-1)+list.length)%list.length;resetQuestion();render();}
      else if(a==="trainer-reveal"){state.trainerAnswered=!state.trainerAnswered;render();}
      else if(a==="trainer-choice"){state.trainerChoice=+id;state.trainerAnswered=true;render();}
    });
    document.addEventListener("input",event=>{
      const t=event.target;
      if(t.id==="search")showSearch();
      else if(t.id==="asset-filter"){state.assetQuery=t.value;applyAssetFilter();}
      else if(t.id==="baseline-filter"){state.baselineQuery=t.value;applyBaselineFilter();}
      else if(t.id==="demo-p"){state.demoP=+t.value;updateDemo();}
      else if(t.id==="demo-i"){state.demoI=+t.value;updateDemo();}
      else if(t.id==="open-answer")state.trainerDraft=t.value;
    });
    document.addEventListener("change",event=>{
      const t=event.target;
      if(t.id==="asset-category"){state.assetCategory=t.value;applyAssetFilter();}
      else if(t.id==="baseline-state"){state.baselineState=t.value;applyBaselineFilter();}
      else if(t.id==="indicator-filter"){state.indicatorFilter=t.value;render();}
      else if(t.id==="map-process"){state.mapProcess=t.value;state.mapRisk=mappedRisks(t.value)[0]?.id||"R-01";state.mapNode=t.value;render();}
      else if(t.id==="map-risk"){state.mapRisk=t.value;state.mapNode=t.value;render();}
      else if(t.id==="trainer-category"){state.trainerCategory=t.value;state.trainerIndex=0;resetQuestion();render();}
    });
    document.getElementById("menu-btn").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("open"));
    document.getElementById("glossary-btn").addEventListener("click",()=>{const dlg=document.getElementById("glossary");if(dlg.showModal)dlg.showModal();else dlg.setAttribute("open","");});
    document.getElementById("glossary-close").addEventListener("click",()=>{const dlg=document.getElementById("glossary");if(dlg.close)dlg.close();else dlg.removeAttribute("open");});
    document.getElementById("glossary-list").innerHTML=Object.entries(glossary).map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("");
    document.addEventListener("keydown",event=>{if(event.key==="/"&&event.target.tagName!=="INPUT"&&event.target.tagName!=="TEXTAREA"){event.preventDefault();document.getElementById("search").focus();}if(event.key==="Escape"){document.getElementById("search-results").classList.remove("open");closeEntityPreview();}});
    document.addEventListener("click",event=>{if(!event.target.closest(".search-box"))document.getElementById("search-results").classList.remove("open");});
    window.addEventListener("hashchange",()=>{const id=location.hash.slice(1);if(id!==state.page&&(CHAPTERS.some(c=>c.id===id)||TOOLS.some(t=>t.id===id)||id==="inicio")){state.page=id;render();}});
    const initial=location.hash.slice(1);if(CHAPTERS.some(c=>c.id===initial)||TOOLS.some(t=>t.id===initial))state.page=initial;
    render();

  </script>
</body>

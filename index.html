as filas 14 y 12 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-01 (activos de información de E.04 y sus dueños).\nSe adelanta 3.7 (IG2, del mediano) por R-04 y R-09: cierra BR-09 y BR-10, vulnerabilidades de R-04 y R-09, y la necesitan 3.1 y 14.4, que son IG1 (E.08).","outcome":"Esquema de cuatro niveles de E.04 aprobado como norma y con etiqueta obligatoria en los documentos nuevos de Microsoft 365 (3.7; los existentes se etiquetan en INI-32); proceso de gestión de datos e inventario de los datos de clientes (3.1, 3.2); permisos de los expedientes KYC y de los reportes a la UIF según la necesidad (3.3, tratamiento de R-09); retención y eliminación segura (3.4, 3.5); estaciones con el disco cifrado (3.6)."},{"id":"INI-10","name":"Cifrado en reposo de las bases con datos de clientes","origin":"Origen: E.08.","safeguards":"E.08, por implementar: 3.11","ig":"IG2 (1)","horizon":"Corto · mar–jun 2027","owner":"Operaciones y Tecnología (R de la fila 14 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-09 (inventario de los datos de clientes, 3.2); INI-01 (edición de Oracle 19c y plan de Microsoft 365, 2.1).\nSe adelanta 3.11 (IG2, del mediano) por R-04 y R-09: cierra BR-09 y BR-10, vulnerabilidades de R-04 y R-09 (Altos).","outcome":"Cifrado en reposo con las claves fuera del servidor de la base: Oracle 19c de canales con cifrado transparente de datos (si BUNICA no tiene licenciada la opción Advanced Security, que solo existe para la edición Enterprise, se compra; la ficha no registra la edición, que verifica 2.1; ver costos), la base del core con el cifrado que admita IBM i 7.4 y los expedientes KYC en Microsoft 365."},{"id":"INI-11","name":"Registros de auditoría activos en el origen","origin":"Origen: E.08.","safeguards":"E.08, por implementar: 8.1 a 8.3","ig":"IG1 (3)","horizon":"Corto · ene–jun 2027","owner":"Operaciones y Tecnología (R de la fila 23 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-01 (fuentes de registros de E.04 y del parque).","outcome":"Proceso de gestión de registros aprobado (8.1); registro de auditoría activo según el Benchmark en controladores de dominio, servidores Windows, estaciones, RHEL 8, Oracle 19c, IBM i, cortafuegos y cajeros (8.2; R-03, BR-05); espacio en el origen para la retención de 8.1, con alerta de capacidad (8.3). Mientras el SIEM no los reciba (INI-19), los registros del entorno de tarjetas se conservan 12 meses en el origen y se revisan cada día (PCI DSS v4.0.1, 10.4.1 y 10.5.1; REQ-05), y lo que las políticas de los controles 5, 6 y 12 de E.07 piden vigilar en el SIEM (uso de las cuentas de emergencia y de las excepciones) se revisa en el origen."},{"id":"INI-12","name":"Antimalware con consola central, navegador y correo con soporte y filtrado DNS","origin":"Origen: E.08.","safeguards":"E.08, por implementar: 9.1, 9.2, 10.2, 10.3, 10.6\nE.08, existentes parciales: 10.1","ig":"IG1 (5) · IG2 (1)","horizon":"Corto · ene–jun 2027","owner":"Operaciones y Tecnología (R de la fila 32 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-01 (equipos sin antimalware y software no autorizado, 2.3).\nSe adelanta 10.6 (IG2, del mediano): la necesitan 10.1 y 10.2 (IG1) para saber qué equipo no está protegido o actualizado (E.08).","outcome":"Antimalware en todos los equipos, que cierra la brecha de 10.1 (RHEL 8 de canales, cajeros y, en el IBM i, el que admita el fabricante), con firmas actualizadas y alerta del equipo sin actualizar en 24 horas (10.2), consola central (10.6) y autoejecución de los medios extraíbles deshabilitada (10.3); solo Edge y Outlook (S-18) en versión con soporte (9.1) y filtrado DNS de los dominios maliciosos (9.2)."},{"id":"INI-13","name":"Concientización del personal y del centro de llamadas","origin":"Origen: E.08.","safeguards":"E.08, por implementar: 14.1 a 14.8","ig":"IG1 (8)","horizon":"Corto · mar–jun 2027","owner":"Recursos Humanos (R de las filas 7 y 29 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-09 (esquema de clasificación, 3.7, que enseña 14.4).","outcome":"Programa anual para los 1 200 empleados, con la primera ronda completa al 30 de junio de 2027 (14.1 a 14.8) y simulaciones de phishing; el centro de llamadas, capacitado para reconocer la voz clonada (14.2, R-13), aplica la devolución de la llamada de INI-49."},{"id":"INI-14","name":"Respuesta a incidentes y notificación de vulneraciones en 72 horas","origin":"Origen: E.08.","safeguards":"E.08, por implementar: 17.1 a 17.7","ig":"IG1 (3) · IG2 (4)","horizon":"Corto · ene–jun 2027","owner":"El oficial de seguridad (R de la fila 6; A de la fila 5 de E.06) y Operaciones y Tecnología (R de la fila 5 de E.06); rinde cuentas la Presidencia (A de la fila 6)","dependencies":"Ninguna previa: la obligación de la LPDP rige desde el primer día.\nSe adelantan: 17.4 (IG2, del mediano) por OBJ-05 y REQ-01: OBJ-05 y la LPDP (art. 25) exigen notificar en 72 horas desde el 4 de enero de 2027; 17.5 (IG2, del mediano) por OBJ-05: delimita el proceso de 17.4 con los roles de quien notifica; 17.6 (IG2, del mediano) por OBJ-05: delimita el proceso de 17.4 con los medios para notificar si el correo está comprometido; 17.7 (IG2, del mediano) por OBJ-05 y R-06: OBJ-05 exige el primer ejercicio al 30 de junio de 2027 y el simulacro de los alternos cierra BR-08, vulnerabilidad de R-06 y R-08.","outcome":"Desde el 4 de enero de 2027, el oficial de seguridad gestiona los incidentes con un suplente de TI (17.1) y la notificación en 72 horas rige con la lista de contactos (17.2) y el canal de reporte (17.3); al 31 de marzo de 2027, proceso de respuesta con los criterios de vulneración notificable (LPDP, art. 25) y de interrupción que se reporta a la SSF, roles y medios de comunicación alternos (17.4 a 17.6); a más tardar el 30 de junio de 2027, primer ejercicio con la notificación simulada en 72 horas o menos (IND-16; OBJ-05) y simulacro de los alternos del core y de la compensación junto con la prueba de OBJ-01 (17.7; BR-08), cuya acta registra las horas que sostiene cada alterno frente a S-08 (control 11, paso 5)."},{"id":"INI-15","name":"Base de la gestión de proveedores: inventario, política y clasificación","origin":"Origen: E.07 (F.1) y E.09 (AC-04).","safeguards":"E.07, diseñadas ahora: 15.1 a 15.3, 15.6","ig":"IG1 (1) · IG2 (2) · IG3 (1)","horizon":"Corto · ene–mar 2027","owner":"Operaciones y Tecnología y Finanzas (R de la fila 26 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Ninguna previa: la política del control 15 de E.07 rige desde el 4 de enero de 2027.\nSe adelantan: 15.2 (IG2, del mediano) por R-07, R-10 y R-11: la necesita 15.4, tratamiento de R-07, R-10 y R-11, para exigir las cláusulas desde el primer contrato que se firme o renueve en 2027 (AC-04); 15.3 (IG2, del mediano) por R-07, R-10 y R-11: como 15.2; además, la clasificación decide qué proveedores son críticos; 15.6 (IG3, del largo) por R-07: es tratamiento de R-07 y el monitoreo mensual es la medida compensatoria con que la excepción del control 15 deja seguir los contratos sin cláusulas hasta su renovación.","outcome":"Inventario de proveedores con su clasificación por criticidad y su fecha de renovación (procesador de tarjetas, proveedor de la red MPLS, fabricante del core —IBM, A-24—, Microsoft y Salesforce, entre otros) (15.1, 15.3); política de gestión de proveedores vigente (15.2); calendario de renegociación de los contratos críticos (AC-04); monitoreo mensual de los proveedores críticos desde abril de 2027 (15.6)."},{"id":"INI-16","name":"Diagrama de red, flujos de datos y diseño de las zonas","origin":"Origen: E.08 y E.07 (F.1).","safeguards":"E.08, por implementar: 3.8\nE.07, diseñadas ahora: 12.4","ig":"IG2 (2)","horizon":"Corto · abr–jun 2027","owner":"Operaciones y Tecnología (R de la fila 22 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-01 (equipos de red y enlaces con su fabricante).\nSe adelantan: 12.4 (IG2, del mediano) por R-01 y R-03: sin el diagrama no hay zonas que aprobar, así que delimita 12.2 y 13.4, tratamiento de R-01 y R-03; 3.8 (IG2, del mediano) por R-01 y R-03: los flujos de datos son la base de las reglas que se permiten entre las zonas de 12.2 y 13.4.","outcome":"Diagrama de la red (12.4) y de los flujos de datos de los procesos del alcance con sus terceros (3.8) aprobados; zonas y reglas de filtrado entre la red de sucursales y el centro de datos diseñadas y aprobadas por el oficial de seguridad; enlaces críticos identificados para INI-18; cortafuegos internos adquiridos e instalados (S-14) para que la segmentación arranque en julio de 2027."},{"id":"INI-17","name":"Segmentación entre la red de sucursales y el centro de datos","origin":"Origen: E.08 y E.07 (F.1).","safeguards":"E.08, existentes parciales: 3.12\nE.07, diseñadas ahora: 12.2, 12.3, 12.6, 13.4","ig":"IG2 (5)","horizon":"Mediano · jul–dic 2027","owner":"Operaciones y Tecnología (R de la fila 22 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-16 (diagrama, zonas, reglas y cortafuegos); INI-04 (zona de administración, 12.8); INI-08 (versiones de la red, 12.1).\nNo entra antes: 12.2 (IG2): trata R-01 y R-03; queda en su horizonte por IG porque la cadena inventario (INI-01, a marzo), diagrama, flujos, zonas y compra e instalación de los dos PA-3410 (INI-16, abril a junio) y migración por etapas, fuera del cierre diario y de las ventanas del BCR, no cabe en el corto; OBJ-04 vence el 31 de diciembre de 2027. Mientras tanto, INI-06 baja el impacto de R-01 y el riesgo se informa con su nivel inherente en la revisión trimestral (apetito de E.05); 12.3 (IG2): como 12.2, cuyo tratamiento delimita; 12.6 (IG2): como 12.2, cuyo tratamiento delimita; 13.4 (IG2): como 12.2, porque el filtrado se aplica sobre las zonas de INI-16; 3.12 (IG2): como 12.2, porque la brecha de la parcial se cierra con sus segmentos.","outcome":"IND-01 al 100 % al 31 de diciembre de 2027 (OBJ-04): todos los sistemas del core y de la compensación en segmentos con reglas aprobadas, separados de la red de sucursales, con la prueba de aislamiento; cierra la brecha de 3.12; equipos de red administrados desde la zona de administración con protocolos seguros (12.3, 12.6)."},{"id":"INI-18","name":"Disponibilidad de la red: enlace de respaldo, segundo medio con el BCR y mitigación de la denegación de servicio","origin":"Origen: E.09 (AC-05) y E.07 (control 12, 12.2).","safeguards":"aporta a 12.2 (la cuenta INI-17)","ig":"IG2 (aporta)","horizon":"Mediano · jul–dic 2027","owner":"Operaciones y Tecnología (R de la fila 25 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-16 (enlaces críticos del diagrama); INI-15 (política y clasificación para contratar).\nAporta a 12.2, que cuenta INI-17: la disponibilidad es parte de la arquitectura segura que exige 12.2 (E.07, control 12). 12.2 trata R-08 y R-10; esta parte queda en el mediano porque los enlaces críticos salen del diagrama de INI-16 y los tres servicios se contratan con la política de INI-15 (AC-05).","outcome":"IND-02 al 100 % desde el 31 de diciembre de 2027: enlace de respaldo por otro medio y por una ruta física distinta para sucursales y cajeros (ISO/IEC 27002:2022, 7.12), segundo medio de conexión con el sistema de pagos del BCR, con el procedimiento de contingencia acordado con el BCR (SPOF-05, BIA_P06), y servicio de mitigación de la denegación de servicio para la banca en línea y la app, probados (AC-05); los servicios de terceros, con nivel de servicio en el contrato (5.20, tabla I.3)."},{"id":"INI-19","name":"SIEM: centralización, retención y revisión de los registros y alertas","origin":"Origen: E.08, E.07 (F.1) y E.09 (AC-07).","safeguards":"E.08, por implementar: 8.4 a 8.6, 8.8 a 8.11\nE.07, diseñadas ahora: 13.1, 13.6, 13.11","ig":"IG2 (9) · IG3 (1)","horizon":"Mediano · jul–dic 2027","owner":"Operaciones y Tecnología (R de la fila 23 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-11 (registros activos en el origen); INI-12 (filtrado DNS, fuente de 8.6); INI-01 (fuentes de E.04).\nSe adelanta 13.11 (IG3, del largo) por R-03: afina los umbrales de 13.1, tratamiento de R-03, dentro del costo de S-15.\nNo entra antes: 8.9 (IG2): trata R-03 y cierra BR-05 (vulnerabilidad también de R-01, R-05 y R-09); sirve a OBJ-03, que vence el 31 de diciembre de 2027, en este horizonte; queda en él porque centraliza lo que INI-11 activa en el origen hasta el final del corto, como en el ejemplo de la Guía (SIEM en el mediano con el control 8 IG1 operando); 8.11 (IG2): como 8.9; además cumple PCI DSS (REQ-05): mientras tanto, INI-11 revisa cada día en el origen los registros del entorno de tarjetas; 13.1 (IG2): como 8.9; 13.11 (IG3): como 13.1, cuyos umbrales afina; 8.10 (IG2): cumple PCI DSS (REQ-05) y se configura en el SIEM; mientras tanto, INI-11 conserva 12 meses en el origen los registros del entorno de tarjetas.","outcome":"IND-05 al 100 % al 31 de diciembre de 2027 (OBJ-03): las fuentes de A-02, A-06, A-07, A-09, A-18 y A-23 en Microsoft Sentinel (S-15), con hora sincronizada (8.4), registros detallados, de DNS y de línea de comandos (8.5, 8.6, 8.8) y flujos de los cortafuegos (13.6); retención de 90 días y de 12 meses en el entorno de tarjetas (8.10); revisión semanal y diaria del entorno de tarjetas (8.11); IND-06 al 100 % desde que el SIEM recibe las fuentes. Las que no puedan integrarse, como los registros del IBM i, quedan en la excepción de 90 días del control 13, que empieza a más tardar en el hito del 30 de septiembre de 2027, y se integran antes de que venza (AC-07)."},{"id":"INI-20","name":"Contratos con requisitos de seguridad y nivel de servicio, evaluación y monitoreo de los proveedores","origin":"Origen: E.07 (F.1) y E.09 (AC-04).","safeguards":"E.07, diseñadas ahora: 15.4, 15.5","ig":"IG2 (1) · IG3 (1)","horizon":"Mediano · abr–dic 2027","owner":"Operaciones y Tecnología y Finanzas (R de la fila 26 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-15 (inventario, clasificación y calendario de renovación).\nSe adelanta 15.5 (IG3, del largo) por R-07: es tratamiento de R-07 (evaluación del procesador de tarjetas).\nNo entra antes: 15.4 (IG2): trata R-07, R-10 y R-11, pero los contratos vigentes se adaptan al renovarse, como máximo en 12 meses (excepción del control 15): cierra antes del 4 de enero de 2028 (AC-04); 15.5 (IG3): no entra al corto porque se evalúa a cada proveedor crítico de la clasificación de INI-15, al renovar su contrato o dentro de los 12 meses de la política.","outcome":"IND-03 e IND-04 al 100 % desde el 4 de enero de 2028: cada proveedor crítico con las cláusulas de seguridad, notificación y nivel de servicio en su contrato (15.4; ISO/IEC 27002:2022, 5.20, en la tabla I.3) y evaluado (AoC, SOC 2 o cuestionario) (15.5), con el monitoreo mensual de INI-15; primero, el procesador de tarjetas, el proveedor de la red MPLS y el fabricante del core. La evaluación del procesador de tarjetas incluye la de un procesador alterno (SPOF-04, BIA_P06): mientras no lo haya, el impacto de R-07 no baja (E.05). Si un proveedor no acepta las cláusulas, decide la Presidencia con el residual de E.05 (AC-04)."},{"id":"INI-21","name":"Inventario continuo y automatizado de activos y software","origin":"Origen: E.08.","safeguards":"E.08, por implementar: 1.3, 1.4, 2.4","ig":"IG2 (3)","horizon":"Mediano · jul–dic 2027","owner":"Operaciones y Tecnología (R de la fila 30 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-01 (inventario base); INI-07 (escáner interno de 7.5, S-16).","outcome":"Descubrimiento activo diario con el escáner de 7.5, fuera del cierre diario (1.3); registros DHCP conciliados cada semana (1.4); inventario automatizado del software instalado (2.4)."},{"id":"INI-22","name":"Lista de software y bibliotecas permitidos","origin":"Origen: E.08.","safeguards":"E.08, al roadmap: 2.5, 2.6","ig":"IG2 (2)","horizon":"Mediano · ene–jun 2028","owner":"Operaciones y Tecnología (R de la fila 30 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-21 (inventario automatizado, 2.4, que muestra lo instalado en cada equipo).","outcome":"Control de aplicaciones de Windows en las estaciones de sucursales, tesorería y Cumplimiento y en los servidores Windows, y fapolicyd en RHEL 8 (2.5); bibliotecas permitidas (2.6); reevaluación semestral."},{"id":"INI-23","name":"Cifrado de los datos en tránsito y en los medios extraíbles","origin":"Origen: E.08.","safeguards":"E.08, por implementar: 3.9, 3.10","ig":"IG2 (2)","horizon":"Mediano · jul–dic 2027","owner":"Operaciones y Tecnología (R de la fila 14 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-09 (inventario y flujos de los datos de clientes).","outcome":"Medios extraíbles cifrados en Windows 11 (3.9); TLS 1.2 o superior en la banca en línea, la app, las interfaces con el BCR y con el procesador de tarjetas y las sesiones 5250 del IBM i, y SSH en RHEL 8 (3.10)."},{"id":"INI-24","name":"Configuración segura ampliada y equipos portátiles","origin":"Origen: E.08.","safeguards":"E.08, por implementar: 4.8 a 4.11","ig":"IG2 (4)","horizon":"Mediano · jul–dic 2027","owner":"Operaciones y Tecnología (R de la fila 31 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-08 (línea base de los Benchmarks); INI-12 (servicio de filtrado DNS, destino de 4.9).","outcome":"Servicios innecesarios desinstalados según el Benchmark (4.8); servidores DNS de confianza (4.9); bloqueo por intentos fallidos y borrado remoto en los portátiles y móviles corporativos que registre el inventario (4.10, 4.11)."},{"id":"INI-25","name":"Correo, navegación y antimalware ampliados","origin":"Origen: E.08.","safeguards":"E.08, por implementar: 8.7, 9.3 a 9.6, 10.4, 10.5","ig":"IG2 (7)","horizon":"Mediano · jul–dic 2027","owner":"Operaciones y Tecnología (R de la fila 32 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-12 (navegador, correo y antimalware de base).","outcome":"Filtrado de URL en los cortafuegos Palo Alto con su suscripción (9.3) y registro de las URL (8.7); extensiones y complementos autorizados (9.4); SPF, DKIM y DMARC con rechazo (9.5); bloqueo de adjuntos innecesarios (9.6); análisis de los medios extraíbles (10.4) y funciones antiexplotación (10.5)."},{"id":"INI-26","name":"Detección de intrusiones en los equipos y en la red interna","origin":"Origen: E.08 y E.07 (F.1).","safeguards":"E.08, al roadmap: 10.7\nE.07, al roadmap: 13.2, 13.3","ig":"IG2 (3)","horizon":"Mediano · ene–jun 2028","owner":"Operaciones y Tecnología (R de las filas 32 y 23 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-19 (SIEM operando, 13.1); INI-17 (segmentación operando); INI-12 (consola de antimalware).","outcome":"Agente con detección por comportamiento en servidores y estaciones, integrado al SIEM (10.7, 13.2); detección de intrusiones en los cortafuegos internos con la suscripción de prevención de amenazas (13.3)."},{"id":"INI-27","name":"Autenticación y acceso centralizados y acceso remoto por VPN","origin":"Origen: E.07 (F.1).","safeguards":"E.07, al roadmap: 5.6, 6.7, 12.5, 12.7, 13.5","ig":"IG2 (5)","horizon":"Mediano · jul 2027–jun 2028","owner":"Operaciones y Tecnología (R de la fila 3 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-04 (cuentas de administración del directorio protegidas, 6.5, 5.4); INI-06 (recuperación del directorio probada, 11.1).\nCentralizar en el directorio único aumenta la dependencia de SPOF-03; por eso va después de proteger sus cuentas y probar su recuperación (E.07, controles 5, 6 y 12).","outcome":"Gestión de cuentas y control de acceso centralizados en el directorio y Entra ID (5.6, 6.7); autenticación, autorización y auditoría centralizadas de los equipos de red (12.5); acceso remoto solo por VPN con esa autenticación y control de los equipos remotos (12.7, 13.5)."},{"id":"INI-28","name":"Desarrollo seguro de la banca en línea, la app y el core","origin":"Origen: E.08.","safeguards":"E.08, por implementar: 16.1 a 16.11","ig":"IG2 (11)","horizon":"Mediano · jul 2027–jun 2028","owner":"Operaciones y Tecnología (R de la fila 33 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-07 (proceso de remediación, 7.2, cuyos plazos usa 16.2).","outcome":"Proceso de desarrollo seguro aprobado y aplicado al personal propio y, por contrato, a los terceros (16.1); reportes de vulnerabilidades, causa raíz y escala de severidad (16.2, 16.3, 16.6); lista de materiales revisada cada mes con componentes actualizados (16.4, 16.5); infraestructura endurecida y ambientes separados (16.7, 16.8); capacitación anual en código seguro (16.9); diseño seguro y módulos verificados (16.10, 16.11)."},{"id":"INI-29","name":"Programa de pruebas de penetración","origin":"Origen: E.08.","safeguards":"E.08, por implementar: 18.1 a 18.3, 18.5","ig":"IG2 (3) · IG3 (1)","horizon":"Mediano · jul–dic 2027","owner":"Operaciones y Tecnología (R de la fila 34 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-07 (ciclo de vulnerabilidades operando); INI-15 (política para contratar la firma).\nSe adelanta 18.5 (IG3, del largo) por REQ-05: PCI DSS v4.0.1 exige la prueba interna cada 12 meses (11.4.2) y la de los controles que aíslan el entorno de tarjetas (11.4.5).\nNo entra antes: 18.1 (IG2): cumple PCI DSS (REQ-05) y queda en su horizonte por IG porque la prueba se hace sobre el ciclo de vulnerabilidades de INI-07, que opera al final del corto, para encontrar lo que ese ciclo no cierra; la prueba del programa queda dentro de 2027 (11.4.2 y 11.4.3: al menos una vez cada 12 meses). Si la evaluación PCI DSS de BUNICA registra una prueba anterior (la ficha no la registra), la siguiente se hace dentro de los 12 meses desde esa, aunque caiga en el corto; 18.2 (IG2): como 18.1; 18.3 (IG2): como 18.1; 18.5 (IG3): como 18.1.","outcome":"Programa con la metodología de PCI DSS (18.1); primera prueba externa e interna del programa (la ficha no registra las anteriores), con los controles de segmentación del entorno de tarjetas, por una firma independiente, a más tardar el 31 de diciembre de 2027 (18.2, 18.5); hallazgos corregidos y verificados con una nueva prueba (18.3)."},{"id":"INI-30","name":"Revisión posterior a los incidentes y umbrales de incidente","origin":"Origen: E.08.","safeguards":"E.08, por implementar: 17.8, 17.9","ig":"IG2 (1) · IG3 (1)","horizon":"Mediano · ene–mar 2028","owner":"Operaciones y Tecnología (R de la fila 5 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-14 (proceso de respuesta, 17.4); INI-19 (clasificación de las alertas del control 13).\nSe adelanta 17.9 (IG3, del largo) por REQ-01 y REQ-04: los umbrales formalizan, con la clasificación de las alertas del SIEM, los criterios de vulneración notificable en 72 horas (LPDP, art. 25) y de interrupción que se reporta a la SSF que el proceso de 17.4 aplica desde 2027.\nNo entra antes: 17.9 (IG3): no entra al corto porque los umbrales se alinean con la clasificación de las alertas del SIEM (INI-19).","outcome":"Revisión posterior a cada incidente con lecciones y acciones de seguimiento (17.8); umbrales que distinguen evento de incidente, vulneración notificable e interrupción que se reporta a la SSF (17.9)."},{"id":"INI-31","name":"Capacitación por rol","origin":"Origen: E.08.","safeguards":"E.08, por implementar: 14.9","ig":"IG2 (1)","horizon":"Mediano · jul–dic 2027","owner":"Recursos Humanos (R de la fila 7 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-13 (programa de concientización).","outcome":"Capacitación por rol: administración segura para TI, OWASP Top 10 para el desarrollo (16.9) e ingeniería social avanzada para la Presidencia, las direcciones, tesorería y el centro de llamadas."},{"id":"INI-32","name":"Prevención de fuga de datos","origin":"Origen: E.08.","safeguards":"E.08, al roadmap: 3.13","ig":"IG3 (1)","horizon":"Mediano · jul–dic 2027","owner":"Operaciones y Tecnología (R de la fila 14 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-09 (inventario de datos de 3.2 y etiquetas del esquema de 3.7).\nSe adelanta 3.13 (IG3, del largo) por R-09: cierra BR-10, vulnerabilidad de R-09 (Alto).\nNo entra antes: 3.13 (IG3): no entra al corto porque necesita las etiquetas aplicadas también a los documentos existentes, que esta iniciativa completa primero con el inventario de INI-09, y la herramienta se elige y se cotiza con ese inventario.","outcome":"Etiquetas del esquema aplicadas a los documentos existentes, primero a los expedientes KYC; después, herramienta de prevención de fuga de datos que identifica los datos de clientes en las estaciones, en Microsoft 365 y en el correo (S-18) y actualiza el inventario de 3.2 (BR-10)."},{"id":"INI-33","name":"Réplica del core al punto de recuperación de 15 minutos","origin":"Origen: E.09 (AC-01) y E.07 (control 11).","safeguards":"aporta a 11.2 (la cuenta INI-06)","ig":"IG1 (aporta)","horizon":"Mediano · jul 2027–jun 2028","owner":"Operaciones y Tecnología (R de la fila 4 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-06 (primera prueba completa, que mide la pérdida real de datos).\nAporta a 11.2, que cuenta INI-06. Nace de AC-01: el RPO de 15 minutos de P-01 (E.03) sigue abierto con la réplica horaria (E.05, R-01); mientras no cierre, cada prueba informa la pérdida real y la Presidencia la revisa cada trimestre (E.07, control 11).","outcome":"Réplica o respaldo automatizado del core con una frecuencia que cumple el RPO de 15 minutos, demostrado en la prueba anual de recuperación (acta de IND-09), y la pérdida real de datos dentro del RPO (AC-01)."},{"id":"INI-34","name":"Descubrimiento pasivo y control de acceso por puerto en las sucursales","origin":"Origen: E.08 y E.07 (F.1).","safeguards":"E.08, por implementar: 1.5\nE.07, al roadmap: 13.9","ig":"IG3 (2)","horizon":"Largo · jul–dic 2028","owner":"Operaciones y Tecnología (R de la fila 30 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-21 (inventario continuo, 1.3, 1.4); INI-27 (autenticación centralizada de la red, 12.5).","outcome":"Sensor pasivo en la entrada de la red de sucursales al centro de datos (1.5) y control de acceso por puerto con la autenticación centralizada (13.9)."},{"id":"INI-35","name":"Lista de scripts permitidos","origin":"Origen: E.08.","safeguards":"E.08, al roadmap: 2.7","ig":"IG3 (1)","horizon":"Largo · jul–dic 2028","owner":"Operaciones y Tecnología (R de la fila 30 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-22 (lista de software permitido, 2.5).","outcome":"Solo scripts firmados o autorizados en las estaciones y servidores (2.7)."},{"id":"INI-36","name":"Registros de acceso a datos sensibles y de los proveedores en el SIEM","origin":"Origen: E.08.","safeguards":"E.08, al roadmap: 3.14, 8.12","ig":"IG3 (2)","horizon":"Largo · jul–dic 2028","owner":"Operaciones y Tecnología (R de la fila 23 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-19 (SIEM operando); INI-20 (cláusula de registros firmada en cada contrato).","outcome":"Cada acceso, cambio y eliminación de datos sensibles del core, de canales, de los expedientes KYC y de Salesforce en el SIEM (3.14); registros de Microsoft 365, Entra ID, Azure, del procesador de tarjetas y del proveedor de la red MPLS integrados (8.12). Esta ingesta no entra en los 30 GB diarios de S-15 y se cotiza (tabla de lo que se cotiza)."},{"id":"INI-37","name":"Espacio de trabajo separado en los móviles corporativos","origin":"Origen: E.08.","safeguards":"E.08, por implementar: 4.12","ig":"IG3 (1)","horizon":"Largo · jul–dic 2028","owner":"Operaciones y Tecnología (R de la fila 31 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-24 (bloqueo y borrado remoto de los portátiles y móviles).","outcome":"Perfil de trabajo separado para las aplicaciones y los datos de BUNICA en los móviles corporativos que registre el inventario (4.12)."},{"id":"INI-38","name":"Control de acceso por roles","origin":"Origen: E.07 (F.1).","safeguards":"E.07, al roadmap: 6.8","ig":"IG3 (1)","horizon":"Largo · jul 2028–mar 2029","owner":"Operaciones y Tecnología (R de la fila 3 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-03 (inventarios de cuentas y de sistemas de autenticación, 5.1, 6.6); INI-27 (control de acceso centralizado, 6.7).","outcome":"Roles de cada proceso definidos con sus dueños y aplicados en las plataformas del alcance (6.8)."},{"id":"INI-39","name":"Análisis de adjuntos con ejecución aislada en el correo","origin":"Origen: E.08.","safeguards":"E.08, por implementar: 9.7","ig":"IG3 (1)","horizon":"Largo · jul–dic 2028","owner":"Operaciones y Tecnología (R de la fila 32 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-25 (filtrado del correo y bloqueo de adjuntos, 9.6).","outcome":"Antimalware del correo de Microsoft 365 con análisis de adjuntos en ejecución aislada (Safe Attachments de Microsoft Defender for Office 365 Plan 1) (9.7)."},{"id":"INI-40","name":"Prevención de intrusiones en los equipos y en la red","origin":"Origen: E.07 (F.1).","safeguards":"E.07, al roadmap: 13.7, 13.8","ig":"IG3 (2)","horizon":"Largo · jul–dic 2028","owner":"Operaciones y Tecnología (R de la fila 23 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-26 (detección en los equipos y en la red ya afinada).","outcome":"El mismo agente y la misma suscripción pasan de detectar a prevenir, con los umbrales afinados en INI-26 (13.7, 13.8)."},{"id":"INI-41","n al de seguridad (A)","dependencies":"Previas: INI-19 (SIEM operando); INI-29 (primera prueba hecha, 18.2).","outcome":"Reglas de detección y controles ajustados con las técnicas usadas en cada prueba (18.4)."},{"id":"INI-45","name":"Actualización del directorio a Windows Server 2025","origin":"Origen: E.07 (F.4, ciclo de vida del fabricante) y E.08 (2.2).","safeguards":"aporta a 2.2 (la cuenta INI-02)","ig":"IG1 (aporta)","horizon":"Largo · jul–nov 2028","owner":"Operaciones y Tecnología (R de la fila 31 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-04 (cuentas de administración protegidas); INI-06 (recuperación del directorio probada).\nAporta a 2.2, que cuenta INI-02: Windows Server 2019 pierde el soporte extendido el 9 de enero de 2029 (E.07), antes del cierre del largo plazo.","outcome":"Controladores de dominio en Windows Server 2025, con soporte extendido hasta noviembre de 2034 (Microsoft Lifecycle), antes del 9 de enero de 2029."},{"id":"INI-46","name":"Actualización de los canales a RHEL 10 y Oracle AI Database 26ai","origin":"Origen: E.07 (F.4, ciclo de vida del fabricante) y E.08 (2.2).","safeguards":"aporta a 2.2 (la cuenta INI-02)","ig":"IG1 (aporta)","horizon":"Largo · jul 2028–mar 2029","owner":"Operaciones y Tecnología (R de la fila 31 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-28 (ambientes separados de producción para probar, 16.8).\nAporta a 2.2, que cuenta INI-02: RHEL 8 pierde el soporte de mantenimiento el 31 de mayo de 2029 y Oracle 19c el Premier Support en diciembre de 2029 (E.07).","outcome":"Banca en línea y app sobre RHEL 10 (soporte de mantenimiento hasta el 31 de mayo de 2035, Red Hat) y Oracle AI Database 26ai (Premier Support hasta diciembre de 2031 para la edición Enterprise, Oracle; si la base es de otra edición, su fecha se verifica al elegir), probadas en un ambiente separado antes del cambio."},{"id":"INI-47","name":"Migración del core de IBM i 7.4 a IBM i 7.6","origin":"Origen: E.09 (AC-03), E.07 (F.4, hallazgo de fin de soporte) y E.08 (2.2).","safeguards":"aporta a 2.2 (la cuenta INI-02)","ig":"IG1 (aporta)","horizon":"Largo · ene 2028–jun 2029","owner":"Operaciones y Tecnología (R de la fila 28 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-02 (extensión de servicio de IBM i 7.4); INI-06 (recuperación probada para volver atrás); INI-28 (ambientes separados de producción, 16.8).\nAporta a 2.2, que cuenta INI-02. Nace de AC-03: la extensión de servicio termina el 30 de septiembre de 2029. De enero a junio de 2028 solo se planifica y se comprueba la compatibilidad de la aplicación; la migración empieza cuando INI-28 entrega los ambientes separados. Se elige IBM i 7.6 y no 7.5 porque es la versión más reciente (desde el 18 de abril de 2025) y ninguna de las dos tiene fecha de fin anunciada (IBM las anuncia con al menos 12 meses de aviso); 7.6 corre en Power11 y en Power10 con firmware FW1060 o posterior, no en Power9 o anteriores: si el inventario de INI-01 los registra, la migración incluye la reposición del servidor.","outcome":"Core en IBM i 7.6 a más tardar el 30 de junio de 2029, tres meses antes del fin de la extensión, con la prueba de recuperación hecha en la versión nueva; se cierra el hallazgo de fin de soporte de E.07 (AC-03)."},{"id":"INI-48","name":"Energía de respaldo del centro de datos","origin":"R-06 (Alto): falla eléctrica o de infraestructura del centro de datos principal que obliga a conmutar al sitio de contingencia, como en 2025","safeguards":"7.11 Supporting utilities (servicios de apoyo)","ig":"Fuera de CIS","horizon":"Corto · ene–jun 2027","owner":"Operaciones y Tecnología (R de la fila 27 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Verificar si existe y, si no, implantarla para el servidor IBM Power, los cortafuegos y el núcleo de la red, con mantenimiento y prueba junto con la prueba anual de recuperación (AC-06).","outcome":"Energía de respaldo verificada o implantada, con su plan de mantenimiento, y probada en la primera prueba completa de OBJ-01, a más tardar el 30 de junio de 2027, para que una interrupción del suministro dentro de la autonomía probada se sostenga sin conmutar (propósito del residual de R-06 en E.05); la ficha no registra la causa de la falla de 2025, que INI-48 verifica."},{"id":"INI-49","name":"Devolución de la llamada antes de una transferencia urgente","origin":"R-13 (Medio): suplantación de un cliente con voz clonada por IA ante el centro de llamadas para ordenar una transferencia urgente","safeguards":"8.5 Secure authentication (autenticación segura)","ig":"Fuera de CIS","horizon":"Corto · ene–mar 2027","owner":"Banca de Personas (R de la fila 29 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Toda transferencia urgente que se pida por el centro de llamadas se confirma devolviendo la llamada al número registrado del cliente; E.05 lo trata con 14.2 y con ISO/IEC 27002:2022 8.5, porque verifica por un segundo canal a quien ordena la transferencia.","outcome":"Procedimiento del centro de llamadas aprobado y aplicado desde el 31 de marzo de 2027: ninguna transferencia urgente sin la devolución de la llamada registrada; la capacitación del centro de llamadas para reconocer la voz clonada se completa en INI-13, al 30 de junio de 2027."},{"id":"INI-50","name":"Conmutación automatizada del core al sitio de contingencia (condicionada a AC-02)","origin":"Origen: E.09 (AC-02) y E.07 (control 11).","safeguards":"aporta a 11.5 (la cuenta INI-06)","ig":"IG2 (aporta)","horizon":"Mediano · jul–sep 2027","owner":"Operaciones y Tecnología y Finanzas (R de la fila 24 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-06 (primera prueba completa y la causa de su tiempo).\nAporta a 11.5, que cuenta INI-06. Es condicionada: se ejecuta solo si la primera prueba completa supera las 8 horas por la conmutación manual (AC-02); la ficha registra que la conmutación es manual y que la última prueba, parcial, tardó 11 horas. Si la prueba cumple el RTO, se cierra sin compra.","outcome":"Si se activa: conmutación del core al sitio de contingencia automatizada o asistida, con su procedimiento, y nueva prueba completa en 8 horas o menos en el trimestre siguiente, a más tardar el 30 de septiembre de 2027 (IND-09; AC-02)."}],"riskRoadmap":{"R-01":{"initiatives":["INI-06","INI-17","INI-16","INI-33","INI-50"],"date":"31 de diciembre de 2027 (mediano plazo)"},"R-02":{"initiatives":["INI-04","INI-03","INI-27","INI-45"],"date":"30 de junio de 2027 (corto plazo)"},"R-03":{"initiatives":["INI-17","INI-19","INI-11","INI-16"],"date":"31 de diciembre de 2027 (mediano plazo)"},"R-04":{"initiatives":["INI-07","INI-09","INI-10","INI-28","INI-46"],"date":"30 de junio de 2027 (corto plazo)"},"R-05":{"initiatives":["INI-05"],"date":"30 de junio de 2027 (corto plazo)"},"R-06":{"initiatives":["INI-48","INI-06","INI-14","INI-50"],"date":"30 de junio de 2027 (corto plazo)"},"R-07":{"initiatives":["INI-20","INI-15"],"date":"31 de diciembre de 2027 (mediano plazo)"},"R-08":{"initiatives":["INI-18","INI-14"],"date":"31 de diciembre de 2027 (mediano plazo)"},"R-09":{"initiatives":["INI-08","INI-09","INI-10","INI-32"],"date":"30 de junio de 2027 (corto plazo)"},"R-10":{"initiatives":["INI-18","INI-20"],"date":"31 de diciembre de 2027 (mediano plazo)"},"R-11":{"initiatives":["INI-02","INI-20","INI-15","INI-47"],"date":"31 de diciembre de 2027 (mediano plazo)"},"R-12":{"initiatives":["INI-18","INI-20","INI-15"],"date":"31 de diciembre de 2027 (mediano plazo)"},"R-13":{"initiatives":["INI-13","INI-49"],"date":"30 de junio de 2027 (corto plazo)"},"R-14":{"initiatives":[],"date":"—"}},"actions":[{"id":"AC-01","finding":"La prueba completa muestra una pérdida de datos del core mayor que el RPO de 15 minutos: la ficha registra la réplica asíncrona del core cada hora (BR-02).","evidence":"IND-09: el acta anual de recuperación informa los datos ve FIDO2 sin la zona de administración lista cuando se exige el segundo factor (control 6, declaración 3).","evidence":"IND-07 por debajo del 100 %","action":"Implantar la zona de administración (12.8) en la misma iniciativa de corto plazo que 6.5 y 5.4.","roadmap":"Iniciativa de R-02, en el corto plazo; trata R-02","owner":"Fila 20 de E.06. R: Operaciones y Tecnología. A: oficial de seguridad."}],"raci":[{"activity":"1. Aprobar la política de seguridad de la información y las políticas de los controles","roles":{"Junta Directiva y Comité de Auditoría":"I","Presidencia":"A","Banca de Personas":"C","Banca Corporativa":"C","Operaciones y Tecnología (TI)":"C","Riesgos y Cumplimiento":"C","Oficial de seguridad de la información":"R","Gerencia Legal":"C","Finanzas":"C","Recursos Humanos":"I","Auditoría Interna":"I"}},{"activity":"2. Gestionar las vulnerabilidades y los parches, con escaneo y remediación en ciclos","roles":{"Presidencia":"I","Banca de Personas":"C","Operaciones y Tecnología (TI)":"R","Oficial de seguridad de la información":"A","Finanzas":"C"}},{"activity":"3. Administrar las cuentas y los accesos: altas, cambios, bajas y revisión de privilegios","roles":{"Presidencia":"I","Banca de Personas":"R","Operaciones y Tecnología (TI)":"R","Riesgos y Cumplimiento":"R","Oficial de seguridad de la información":"A","Finanzas":"R","Recursos Humanos":"R"}},{"activity":"4. Respaldar los datos y proteger las copias, con una copia aislada del core","roles":{"Presidencia":"I","Banca de Personas":"C","Operaciones y Tecnología (TI)":"R","Oficial de seguridad de la información":"A","Finanzas":"C"}},{"activity":"5. Responder a los incidentes de seguridad: contener, erradicar, recuperar y documentar","roles":{"Presidencia":"I","Banca de Personas":"C","Banca Corporativa":"I","Operaciones y Tecnología (TI)":"R","Riesgos y Cumplimiento":"C","Oficial de seguridad de la información":"A","Gerencia Legal":"C","Finanzas":"C","Recursos Humanos":"C"}},{"activity":"6. Notificar en 72 hor },{"activity":"12. Proteger los expedientes KYC y los reportes a la UIF con permisos según la necesidad y una configuración segura de Microsoft 365","roles":{"Presidencia":"I","Operaciones y Tecnología (TI)":"R","Riesgos y Cumplimiento":"R","Oficial de seguridad de la información":"A"}},{"activity":"13. Responder al fraude por toma de cuentas de clientes: detectar la campaña, bloquear los accesos y decidir los reembolsos","roles":{"Presidencia":"I","Banca de Personas":"A","Operaciones y Tecnología (TI)":"R","Riesgos y Cumplimiento":"C","Oficial de seguridad de la información":"C","Gerencia Legal":"C","Finanzas":"I"}},{"activity":"14. Clasificar y cifrar los datos personales de canales digitales y de AML/KYC","roles":{"Presidencia":"I","Banca de Personas":"R","Operaciones y Tecnología (TI)":"R","Riesgos y Cumplimiento":"R","Oficial de seguridad de la información":"A","Gerencia Legal":"C"}},{"activity":"15. Mantener la matriz de riesgos de seguridad y proponer los tratamientos","roles":{"Presidencia":"I","Banca de Personas":"C","Operaciones y Tecnología (TI)":"C","Riesgos y Cumplimiento":"A","Oficial de seguridad de la información":"R","Finanzas":"C","Auditoría Interna":"I"}},{"activity":"16. Aprobar el apetito de riesgo y aceptar por escrito los riesgos residuales","roles":{"Junta Directiva y Comité de Auditoría":"I","Presidencia":"A","Banca de Personas":"C","Operaciones y Tecnología (TI)":"C","Riesgos y Cumplimiento":"C","Oficial de seguridad de la información":"R","Finanzas":"C"}},{"activity":"17. Revisar el programa por la dirección cada trimestre e informar cada año a la Junta Directiva","roles":{"Junta Directiva y Comité de Auditoría":"I","Presidencia":"A","Banca de Personas":"I","Banca Corporativa":"I","Operaciones y Tecnología (TI)":"C","Riesgos y Cumplimiento":"C","Oficial de seguridad de la información":"R","Finanzas":"C","Auditoría Interna":"I"}},{"activity":"18. Aprobar el roadmap y sus iniciativas dentro del presupuesto aprobado para seguridad","roles":{"Junta Directiva y Comité de Auditoría":"I","Presidencia":"A","Banca de Personas":"C","Banca Corporativa":"I","Operaciones y Tecnología (TI)":"C","Riesgos y Cumplimiento":"C","Oficial de seguridad de la información":"R","Finanzas":"C"}},{"activity":"19. Evaluar los cambios en los sistemas de los cuatro procesos que el perfil declara críticos y detener los que introduzcan un riesgo no tratado","roles":{"Presidencia":"I","Banca de Personas":"C","Operaciones y Tecnología (TI)":"R","Riesgos y Cumplimiento":"C","Oficial de seguridad de la información":"A","Finanzas":"C"}},{"activity":"20. Exigir un segundo factor resistente al phishing en todo acceso administrativo","roles":{"Presidencia":"I","Operaciones y Tecnología (TI)":"R","Oficial de seguridad de la información":"A"}},{"activity":"21. Implantar el segundo factor en la app y al registrar destinatarios nuevos","roles":{"Presidencia":"I","Banca de Personas":"R","Operaciones y Tecnología (TI)":"R","Oficial de seguridad de la información":"A"}},{"activity":"22. Segmentar la red entre las sucursales y el centro de datos y aprobar las reglas de filtrado entre segmentos","roles":{"Presidencia":"I","Banca de Personas":"C","Operaciones y Tecnología (TI)":"R","Oficial de seguridad de la información":"A","Finanzas":"C"}},{"activity":"23. Centralizar en el SIEM los registros de auditoría y las alertas de seguridad, y revisarlos cada semana","roles":{"Presidencia":"I","Banca de Personas":"C","Operaciones y Tecnología (TI)":"R","Oficial de seguridad de la información":"A","Finanzas":"C"}},{"activity":"24. Probar cada trimestre la restauración de una muestra y cada año la recuperación completa del core en el sitio de contingencia, y simular los procedimientos alternos","roles":{"Presidencia":"I","Banca de Personas":"C","Operaciones y Tecnología (TI)":"R","Riesgos y Cumplimiento":"I","Oficial de seguridad de la información":"A","Finanzas":"R","Auditoría Interna":"I"}},{"activity":"25. Asegurar la disponibilidad de la red: enlace de respaldo, segundo medio de conexión con el BCR y mitigación de la denegación de servicio","roles":{"Presidencia":"I","Banca de Personas":"C","Operaciones y Tecnología (TI)":"R","Oficial de seguridad de la información":"A","Finanzas":"C"}},{"activity":"26. Gestionar los proveedores de servicios: inventario, requisitos y nivel de servicio en los contratos, evaluación y monitoreo","roles":{"Presidencia":"I","Banca de Personas":"C","Operaciones y Tecnología (TI)":"R","Riesgos y Cumplimiento":"C","Oficial de seguridad de la información":"A","Gerencia Legal":"C","Finanzas":"R"}},{"activity":"27. Asegurar, mantener y probar la energía de respaldo del centro de datos","roles":{"Presidencia":"I","Operaciones y Tecnología (TI)":"R","Oficial de seguridad de la información":"A"}},{"activity":"28. Mantener el sistema operativo del core con soporte del fabricante o, sin la extensión, con la excepción de la 2.2, cuyo riesgo residual acepta la Presidencia, y planificar su migración","roles":{"Presidencia":"C","Banca de Personas":"C","Operaciones y Tecnología (TI)":"R","Riesgos y Cumplimiento":"C","Oficial de seguridad de la información":"A","Finanzas":"C"}},{"activity":"29. Capacitar al centro de llamadas en ingeniería social y verificar por devolución de llamada al número registrado las transferencias urgentes","roles":{"Presidencia":"I","Banca de Personas":"R","Oficial de seguridad de la información":"A","Recursos Humanos":"R"}},{"activity":"30. Inventariar los activos y el software, con su dueño y su clasificación, y retirar o bloquear lo no autorizado","roles":{"Presidencia":"I","Banca de Personas":"C","Operaciones y Tecnología (TI)":"R","Riesgos y Cumplimiento":"C","Oficial de seguridad de la información":"A","Finanzas":"C"}},{"activity":"31. Configurar de forma segura los servidores, las estaciones, la red y los servicios en la nube","roles":{"Presidencia":"I","Operaciones y Tecnología (TI)":"R","Oficial de seguridad de la información":"A"}},{"activity":"32. Proteger los equipos contra el malware y filtrar el correo y la navegación","roles":{"Presidencia":"I","Operaciones y Tecnología (TI)":"R","Oficial de seguridad de la información":"A"}},{"activity":"33. Desarrollar de forma segura la banca en línea, la app y la aplicación del core","roles":{"Presidencia":"I","Banca de Personas":"C","Operaciones y Tecnología (TI)":"R","Riesgos y Cumplimiento":"C","Oficial de seguridad de la información":"A","Finanzas":"C"}},{"activity":"34. Contratar y supervisar las pruebas de penetración y remediar sus hallazgos","roles":{"Presidencia":"I","Banca de Personas":"C","Operaciones y Tecnología (TI)":"R","Oficial de seguridad de la información":"A","Gerencia Legal":"C","Finanzas":"C","Auditoría Interna":"I"}}],"controls":[{"id":5,"source":"E07_Desarrollo_Control_CIS_05_SENG.docx","f1":{"Control CIS v8.1":"Control 5 — Gestión de cuentas (Account Management), CIS Critical Security Controls v8.1.2, p. 32–34.","Salvaguardas del IG asignado en este control":"6 salvaguardas, todas dentro del IG3 asignado (4 IG1, 2 IG2 y 0 IG3); nombre e IG de la tabla G.2 de E08 y página del texto oficial.\nDiseñadas ahora (5; la política, el SOP y la F.4 de este documento las resuelven y E.10 fija cuándo operan):\n5.1 Inventario de cuentas (IG1, p. 33)\n5.2 Contraseñas únicas (IG1, p. 33)\n5.3 Deshabilitar cuentas inactivas (IG1, p. 34)\n5.4 Restringir privilegios de administrador a cuentas dedicadas (IG1, p. 34)\n5.5 Inventario de cuentas de servicio (IG2, p. 34)\nPor qué ahora: 5.1 a 5.4 son IG1. 5.5 (IG2) se diseña ahora porque las cuentas de servicio con privilegios en el directorio son un camino para tomarlo (R-02) y la ficha no las registra (E.04).\nAl roadmap de E.10 (1):\n5.6 Gestión centralizada de cuentas (IG2, p. 34). Igual que 6.7: centralizar toda la gestión de cuentas en el único directorio aumenta su dependencia (SPOF-03); se hace después de proteger sus cuentas administrativas y de probar su recuperación.","Riesgos que mitiga":"R-02 (Crítico, inherente 20): cuentas de administración dedicadas, separadas de las de correo y navegación (5.4), para que el phishing contra el personal de TI no entregue privilegios (SPOF-03, BR-03).","Correspondencia ISO":"5.16, Identity management (gestión de identidades).\n5.17, Authentication information (información de autenticación).\n5.18, Access rights (derechos de acceso).\n8.2, Privileged access rights (derechos de acceso privilegiado).\nTítulos del índice oficial de ISO/IEC 27002:2022 (vista previa de IEC, consultada el 7 de noviembre de 2026), con su traducción literal.","Función CSF 2.0":"Proteger. El CIS asigna la función Proteger a tres de sus seis salvaguardas (5.2, 5.3 y 5.4), entre ellas la que trata el riesgo de E.05."},"f2":{"Propósito":"Política de gestión de cuentas. La ficha registra que los administradores no tienen segundo factor, y no registra un inventario de cuentas ni las cuentas de servicio (E.04). Un administrador que lee su correo o navega con la misma cuenta con la que administra entrega sus privilegios al primer phishing que lo engañe: así se toma el directorio único (R-02, Crítico; SPOF-03). Las cuentas sin dueño o inactivas son la otra puerta. Esta política fija qué cuentas existen, quién las valida y cómo se separan los privilegios.","Alcance":"Todas las cuentas de los sistemas del alcance: personal (1 200 empleados), administradores, cuentas de servicio, proveedores y emergencia, en Active Directory y Entra ID, Microsoft 365, Azure, IBM i, base Oracle, servidores Red Hat Enterprise Linux 8, cortafuegos Palo Alto y cuentas de tesorería en el portal del sistema de pagos del BCR (A-14). Las credenciales de los clientes de la banca en línea y la app las rige el control 6.\nVigencia: rige desde el 4 de enero de 2027, arranque del programa. Las declaraciones que exigen implantar algo que hoy no existe son exigibles desde la fecha que indican o, si no la indican, desde que cierra su iniciativa en E.10, a más tardar al final del horizonte que E.10 le asigne; mientras tanto, el oficial de seguridad informa su avance en la revisión trimestral de la Presidencia (E.02).","Declaraciones de política":"1. Toda cuenta figura en el inventario de cuentas con el nombre de la persona, el usuario, las fechas de alta y de baja y la unidad; cada trimestre los dueños validan que toda cuenta activa está autorizada.\n2. Toda cuenta de servicio figura en un inventario con su unidad dueña, su propósito y su fecha de revisión, y se valida cada trimestre.\n3. Toda contraseña es única para cada sistema y tiene al menos 14 caracteres en las cuentas sin segundo factor y 8 en las que lo tienen.\n4. Toda cuenta sin uso durante 45 días se deshabilita: automáticamente donde la plataforma lo admite y, donde no, en la depuración mensual.\n5. Los privilegios de administración solo se ejercen con cuentas de administración dedicadas, separadas de la cuenta de uso diario; ninguna cuenta de administración tiene buzón de correo ni navega por internet fuera de los portales de administración de Entra ID, Azure y Microsoft 365.\n6. Las cuentas compartidas solo existen como cuentas de servicio o de emergencia inventariadas; las de emergencia se custodian según F.4 y su uso genera una alerta en el SIEM.","Roles y responsabilidades":"La Presidencia aprueba esta política y el oficial de seguridad de la información la redacta (fila 1 de E.06). El oficial rinde cuentas por el control. Operaciones y Tecnología administra las cuentas (proceso P-06) y separa las de administración; Recursos Humanos entrega la lista del personal activo; los dueños de la información (Banca de Personas, Riesgos y Cumplimiento y Finanzas) validan cada trimestre las cuentas de sus sistemas. Auditoría Interna verifica el cumplimiento en la auditoría de E.09 (fila 8).\nFila 3 de E.06, «Administrar las cuentas y los accesos: altas, cambios, bajas y revisión de privilegios»: A (rinde cuentas): oficial de seguridad de la información; R (ejecuta): Banca de Personas, Operaciones y Tecnología, Riesgos y Cumplimiento, Finanzas y Recursos Humanos; I (informada): Presidencia.\nFila 20 de E.06, «Exigir un segundo factor resistente al phishing en todo acceso administrativo»: A (rinde cuentas): oficial de seguridad de la información; R (ejecuta): Operaciones y Tecnología; I (informada): Presidencia.","Cumplimiento y excepciones":"El incumplimiento de esta política se registra como hallazgo y se corrige con el procedimiento; si lo causó una persona, el oficial de seguridad lo informa a Recursos Humanos para la medida que corresponda, y si lo causó un proveedor, se aplica su contrato (control 15). No se admiten excepciones a la separación de cuentas (declaración 5) para los administradores del directorio, de Azure y de Microsoft 365. Una cuenta que no puede cumplir las declaraciones 3 o 4 por una limitación de la plataforma (por ejemplo, la cuenta de servicio de una interfaz) admite una excepción de 30 días como máximo, renovable una vez, con una contraseña larga rotada y su uso vigilado en el SIEM como medidas compensatorias. La excepción se pide por escrito, con la justificación, la medida compensatoria y la fecha de vencimiento; la propone el dueño del proceso, la evalúa el oficial de seguridad de la información (visto bueno) y la firma la Presidencia, como toda aceptación de riesgo según el apetito de E.05. Queda en el inventario de excepciones, que la Presidencia revisa cada trimestre en la revisión por la dirección (E.02).","Revisión":"Anual y ante todo cambio significativo. Dueño del documento: el oficial de seguridad de la información."},"f3":{"Objetivo y disparador":"Depuración mensual y validación trimestral de cuentas. Mantener el inventario de cuentas exacto, deshabilitar las inactivas o sin dueño y confirmar la separación de las cuentas de administración. Calendario: mensual (depuración) y trimestral (validación por los dueños). Por evento: baja de personal o cuenta de administración nueva.","Responsable y frecuencia":"El administrador de identidades de Operaciones y Tecnología (proceso P-06), con Recursos Humanos y los dueños de la información. Mensual y trimestral.\nLos cargos que nombra este procedimiento son funciones que asume el personal de TI de Operaciones y Tecnología (85 personas, ficha), no plazas nuevas: el programa no crea plazas que la ficha no registra (E.02).","Pasos numerados":"1. Cada mes, extraer las cuentas del directorio y Entra ID, el IBM i, la base Oracle, los servidores Red Hat Enterprise Linux, los cortafuegos y el portal del BCR con las consultas de cada plataforma, y consolidarlas en el inventario. Criterio: la plataforma que no entrega su extracción es un hallazgo.\n2. Cruzar el inventario con la lista del personal activo de Recursos Humanos. Criterio: una cuenta sin persona activa se deshabilita el mismo día.\n3. Identificar las cuentas sin inicio de sesión en 45 días. Criterio: se deshabilitan; una cuenta de servicio inventariada que deba seguir habilitada pasa a excepción firmada (F.2).\n4. Verificar que ninguna cuenta con privilegios de administración tiene buzón ni licencia de uso diario, y que no puede navegar por internet, salvo a los portales de administración de la nube, porque solo se usa en la zona de administración (12.8, control 12). Criterio: tiene que ser cero.\n5. Cada trimestre, enviar a cada dueño la lista de cuentas de sus sistemas, incluidas las de servicio. Criterio: las que no confirma en 10 días hábiles se deshabilitan.\n6. Cada trimestre, comparar la configuración de contraseñas de cada plataforma con la declaración 3. Criterio: la que no cumple se corrige en 30 días o pasa a excepción.\n7. Registrar en el inventario los resultados y las cuentas deshabilitadas. Criterio: cada cuenta deshabilitada queda con fecha y motivo.\n8. Emitir el reporte trimestral: cuentas por tipo, validadas, deshabilitadas y en excepción. Criterio: se presenta en la revisión trimestral de la Presidencia (E.02).","Evidencia generada":"Inventario de cuentas y de cuentas de servicio, versionado; actas de validación trimestral de los dueños; registro de cuentas deshabilitadas; reporte trimestral.\nAlimenta IND-11 y IND-12 de E.09: IND-11, «Cuentas activas validadas por sus dueños», trimestral; IND-12, «Administradores con cuenta de administración separada», mensual. Los mide Operaciones y Tecnología, que ejecuta el procedimiento, y los recibe el oficial de seguridad, que rinde cuentas (E.06).","Escalamiento":"Una cuenta de administración que no está en el inventario o que tiene correo se informa de inmediato al oficial de seguridad, se deshabilita y se investiga como posible incidente. El dueño que no valida en 10 días hábiles se escala al director de su unidad. El uso de una cuenta de emergencia se informa al oficial en la misma jornada."},"f4":{"Técnicos":"1. Políticas de contraseñas y de bloqueo de cuentas inactivas configuradas según el CIS Benchmark de cada plataforma (lista oficial de CIS Benchmarks en cisecurity.org/cis-benchmarks, consultada el 7 de noviembre de 2026): CIS Microsoft Windows Server 2019 Benchmark v5.0.0 (directorio), CIS Microsoft 365 Foundations Benchmark v7.0.0 (Entra ID), CIS Red Hat Enterprise Linux 8 Benchmark v4.0.0 y CIS Oracle Database 19c Benchmark v2.0.0. Con soporte: Windows Server 2019 conserva el soporte extendido hasta el 9 de enero de 2029 (Microsoft Lifecycle); Red Hat Enterprise Linux 8 conserva el soporte de mantenimiento hasta el 31 de mayo de 2029 (Red Hat Product Life Cycles), y Oracle Database 19c conserva el Premier Support hasta diciembre de 2029 (Oracle Lifetime Support Policy); E.10 planifica su actualización en el horizonte largo.\n2. Perfiles de usuario del IBM i con la misma política, según el CIS IBM i V7R4M0 Benchmark v2.1.0. Hallazgo de fin de soporte: IBM i 7.4 dejó el soporte estándar el 30 de septiembre de 2026 y su extensión pagada termina el 30 de septiembre de 2029 (IBM, «Release life cycle», consultada el 7 de noviembre de 2026); la ficha no registra la extensión (R-11). La migración pasa a E.10 como iniciativa, igual que en el control 15.\n3. Cuentas de administración separadas para las 30 cuentas privilegiadas (S-12), sin buzón ni licencia de productividad.\n4. Tarea programada que lee la fecha del último inicio de sesión en el directorio y en Entra ID y deshabilita las cuentas con 45 días de inactividad; las demás plataformas se depuran con la extracción mensual al inventario.","Administrativos":"1. Validación trimestral de las cuentas por los dueños de la información.\n2. Procedimiento de altas y bajas con Recursos Humanos, coordinado con el control 6.\n3. Inventario de cuentas de servicio con unidad dueña y propósito (5.5).","Físicos":"1. Credenciales de las cuentas de emergencia en sobre sellado, en caja fuerte con doble custodia.\n2. Entrega en persona y con firma de las credenciales iniciales de administración, junto con las llaves del control 6."}},{"id":6,"source":"E07_Desarrollo_Control_CIS_06_SENG.docx","f1":{"Control CIS v8.1":"Control 6 — Gestión del control de acceso (Access Control Management), CIS Critical Security Controls v8.1.2, p. 35–38.","Salvaguardas del IG asignado en este control":"8 salvaguardas, todas dentro del IG3 asignado (5 IG1, 2 IG2 y 1 IG3); nombre e IG de la tabla G.2 de E08 y página del texto oficial.\nDiseñadas ahora (6; la política, el SOP y la F.4 de este documento las resuelven y E.10 fija cuándo operan):\n6.1 Proceso de otorgamiento de acceso (IG1, p. 37)\n6.2 Proceso de revocación (IG1, p. 37)\n6.3 MFA en aplicaciones expuestas (IG1, p. 37)\n6.4 MFA en acceso remoto a la red (IG1, p. 37)\n6.5 MFA en acceso administrativo (IG1, p. 37)\n6.6 Inventario de sistemas de autenticación y autorización (IG2, p. 38)\nPor qué ahora: 6.1 a 6.5 son IG1. 6.6 (IG2) se diseña ahora porque delimita dónde se aplica el segundo factor: directorio, Entra ID, IBM i, banca en línea y app, base Oracle, consolas de los cortafuegos y portal del sistema de pagos del BCR.\nAl roadmap de E.10 (2):\n6.7 Control de acceso centralizado (IG2, p. 38). Centralizar todo el control de acceso en el directorio aumenta la dependencia del único directorio (SPOF-03). Se hace después de proteger sus cuentas administrativas (6.5 y 5.4) y de probar su recuperación (control 11).\n6.8 Control de acceso basado en roles (IG3, p. 38). Requiere los inventarios de cuentas (5.1) y de sistemas de autenticación (6.6) y la definición de los roles de cada proceso con sus dueños.","Riesgos que mitiga":"R-02 (Crítico, inherente 20): segundo factor resistente al phishing en todo acceso administrativo (6.5; SPOF-03, BR-03).\nR-05 (Alto, inherente 15): segundo factor en la app y al registrar destinatarios nuevos (6.3; SLE-06, USD 85 000).","Correspondencia ISO":"5.15, Access control (control de acceso).\n5.18, Access rights (derechos de acceso).\n8.2, Privileged access rights (derechos de acceso privilegiado).\n8.5, Secure authentication (autenticación segura).\nTítulos del índice oficial de ISO/IEC 27002:2022 (vista previa de IEC, consultada el 7 de noviembre de 2026), con su traducción literal.","Función CSF 2.0":"Proteger. El CIS asigna la función Proteger a cuatro de sus ocho salvaguardas (6.3, 6.4, 6.5 y 6.7), entre ellas las dos que tratan los riesgos de E.05."},"f2":{"Propósito":"Política de control de acceso. Los administradores del único directorio (Active Directory sincronizado con Entra ID), de Azure y de Microsoft 365 no tienen segundo factor (ficha; BR-03, SPOF-03). Robar una de esas credenciales, con phishing dirigido o una contraseña reutilizada, puede bastar para tomar el directorio del que depende todo el banco (R-02, Crítico; SLE-01, USD 612 000). Los clientes tienen segundo factor en la banca en línea, pero la ficha no lo registra en la app, y en 2024 la toma de cuentas por phishing obligó a reembolsar USD 85 000 (R-05). Esta política fija cómo se otorgan y se revocan los accesos y dónde es obligatorio el segundo factor.","Alcance":"Todo acceso a los sistemas del alcance: Active Directory y Entra ID, Microsoft 365, Azure, IBM i del core, base Oracle 19c, banca en línea y app, consolas de los cortafuegos y cuentas de tesorería en el portal del sistema de pagos del BCR (A-14). Aplica al personal, a los administradores, a los proveedores y a los clientes digitales.\nVigencia: rige desde el 4 de enero de 2027, arranque del programa. Las declaraciones que exigen implantar algo que hoy no existe son exigibles desde la fecha que indican o, si no la indican, desde que cierra su iniciativa en E.10, a más tardar al final del horizonte que E.10 le asigne; mientras tanto, el oficial de seguridad informa su avance en la revisión trimestral de la Presidencia (E.02).","Declaraciones de política":"1. Todo acceso se otorga con una solicitud aprobada por el dueño de la información (E.04), a partir del alta o el cambio de puesto que comunica Recursos Humanos.\n2. Todo acceso se deshabilita de inmediato y, a más tardar, dentro de las 4 horas siguientes al aviso de baja, revocación o cambio de puesto; las cuentas se deshabilitan y no se borran, para conservar el rastro de auditoría.\n3. Toda cuenta de administración del directorio, de Azure, de Microsoft 365, del IBM i, de la base Oracle y de los equipos de red exige un segundo factor resistente al phishing (llave FIDO2); donde la plataforma no lo admite, se administra solo desde estaciones de administración cuyo inicio de sesión lo exige (zona de administración, 12.8, control 12).\n4. Toda aplicación expuesta a internet exige segundo factor: Microsoft 365 y Azure para el personal; la banca en línea y la app para los clientes, también al vincular un dispositivo nuevo y al registrar un destinatario nuevo. Las cuentas de tesorería en el portal del sistema de pagos del BCR (A-14) usan llave FIDO2 o, si el portal no la admite, solo entran desde estaciones de la zona de administración que la exigen.\n5. Todo acceso remoto a la red interna exige segundo factor.\n6. El inventario de sistemas de autenticación y autorización se revisa cada año y con cada sistema nuevo.\n7. Los accesos de administración se revisan cada trimestre con el inventario de cuentas del control 5.","Roles y responsabilidades":"La Presidencia aprueba esta política y el oficial de seguridad de la información la redacta (fila 1 de E.06). El oficial rinde cuentas por el control. Operaciones y Tecnología configura el directorio, el acceso condicional y las plataformas; Recursos Humanos comunica altas, bajas y cambios de puesto; los dueños de la información (Banca de Personas, Riesgos y Cumplimiento y Finanzas) aprueban los accesos a sus datos, y Banca de Personas atiende a los clientes en la vinculación de sus dispositivos. Auditoría Interna verifica el cumplimiento en la auditoría de E.09 (fila 8).\nFila 3 de E.06, «Administrar las cuentas y los accesos: altas, cambios, bajas y revisión de privilegios»: A (rinde cuentas): oficial de seguridad de la información; R (ejecuta): Banca de Personas, Operaciones y Tecnología, Riesgos y Cumplimiento, Finanzas y Recursos Humanos; I (informada): Presidencia.\nFila 20 de E.06, «Exigir un segundo factor resistente al phishing en todo acceso administrativo»: A (rinde cuentas): oficial de seguridad de la información; R (ejecuta): Operaciones y Tecnología; I (informada): Presidencia.\nFila 21 de E.06, «Implantar el segundo factor en la app y al registrar destinatarios nuevos»: A (rinde cuentas): oficial de seguridad de la información; R (ejecuta): Banca de Personas y Operaciones y Tecnología; I (informada): Presidencia.","Cumplimiento y excepciones":"El incumplimiento de esta política se registra como hallazgo y se corrige con el procedimiento; si lo causó una persona, el oficial de seguridad lo informa a Recursos Humanos para la medida que corresponda, y si lo causó un proveedor, se aplica su contrato (control 15). No se admiten excepciones al segundo factor en las cuentas de administración del directorio, de Azure y de Microsoft 365 (SPOF-03; R-02 es Crítico). Las demás duran como máximo 30 días y llevan una medida compensatoria (acceso limitado a una estación y registro reforzado en el SIEM). La excepción se pide por escrito, con la justificación, la medida compensatoria y la fecha de vencimiento; la propone el dueño del proceso, la evalúa el oficial de seguridad de la información (visto bueno) y la firma la Presidencia, como toda aceptación de riesgo según el apetito de E.05. Queda en el inventario de excepciones, que la Presidencia revisa cada trimestre en la revisión por la dirección (E.02).","Revisión":"Anual y ante todo cambio significativo (incidente de identidad, sistema nuevo). Dueño del documento: el oficial de seguridad de la información."},"f3":{"Objetivo y disparador":"Otorgamiento, revocación y segundo factor de los accesos. Que cada acceso tenga aprobación, se retire a tiempo y use el segundo factor donde la política lo exige. Disparadores: alta, cambio de puesto o baja que comunica Recursos Humanos; solicitud de acceso; vinculación de un dispositivo de cliente. Calendario: verificación mensual del segundo factor y revisión trimestral de los accesos de administración.","Responsable y frecuencia":"El administrador de identidades de Operaciones y Tecnología (proceso P-06), con Recursos Humanos y los dueños de la información. Por evento, mensual y trimestral.\nLos cargos que nombra este procedimiento son funciones que asume el personal de TI de Operaciones y Tecnología (85 personas, ficha), no plazas nuevas: el programa no crea plazas que la ficha no registra (E.02).","Pasos numerados":"1. Recursos Humanos comunica por escrito el alta, el cambio de puesto o la baja, en el formulario o la herramienta de solicitudes de TI, el mismo día hábil en que ocurre. Criterio: la solicitud sin la firma de Recursos Humanos no se procesa.\n2. Alta o cambio: el administrador de identidades prepara la cuenta con los accesos del puesto y pide la aprobación del dueño de la información de cada sistema. Criterio: sin aprobación no se otorga.\n3. Baja: deshabilita la cuenta en el directorio, Entra ID, el IBM i, la base Oracle y el portal del BCR. Criterio: de inmediato y a más tardar dentro de las 4 horas siguientes al aviso; la cuenta queda deshabilitada, no borrada.\n4. Cuenta de administración nueva: enrola dos llaves FIDO2 (principal y respaldo) antes de habilitarla y la incluye en la política de acceso condicional que exige el segundo factor. Criterio: sin las dos llaves enroladas, la cuenta no se habilita.\n5. Cada mes, obtener de los registros de inicio de sesión de Entra ID y de los controladores de dominio los inicios de sesión administrativos sin segundo factor resistente al phishing. Criterio: tiene que ser cero; cada caso es un hallazgo.\n6. Cada mes, obtener de la plataforma de la app el porcentaje de usuarios activos con dispositivo vinculado y las altas de destinatarios confirmadas con segundo factor. Criterio: un destinatario nuevo registrado sin segundo factor es un hallazgo.\n7. Cada trimestre, enviar a cada dueño la lista de accesos de administración a sus sistemas. Criterio: los que no confirma en 10 días hábiles se retiran.\n8. Emitir el reporte mensual: altas, bajas y tiempo de revocación; cobertura del segundo factor de administradores y de clientes de la app; excepciones vigentes. Criterio: se entrega al oficial antes del décimo día hábil del mes siguiente.","Evidencia generada":"Solicitudes aprobadas; registro de bajas con la hora del aviso y la de la deshabilitación; registro de inicios de sesión de Entra ID; registro de enrolamiento de llaves; reporte mensual; actas trimestrales de revisión.\nAlimenta IND-07 y IND-08 de E.09: IND-07, «Cuentas de administración con segundo factor resistente al phishing», mensual; IND-08, «Usuarios activos de la app con segundo factor», mensual. Los mide Operaciones y Tecnología, que ejecuta el procedimiento, y los recibe el oficial de seguridad, que rinde cuentas (E.06).","Escalamiento":"Un inicio de sesión administrativo sin segundo factor o desde un lugar inusual genera una alerta en el SIEM y se informa de inmediato al oficial de seguridad, que decide bloquear la cuenta. Una baja no ejecutada en 4 horas se escala al Director de Operaciones y Tecnología y al oficial. Un aumento de vinculaciones o de destinatarios nuevos desde un mismo origen se informa a Banca de Personas, que responde por el fraude por toma de cuentas (fila 13 de E.06)."},"f4":{"Técnicos":"1. Acceso condicional de Entra ID que exige llave FIDO2 a los roles administrativos de Entra ID, Azure y Microsoft 365, configurado según el CIS Microsoft 365 Foundations Benchmark v7.0.0 y el CIS Microsoft Azure Foundations Benchmark v7.0.0 (lista oficial de CIS Benchmarks en cisecurity.org/cis-benchmarks, consultada el 7 de noviembre de 2026). Las cuentas de administración del Active Directory local, del IBM i, de la base Oracle y de los equipos de red inician sesión desde estaciones de administración que exigen el segundo factor (declaración 3), igual que las cuentas de tesorería del portal del BCR cuando el portal no admite la llave (declaración 4). Son 30 cuentas privilegiadas de todas esas plataformas, con dos llaves por cuenta y licencia Entra ID P2 (S-12).\n2. Controladores de dominio configurados según el CIS Microsoft Windows Server 2019 Benchmark v5.0.0. Windows Server 2019 conserva el soporte extendido hasta el 9 de enero de 2029 (Microsoft Lifecycle), dentro del horizonte largo de E.10, que planifica su actualización.\n3. Segundo factor en la app: vinculación del dispositivo con verificación por SMS al vincularlo y confirmación con el dispositivo vinculado al registrar destinatarios nuevos (S-17). La app es un desarrollo a medida (ficha), sin Benchmark; sus servidores se configuran según el CIS Red Hat Enterprise Linux 8 Benchmark v4.0.0. Red Hat Enterprise Linux 8 conserva el soporte de mantenimiento hasta el 31 de mayo de 2029 (Red Hat Product Life Cycles).\n4. Perfiles privilegiados del IBM i administrados solo desde estaciones de administración con segundo factor y configurados según el CIS IBM i V7R4M0 Benchmark v2.1.0. Hallazgo de fin de soporte: IBM i 7.4 dejó el soporte estándar el 30 de septiembre de 2026 y su extensión pagada termina el 30 de septiembre de 2029 (IBM, «Release life cycle», consultada el 7 de noviembre de 2026); la ficha no registra la extensión (R-11). La migración pasa a E.10 como iniciativa, igual que en el control 15.","Administrativos":"1. Flujo de solicitudes con aprobación del dueño de la información y aviso de bajas de Recursos Humanos (6.1, 6.2).\n2. Revisión trimestral de los accesos de administración por sus dueños.\n3. Inventario de sistemas de autenticación revisado cada año (6.6).\n4. Capacitación de los administradores en el uso de las llaves (S-12).","Físicos":"1. Llaves FIDO2 de respaldo y credenciales de las cuentas de emergencia en caja fuerte del sitio de contingencia, con doble custodia y registro de cada retiro.\n2. Los medios de acceso físico al centro de datos (llaves o tarjetas) se entregan y se retiran con el mismo flujo de altas y bajas."}},{"id":11,"source":"E07_Desarrollo_Control_CIS_11_SENG.docx","f1":{"Control CIS v8.1":"Control 11 — Recuperación de datos (Data Recovery), CIS Critical Security Controls v8.1.2, p. 54–56.","Salvaguardas del IG asignado en este control":"5 salvaguardas, todas dentro del IG3 asignado (4 IG1, 1 IG2 y 0 IG3); nombre e IG de la tabla G.2 de E08 y página del texto oficial.\nDiseñadas ahora (5; la política, el SOP y la F.4 de este documento las resuelven y E.10 fija cuándo operan):\n11.1 Proceso de recuperación de datos (IG1, p. 55)\n11.2 Respaldos automatizados (IG1, p. 55)\n11.3 Protección de los datos de recuperación (IG1, p. 55)\n11.4 Instancia aislada de datos de recuperación (IG1, p. 56)\n11.5 Prueba de recuperación (IG2, p. 56)\nPor qué ahora: Ninguna va al roadmap: la recuperación no demostrada (BR-01) y el punto de recuperación incumplido (BR-02) son eslabones del escenario de cifrado (R-01, Crítico). 11.1 a 11.4 son IG1; 11.5 (IG2) se adelanta por OBJ-01, cuya prueba completa vence el 30-jun-2027. Llevar la réplica o el respaldo del core a la frecuencia que exige el RPO de 15 minutos no es una salvaguarda aparte: E.05 lo deja abierto en R-01 y pasa a E.10 como iniciativa (BIA_P07, recomendación 2).\nAl roadmap de E.10: ninguna.","Riesgos que mitiga":"R-01 (Crítico, inherente 20): la copia aislada e inmutable (11.4) y la recuperación probada (11.5) acotan el cifrado del core al MTPD de 24 horas (SPOF-01, SPOF-06, BR-02; SLE-01, USD 612 000); el RPO de 15 minutos sigue abierto y pasa a E.10, como dice E.05.\nR-06 (Alto, inherente 12): la conmutación al sitio de contingencia se prueba junto con la recuperación (11.5; BR-01).\nObjetivo de E.02: OBJ-01.","Correspondencia ISO":"8.13, Information backup (respaldo de la información).\n5.30, ICT readiness for business continuity (preparación de las TIC para la continuidad del negocio).\n5.29, Information security during disruption (seguridad de la información durante una interrupción).\n7.11, Supporting utilities (servicios de apoyo).\nTítulos del índice oficial de ISO/IEC 27002:2022 (vista previa de IEC, consultada el 7 de noviembre de 2026), con su traducción literal.","Función CSF 2.0":"Recuperar. El CIS asigna la función Recuperar a tres de sus cinco salvaguardas (11.2, 11.4 y 11.5)."},"f2":{"Propósito":"Política de respaldo y recuperación de datos. El core se respalda a cinta cada día, que se guarda en el sitio de contingencia, y tiene una réplica asíncrona cada hora; la conmutación al sitio de contingencia es manual, y la última prueba de recuperación, parcial y de hace 18 meses, tardó 11 horas (ficha). El BIA fija para el core un RTO de 8 horas y un RPO de 15 minutos (E.03), que hoy no se cumplen (BR-01, BR-02). En un cifrado (R-01, Crítico), la réplica copia también el cifrado (SPOF-01) y la cinta diaria es la única copia independiente (SPOF-06): con 72 horas de interrupción, la pérdida es de USD 612 000 (SLE-01). Esta política fija qué se respalda, cómo se protegen las copias y cómo se demuestra que se recupera dentro del RTO.","Alcance":"Base y plataforma del core (A-01, A-02), base Oracle 19c de canales (A-17), directorio y cuentas del personal (A-09), copias y réplicas (A-03), sitio de contingencia (A-08) y equipo de guardia de TI (A-05); la compensación de pagos, que depende del core; y la parte de Microsoft 365 y Azure que controla BUNICA. Aplica a Operaciones y Tecnología y a los dueños de los procesos que verifican las pruebas.\nVigencia: rige desde el 4 de enero de 2027, arranque del programa. Las declaraciones que exigen implantar algo que hoy no existe son exigibles desde la fecha que indican o, si no la indican, desde que cierra su iniciativa en E.10, a más tardar al final del horizonte que E.10 le asigne; mientras tanto, el oficial de seguridad informa su avance en la revisión trimestral de la Presidencia (E.02).","Declaraciones de política":"1. Cada sistema del alcance tiene en el manual de recuperación su frecuencia de respaldo, su prioridad de recuperación (primero el core, después la compensación y los canales, según E.03) y su RTO y RPO.\n2. El core se respalda automáticamente cada día a cinta, que se guarda en el sitio de contingencia, y se replica cada hora; la base de canales se replica cada 15 minutos al sitio de contingencia.\n3. Mientras la iniciativa de E.10 no lleve la réplica o el respaldo del core a la frecuencia que exige el RPO de 15 minutos (BR-02), cada prueba informa la pérdida de datos real frente a ese RPO.\n4. Cada semana se genera una copia aislada del core en un cartucho WORM, que queda fuera de línea y no puede modificarse ni borrarse.\n5. Las copias se protegen como la información original, que es Restringida (E.04): cifradas y con acceso solo por cuentas de respaldo dedicadas, con segundo factor y separadas del directorio de uso diario.\n6. Cada trimestre se restaura una muestra de los sistemas del alcance, y cada año se recupera el core completo en el sitio de contingencia, midiendo el tiempo frente al RTO de 8 horas; la primera prueba completa se hace a más tardar el 30 de junio de 2027 (OBJ-01).\n7. Ninguna prueba se da por satisfactoria sin la verificación funcional del dueño del proceso, que cuadra los saldos del core restaurado.\n8. El manual de recuperación se revisa cada año y después de cada prueba o incidente.","Roles y responsabilidades":"La Presidencia aprueba esta política y el oficial de seguridad de la información la redacta (fila 1 de E.06). El oficial rinde cuentas por el control. Operaciones y Tecnología ejecuta los respaldos, las copias aisladas y las pruebas, y mide el tiempo real de recuperación; Finanzas ejecuta el envío manual de lotes de la compensación en la prueba anual. La declaración de la contingencia es de la Presidencia, a propuesta del dueño del proceso (fila 10). Auditoría Interna, informada de las pruebas, verifica el cumplimiento en la auditoría de E.09 (fila 8).\nFila 4 de E.06, «Respaldar los datos y proteger las copias, con una copia aislada del core»: A (rinde cuentas): oficial de seguridad de la información; R (ejecuta): Operaciones y Tecnología; C (consultada): Banca de Personas y Finanzas; I (informada): Presidencia.\nFila 24 de E.06, «Probar cada trimestre la restauración de una muestra y cada año la recuperación completa del core en el sitio de contingencia, y simular los procedimientos alternos»: A (rinde cuentas): oficial de seguridad de la información; R (ejecuta): Operaciones y Tecnología y Finanzas; C (consultada): Banca de Personas; I (informada): Presidencia, Riesgos y Cumplimiento y Auditoría Interna.","Cumplimiento y excepciones":"El incumplimiento de esta política se registra como hallazgo y se corrige con el procedimiento; si lo causó una persona, el oficial de seguridad lo informa a Recursos Humanos para la medida que corresponda, y si lo causó un proveedor, se aplica su contrato (control 15). No se admiten excepciones a la copia aislada semanal ni a la prueba trimestral. La prueba anual pued

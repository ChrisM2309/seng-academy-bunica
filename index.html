e postergarse como máximo 30 días, con la prueba trimestral más reciente como medida compensatoria. La excepción se pide por escrito, con la justificación, la medida compensatoria y la fecha de vencimiento; la propone el dueño del proceso, la evalúa el oficial de seguridad de la información (visto bueno) y la firma la Presidencia, como toda aceptación de riesgo según el apetito de E.05. Queda en el inventario de excepciones, que la Presidencia revisa cada trimestre en la revisión por la dirección (E.02).","Revisión":"Anual y después de cada prueba o incidente. Dueño del documento: el oficial de seguridad de la información."},"f3":{"Objetivo y disparador":"Respaldo, copia aislada y prueba de recuperación del core. Asegurar que existen copias íntegras e inmutables y demostrar la recuperación dentro del RTO. Calendario: diario (verificación del respaldo), semanal (copia aislada), trimestral (restauración de una muestra) y anual (recuperación completa). Por evento: fallo de un respaldo, incidente de cifrado o cambio mayor del core.","Responsable y frecuencia":"El administrador de respaldos y el equipo de guardia de TI de Operaciones y Tecnología; los dueños verifican la restauración y el oficial de seguridad firma las actas. Diario, semanal, trimestral y anual, según el paso.\nLos cargos que nombra este procedimiento son funciones que asume el personal de TI de Operaciones y Tecnología (85 personas, ficha), no plazas nuevas: el programa no crea plazas que la ficha no registra (E.02).","Pasos numerados":"1. Cada día, verificar en la bitácora que la cinta del core y la réplica terminaron sin error. Criterio: un fallo se repite el mismo día y se informa al oficial.\n2. Cada semana, generar la copia aislada en un cartucho LTO-9 WORM, verificar que se lee y registrar su número de serie; trasladarla al resguardo fuera de línea del sitio de contingencia. Criterio: un cartucho que no se lee se reemplaza la misma semana.\n3. Cada semana, revisar en el SIEM que las cuentas de respaldo no tuvieron sesiones fuera de las ventanas programadas. Criterio: toda sesión fuera de ventana es un posible incidente.\n4. Cada trimestre, elegir una muestra, rotando entre el core, la base de canales, el directorio y Microsoft 365, restaurarla en un entorno aislado y medir el tiempo. Criterio: la restauración es exitosa si el dueño confirma la integridad de los datos.\n5. Cada año, con la Presidencia informada, recuperar el core completo en el sitio de contingencia desde la cinta, conmutando al sitio y ejecutando como procedimientos alternos el envío manual de lotes de la compensación y la atención con reportes impresos en una muestra de sucursales; una de cada dos pruebas parte de la copia aislada, como si la cinta estuviera cifrada. Criterio: la prueba cuenta como completa solo si el core queda operativo en el sitio de contingencia y los dos alternos se ejecutan; el acta registra, para cada alterno, cuántas horas se sostuvo y cuántas estima sostenibles su dueño con lo observado, frente a las 24 horas que supone S-08 y a las 12 de RTO + WRT, y el resultado actualiza S-08 en la revisión del BIA.\n6. Medir el tiempo desde la declaración hasta el core operativo, frente al RTO de 8 horas, y los datos perdidos, frente al RPO de 15 minutos; el dueño del core cuadra los saldos. Criterio: cumple si el core opera dentro de las 8 horas; mientras la pérdida de datos supere los 15 minutos, se registra como brecha abierta (BR-02).\n7. Registrar las desviaciones y actualizar el manual de recuperación. Criterio: cada desviación queda con responsable y fecha.\n8. Emitir el acta de la prueba, firmada por el oficial y por el dueño, con los tiempos, el resultado y el plan de corrección. Criterio: sin la firma del dueño, la prueba no cuenta como satisfactoria (declaración 7).","Evidencia generada":"Bitácora diaria de respaldos; registro de copias aisladas (fecha, número de serie y verificación); actas trimestrales de restauración; acta anual de recuperación con el tiempo real frente al RTO (OBJ-01).\nAlimenta IND-09 y IND-10 de E.09: IND-09, «Tiempo real de recuperación del core frente al RTO (OBJ-01)», por evento; IND-10, «Restauraciones de muestra exitosas», trimestral. Los mide Operaciones y Tecnología, que ejecuta el procedimiento, y los recibe el oficial de seguridad, que rinde cuentas (E.06).","Escalamiento":"Una copia aislada que no se genera en la semana se informa el mismo día al oficial de seguridad y al Director de Operaciones y Tecnología, y se genera en 24 horas. Una prueba que supera el RTO de 8 horas se informa a la Presidencia en la revisión trimestral, con un plan de corrección en 30 días y una nueva prueba en el trimestre siguiente. Una pérdida de datos mayor que el RPO se informa en cada revisión trimestral hasta que cierre la iniciativa de E.10. Un cifrado real activa la declaración de contingencia (fila 10 de E.06) y la respuesta a incidentes (fila 5)."},"f4":{"Técnicos":"1. Copia aislada semanal del core en cartuchos LTO-9 WORM de 18 TB, fuera de línea (S-13), además de la cinta diaria y de la réplica horaria que ya registra la ficha.\n2. Cifrado de las copias y cuentas de respaldo dedicadas, con segundo factor y separadas del directorio de uso diario (controles 5 y 6), para que la toma del directorio (R-02) no alcance las copias.\n3. Plataformas configuradas según su Benchmark (lista oficial de CIS Benchmarks en cisecurity.org/cis-benchmarks, consultada el 7 de noviembre de 2026): CIS IBM i V7R4M0 Benchmark v2.1.0 para el core y CIS Oracle Database 19c Benchmark v2.0.0 para la base de canales. Oracle Database 19c conserva el Premier Support hasta diciembre de 2029 (Oracle Lifetime Support Policy). Hallazgo de fin de soporte: IBM i 7.4 dejó el soporte estándar el 30 de septiembre de 2026 y su extensión pagada termina el 30 de septiembre de 2029 (IBM, «Release life cycle», consultada el 7 de noviembre de 2026); la ficha no registra la extensión (R-11). La migración pasa a E.10 como iniciativa, igual que en el control 15.\n4. Restauraciones de prueba en un entorno aislado de la red de producción, con el tiempo medido desde la declaración hasta el sistema operativo.","Administrativos":"1. Manual de recuperación con las prioridades y métricas de E.03 (11.1).\n2. Calendario anual de pruebas trimestrales y de la prueba completa, aprobado por el oficial, con actas firmadas.\n3. Capacitación del equipo de guardia en la conmutación manual al sitio de contingencia (S-13).","Físicos":"1. Cartuchos WORM en caja ignífuga en el sitio de contingencia, en otra zona de San Salvador (ficha), con doble custodia y registro de entrada y salida.\n2. Traslado de cintas y cartuchos en contenedor cerrado, con registro de la cadena de custodia.\n3. Energía de respaldo del centro de datos (ISO/IEC 27002:2022, 7.11; R-06), que la ficha no registra: se verifica o se implanta, y se prueba junto con la prueba anual."}},{"id":12,"source":"E07_Desarrollo_Control_CIS_12_SENG.docx","f1":{"Control CIS v8.1":"Control 12 — Gestión de la infraestructura de red (Network Infrastructure Management), CIS Critical Security Controls v8.1.2, p. 57–60.","Salvaguardas del IG asignado en este control":"8 salvaguardas, todas dentro del IG3 asignado (1 IG1, 6 IG2 y 1 IG3); nombre e IG de la tabla G.2 de E08 y página del texto oficial.\nDiseñadas ahora (6; la política, el SOP y la F.4 de este documento las resuelven y E.10 fija cuándo operan):\n12.1 Infraestructura de red actualizada (IG1, p. 58)\n12.2 Arquitectura de red segura (IG2, p. 59)\n12.3 Gestión segura de la infraestructura de red (IG2, p. 59)\n12.4 Diagramas de arquitectura (IG2, p. 59)\n12.6 Protocolos seguros de gestión y comunicación (IG2, p. 59)\n12.8 Recursos de cómputo dedicados para administración (IG3, p. 60)\nPor qué ahora: 12.1 es IG1. 12.2 (IG2) es el tratamiento de R-01 y R-03 (segmentación) y de R-08, R-10 y R-12 (disponibilidad de la arquitectura) en E.05, y OBJ-04 de E.02 vence el 31-dic-2027. 12.3, 12.4 y 12.6 (IG2) delimitan ese tratamiento: sin el diagrama (12.4) no hay zonas que aprobar, y sin una administración segura de los equipos (12.3, 12.6) las reglas aprobadas pueden alterarse. 12.8 (IG3) se adelanta por R-02 (Crítico): administrar desde la zona de administración, en estaciones o sesiones dedicadas sin internet ni correo, impide que el phishing contra el personal de TI alcance una sesión administrativa, y es el medio con que el control 6 exige el segundo factor donde la plataforma no lo admite.\nAl roadmap de E.10 (2):\n12.5 AAA centralizado (IG2, p. 59). Depende de que las cuentas administrativas del directorio, único y hoy sin segundo factor (SPOF-03, BR-03), queden protegidas por los controles 5 y 6: centralizar antes en él la autenticación de los equipos de red ampliaría lo que se pierde si se toma (R-02).\n12.7 VPN y AAA para dispositivos remotos (IG2, p. 60). Depende del AAA centralizado (12.5). La ficha no registra acceso remoto a la red; el que exista exige desde ahora segundo factor (6.4, control 6).","Riesgos que mitiga":"R-01 (Crítico, inherente 20): segmentar la red corta el camino de una estación de sucursal infectada al core y a su réplica (BR-04; SLE-01, USD 612 000).\nR-03 (Alto, inherente 16): el mismo corte protege la base de los 650 000 clientes (SLE-02, USD 195 000).\nR-08 (Alto, inherente 12): la disponibilidad que exige 12.2 pide un segundo medio de conexión con el sistema de pagos del BCR (SPOF-05).\nR-10 (Alto, inherente 12): y un servicio de mitigación de la denegación de servicio para la banca en línea y la app, como la de 2023.\nTambién trata R-12 (Medio, 9): el enlace de respaldo de la red MPLS (SPOF-02). Con 12.8 apoya además R-02 (Crítico), cuyo tratamiento en E.05 son los controles 5 y 6. Objetivo de E.02: OBJ-04.","Correspondencia ISO":"8.20, Networks security (seguridad de las redes).\n8.21, Security of network services (seguridad de los servicios de red).\n8.22, Segregation of networks (segregación de redes).\n8.14, Redundancy of information processing facilities (redundancia de las instalaciones de procesamiento de información).\nTítulos del índice oficial de ISO/IEC 27002:2022 (vista previa de IEC, consultada el 7 de noviembre de 2026), con su traducción literal.","Función CSF 2.0":"Proteger. El CIS asigna la función Proteger a siete de sus ocho salvaguardas (12.4 es de Gobernar)."},"f2":{"Propósito":"Política de gestión de la infraestructura de red. La red interna de BUNICA es plana entre las sucursales y el centro de datos, salvo el entorno de tarjetas (ficha). Un malware en una estación de sucursal, como el de 2026 que contuvo el antivirus, puede llegar al core y a su réplica (R-01, Crítico) o a la base de los 650 000 clientes (R-03). La disponibilidad depende además de enlaces sin respaldo registrado en la ficha: la red MPLS a sucursales y cajeros (SPOF-02) y la conexión única con el sistema de pagos del BCR (SPOF-05). La banca en línea, que en 2023 sufrió cinco horas de denegación de servicio, no tiene registrada una protección contra ese ataque (R-10). Cada hora sin el core cuesta USD 10 924 en el horario de sucursales (E.03). Esta política fija cómo se separa, se administra y se mantiene disponible la red.","Alcance":"Red interna del centro de datos principal y del sitio de contingencia; red MPLS a todas las sucursales y cajeros automáticos (A-07, A-23); cortafuegos perimetrales Palo Alto y los internos que agrega la segmentación; conexión con el sistema de pagos del BCR (A-13); enlaces de internet de la banca en línea y la app (A-18); redes virtuales de los servicios híbridos en Azure. Aplica a Operaciones y Tecnología, a los proveedores que operan enlaces y a todo cambio en esos componentes.\nVigencia: rige desde el 4 de enero de 2027, arranque del programa. Las declaraciones que exigen implantar algo que hoy no existe son exigibles desde la fecha que indican o, si no la indican, desde que cierra su iniciativa en E.10, a más tardar al final del horizonte que E.10 le asigne; mientras tanto, el oficial de seguridad informa su avance en la revisión trimestral de la Presidencia (E.02).","Declaraciones de política":"1. La red se divide, como mínimo, en seis zonas: sucursales y cajeros; core y sus bases; canales digitales expuestos a internet; entorno de tarjetas; administración; y conexión con terceros (sistema de pagos del BCR y procesador de tarjetas). El diagrama de zonas vigente lo aprueba el oficial de seguridad de la información.\n2. Todo tráfico entre la red de sucursales y el centro de datos atraviesa los cortafuegos internos, con denegación por defecto y solo las reglas que aprueba el oficial de seguridad de la información; es exigible para todos los sistemas del core y de la compensación al 31 de diciembre de 2027 (OBJ-04).\n3. Ninguna estación de sucursal tiene acceso de red a la base del core ni a la base Oracle de canales: solo llega a los servicios de aplicación que usa su proceso.\n4. Cada regla de filtrado entre zonas tiene un dueño de proceso, una justificación de negocio y una fecha de revalidación; la regla que no se revalida en 12 meses se retira.\n5. El diagrama de arquitectura de red se actualiza dentro de los 30 días siguientes a todo cambio aprobado y se revisa completo cada año.\n6. Los equipos de red se administran solo por protocolos cifrados (SSH o HTTPS) y su configuración se guarda con control de versiones; ningún cambio se aplica sin una solicitud de cambio aprobada.\n7. Ningún equipo de red opera con software sin soporte del fabricante; las versiones se revisan cada mes.\n8. Cada enlace crítico de los procesos del alcance (red MPLS de sucursales y cajeros, conexión con el BCR y salida a internet de los canales) tiene un medio alterno o un servicio de mitigación, probado al menos una vez al año.\n9. Toda tarea de administración de servidores, bases de datos, directorio y equipos de red se hace desde la zona de administración, en estaciones o sesiones dedicadas, separadas física o lógicamente, sin acceso a internet ni al correo, salvo a los portales de administración de Entra ID, Azure y Microsoft 365.","Roles y responsabilidades":"La Presidencia aprueba esta política y el oficial de seguridad de la información la redacta (fila 1 de E.06). El oficial rinde cuentas por el control; Operaciones y Tecnología (TI) diseña las zonas, configura los cortafuegos y opera los enlaces; Banca de Personas y Finanzas, dueñas de los canales y de la compensación, son consultadas sobre las reglas que tocan sus sistemas. Auditoría Interna verifica el cumplimiento en la auditoría independiente de E.09 (fila 8), que rinde cuentas al Comité de Auditoría.\nFila 22 de E.06, «Segmentar la red entre las sucursales y el centro de datos y aprobar las reglas de filtrado entre segmentos»: A (rinde cuentas): oficial de seguridad de la información; R (ejecuta): Operaciones y Tecnología; C (consultada): Banca de Personas y Finanzas; I (informada): Presidencia.\nFila 25 de E.06, «Asegurar la disponibilidad de la red: enlace de respaldo, segundo medio de conexión con el BCR y mitigación de la denegación de servicio»: A (rinde cuentas): oficial de seguridad de la información; R (ejecuta): Operaciones y Tecnología; C (consultada): Banca de Personas y Finanzas; I (informada): Presidencia.\nFila 19 de E.06, «Evaluar los cambios en los sistemas de los cuatro procesos que el perfil declara críticos y detener los que introduzcan un riesgo no tratado»: A (rinde cuentas): oficial de seguridad de la información; R (ejecuta): Operaciones y Tecnología; C (consultada): Banca de Personas, Riesgos y Cumplimiento y Finanzas; I (informada): Presidencia.","Cumplimiento y excepciones":"Una regla, conexión o equipo fuera de esta política es un hallazgo y se corrige según el procedimiento; si lo causó una persona, el oficial lo informa a Recursos Humanos para la medida que corresponda. No se admiten excepciones a la declaración 2 para el tráfico hacia el core. Las demás duran como máximo 90 días y llevan una medida compensatoria (por ejemplo, una regla limitada a una dirección y un puerto, con su tráfico registrado en el SIEM). La excepción se pide por escrito, con la justificación, la medida compensatoria y la fecha de vencimiento; la propone el dueño del proceso, la evalúa el oficial de seguridad de la información (visto bueno) y la firma la Presidencia, como toda aceptación de riesgo según el apetito de E.05. Queda en el inventario de excepciones, que la Presidencia revisa cada trimestre en la revisión por la dirección (E.02).","Revisión":"Anual, y ante todo cambio significativo (incidente, enlace nuevo, migración del core). Dueño del documento: el oficial de seguridad de la información. Las reglas y el diagrama se revisan cada trimestre con el procedimiento."},"f3":{"Objetivo y disparador":"Revisión de la segmentación y de la disponibilidad de la red. Comprobar que el tráfico entre zonas sigue solo las reglas aprobadas, que el software de red tiene soporte y que los medios alternos funcionan. Calendario: trimestral para las reglas y el diagrama (primera revisión en abril de 2027), mensual para las versiones y anual para la prueba de los enlaces. Por evento: solicitud de cambio en un cortafuegos o un enlace, incidente en la red o alta de una sucursal o un cajero.","Responsable y frecuencia":"El administrador de red de Operaciones y Tecnología (TI) lo ejecuta; el oficial de seguridad de la información revisa y firma el reporte. Trimestral, mensual y anual, según el paso.\nLos cargos que nombra este procedimiento son funciones que asume el personal de TI de Operaciones y Tecnología (85 personas, ficha), no plazas nuevas: el programa no crea plazas que la ficha no registra (E.02).","Pasos numerados":"1. Exportar el conjunto de reglas vigente de cada cortafuegos, perimetral e interno, desde su consola y compararlo con la versión aprobada en el repositorio de configuración. Criterio: toda diferencia sin solicitud de cambio aprobada es un hallazgo.\n2. Listar las reglas con más de 12 meses sin revalidar y pedir al dueño su renovación o su retiro en 10 días hábiles. Criterio: la regla que no se renueva se retira.\n3. Prueba de aislamiento: desde una estación de sucursal de prueba, intentar conectarse a la base del core, a la base Oracle de canales y a la consola de un cortafuegos. Criterio: los tres intentos se bloquean y quedan registrados; si alguno pasa, se escala.\n4. Revisar en el SIEM los registros de tráfico entre zonas del trimestre (13.6, control 13) y compararlos con las reglas. Criterio: un flujo permitido sin regla de negocio es un hallazgo.\n5. Cada mes, comparar la versión de software de cada cortafuegos, enrutador y conmutador con el ciclo de vida que publica su fabricante. Criterio: si pierde el soporte en los próximos seis meses, se abre la solicitud de actualización; si ya no lo tiene, es un hallazgo.\n6. Intentar conectarse por Telnet y por HTTP a la administración de una muestra de equipos, y navegar por internet (fuera de los portales de administración de la nube) y abrir el correo desde una estación de la zona de administración. Criterio: todos los intentos se rechazan.\n7. Actualizar el diagrama de arquitectura con los cambios del trimestre y registrar su versión. Criterio: el diagrama coincide con las reglas vigentes; cada diferencia se corrige antes de cerrar el reporte.\n8. Cada año, y después de cambiar un enlace, probar los medios alternos: pasar sucursales de muestra al enlace de respaldo, enviar un lote de prueba por el segundo medio con el BCR y activar la mitigación de denegación de servicio con su proveedor. Criterio: cada prueba se completa sin interrumpir la operación y se mide el tiempo de conmutación.\n9. Emitir el reporte trimestral: reglas revisadas, retiradas y en excepción; resultado de la prueba de aislamiento; versiones; porcentaje de los sistemas del core y de la compensación en segmentos con reglas aprobadas (OBJ-04), y plan de corrección con fechas. Criterio: el oficial lo firma solo si cada hallazgo tiene responsable y fecha.","Evidencia generada":"Reporte trimestral firmado por el oficial; comparación de reglas con sus solicitudes de cambio; registro de la prueba de aislamiento (fecha, origen, destino y resultado); inventario mensual de versiones; diagrama versionado; acta anual de la prueba de los enlaces.\nAlimenta IND-01 y IND-02 de E.09: IND-01, «Sistemas del core y de la compensación en segmentos con reglas aprobadas (OBJ-04)», trimestral; IND-02, «Enlaces críticos con medio alterno probado», por evento. Los mide Operaciones y Tecnología, que ejecuta el procedimiento, y los recibe el oficial de seguridad, que rinde cuentas (E.06).","Escalamiento":"Una regla directa entre sucursales y el core sin respaldo, o una prueba de aislamiento que pasa, se bloquea dentro de 24 horas y se informa al oficial de seguridad y al Director de Operaciones y Tecnología. Si bloquearla detiene la operación, la Presidencia decide en la misma jornada la medida temporal (el procedimiento alterno del proceso afectado) y la regla se retira igual: la declaración 2 no admite excepciones para el tráfico hacia el core. Un medio alterno que falla en la prueba lleva un plan de corrección en 30 días, informado al oficial y a los dueños de P-01 y P-03, y se reporta en la revisión trimestral de la Presidencia. Una versión sin soporte es un hallazgo para E.10."},"f4":{"Técnicos":"1. Dos cortafuegos internos Palo Alto PA-3410, uno en el centro de datos y otro en el sitio de contingencia (S-14), entre la red de sucursales y el centro de datos, con zonas, denegación por defecto y registro al SIEM de todo el tráfico permitido y denegado, más la zona de administración, sin salida a internet, desde la que se administran todas las plataformas (12.8).\n2. Configuración de los cortafuegos perimetrales e internos según el CIS Palo Alto Firewall 11 Benchmark v1.2.0 (lista oficial de CIS Benchmarks en cisecurity.org/cis-benchmarks, consultada el 7 de noviembre de 2026). La ficha no declara la versión de PAN-OS: se cita el Benchmark de la versión más reciente que publica la lista, y se declara. La revisión mensual (12.1) confirma la versión instalada; si es una sin soporte del fabricante, se registra como hallazgo y pasa a E.10. La ficha tampoco registra el fabricante de los enrutadores de la red MPLS ni de los conmutadores: el diagrama (12.4) lo registra y se aplica su Benchmark o, si no lo hay, la guía de endurecimiento del fabricante.\n3. Administración de los equipos de red solo por SSH y HTTPS, con la configuración en un repositorio con control de versiones (12.3, 12.6); redes virtuales de Azure con grupos de seguridad de red según el CIS Microsoft Azure Foundations Benchmark v7.0.0. La ficha no registra red inalámbrica corporativa: si se instala, usa WPA2 Enterprise o superior con autenticación 802.1X (12.6).\n4. Disponibilidad de la arquitectura (12.2): enlace de respaldo de la red MPLS por otro medio o proveedor para las sucursales y los cajeros (R-12), segundo medio de conexión con el sistema de pagos del BCR (R-08) y servicio de mitigación de la denegación de servicio para la banca en línea y la app (R-10).","Administrativos":"1. Procedimiento de solicitud, aprobación y revalidación de reglas, con dueño y vencimiento a 12 meses.\n2. Revisión trimestral con reporte firmado y diagrama versionado (procedimiento F.3).\n3. Evaluación de todo cambio en la red de los procesos críticos por el oficial de seguridad, con la autoridad de E.02 para detenerlo (fila 19 de E.06).\n4. Contratos de los enlaces (MPLS, respaldo y mitigación) con requisitos de seguridad (15.4) y nivel de servicio (ISO/IEC 27002:2022, 5.20), coordinados con el control 15.","Físicos":"1. Equipos de red del centro de datos y del sitio de contingencia en gabinetes con cerradura y registro de acceso; en las sucursales, los equipos de comunicaciones en gabinete cerrado.\n2. El enlace de respaldo entra a cada sede por una ruta física distinta de la del principal (ISO/IEC 27002:2022, 7.12, seguridad del cableado).\n3. Los cortafuegos y el núcleo de la red del centro de datos se conectan a la energía de respaldo que exige R-06 (ISO/IEC 27002:2022, 7.11); la ficha no registra si existe ni su capacidad, así que se verifica o se implanta."}},{"id":13,"source":"E07_Desarrollo_Control_CIS_13_SENG.docx","f1":{"Control CIS v8.1":"Control 13 — Monitoreo y defensa de la red (Network Monitoring and Defense), CIS Critical Security Controls v8.1.2, p. 61–64.","Salvaguardas del IG asignado en este control":"11 salvaguardas, todas dentro del IG3 asignado (0 IG1, 6 IG2 y 5 IG3); nombre e IG de la tabla G.2 de E08 y página del texto oficial.\nDiseñadas ahora (4; la política, el SOP y la F.4 de este documento las resuelven y E.10 fija cuándo operan):\n13.1 Alertas centralizadas de eventos de seguridad (IG2, p. 62)\n13.4 Filtrado de tráfico entre segmentos (IG2, p. 63)\n13.6 Registros de flujo de red (IG2, p. 63)\n13.11 Ajuste de umbrales de alerta (IG3, p. 64)\nPor qué ahora: Las cuatro son IG2 o IG3 y se diseñan ahora porque son el tratamiento de R-01 (filtrado, 13.4) y de R-03 (alertas centralizadas, 13.1) en E.05, con OBJ-03 y OBJ-04 al 31-dic-2027; 13.6 aporta al SIEM los flujos de los cortafuegos y 13.11 afina sus umbrales, ambos dentro del costo de E.05 (S-15). E.10 las implanta en el mediano plazo, cuando vencen esos objetivos, y adelanta 13.11 (IG3) del largo al mediano.\nAl roadmap de E.10 (7):\n13.2 IDS en host (IG2, p. 63). Requiere un agente en cada servidor y estación y el SIEM operando (13.1; OBJ-03, 31 de diciembre de 2027): sin el SIEM y la guardia del control 13, nadie atiende las alertas del agente fuera del horario laboral (igual que 10.7 en E.08). Hoy el antivirus corporativo de la ficha cubre las estaciones y los servidores Windows.\n13.3 IDS de red (IG2, p. 63). Requiere la suscripción de prevención de amenazas de los cortafuegos internos, que el costo de E.05 no incluye (S-14); se agrega cuando la segmentación esté operando.\n13.5 Control de acceso para activos remotos (IG2, p. 63). Depende de la VPN con AAA centralizado (12.7), que también va al roadmap.\n13.7 IPS en host (IG3, p. 64). Igual que 13.2: después del SIEM y con el mismo agente.\n13.8 IPS de red (IG3, p. 64). Igual que 13.3: después de la segmentación y con la misma suscripción.\n13.9 Control de acceso a nivel de puerto (IG3, p. 64). El control de acceso por puerto en las sucursales exige el inventario de dispositivos (control 1, E.08) y el AAA centralizado (12.5).\n13.10 Filtrado de capa de aplicación (IG3, p. 64). El filtrado de capa de aplicación de la banca en línea y la app se diseña con la gestión de vulnerabilidades (control 7) y la mitigación de la denegación de servicio (control 12).","Riesgos que mitiga":"R-01 (Crítico, inherente 20): el filtrado entre segmentos (13.4) impide que el malware de una sucursal llegue al core.\nR-03 (Alto, inherente 16): las alertas centralizadas (13.1) detectan el movimiento hacia la base y la extracción de los datos de los 650 000 clientes antes de que termine (BR-05).\nAdemás da la detección que falta en R-05 y R-09, cuya vulnerabilidad también es BR-05, aunque E.05 no les asocia este control. Objetivos de E.02: OBJ-03 y OBJ-04.","Correspondencia ISO":"8.15, Logging (registro de eventos).\n8.16, Monitoring activities (actividades de monitoreo).\n8.22, Segregation of networks (segregación de redes).\n5.25, Assessment and decision on information security events (evaluación y decisión sobre los eventos de seguridad de la información).\nTítulos del índice oficial de ISO/IEC 27002:2022 (vista previa de IEC, consultada el 7 de noviembre de 2026), con su traducción literal.","Función CSF 2.0":"Detectar. Es la que justifica su selección: las tres salvaguardas del SIEM que se diseñan ahora (13.1, 13.6 y 13.11) son de Detectar según el CIS. El filtrado (13.4) es de Proteger y se diseña junto con el control 12; en todo el control, el CIS da cinco salvaguardas a Detectar y seis a Proteger."},"f2":{"Propósito":"Política de monitoreo y defensa de la red. BUNICA no tiene SIEM ni monitoreo centralizado (ficha; BR-05). La campaña de phishing de 2024 duró tres semanas y obligó a reembolsar USD 85 000 a los clientes; el malware de 2026 en una estación de sucursal lo contuvo el antivirus, pero ningún monitoreo centralizado habría detectado su avance por la red plana hacia el core (R-01, Crítico) ni la extracción de los datos de los 650 000 clientes (R-03; solo notificarlos cuesta USD 195 000, SLE-02). Esta política fija qué se registra, dónde se correlaciona, quién revisa y en qué plazo, y cómo se filtra el tráfico entre segmentos.","Alcance":"Las fuentes de registros de los sistemas que sostienen el core y los canales digitales (A-02, A-06, A-07, A-09, A-18 y A-23 de E.04; OBJ-03) y las demás del inventario E.04 (A-10, A-13 y A-15); los cortafuegos perimetrales e internos; Microsoft 365 y Azure. Aplica a Operaciones y Tecnología, que opera el SIEM, y a los dueños de los sistemas que envían registros.\nVigencia: rige desde el 4 de enero de 2027, arranque del programa. Las declaraciones que exigen implantar algo que hoy no existe son exigibles desde la fecha que indican o, si no la indican, desde que cierra su iniciativa en E.10, a más tardar al final del horizonte que E.10 le asigne; mientras tanto, el oficial de seguridad informa su avance en la revisión trimestral de la Presidencia (E.02).","Declaraciones de política":"1. Toda fuente de registros de los sistemas que sostienen el core y los canales digitales envía sus registros de auditoría y sus alertas de seguridad al SIEM; meta: el 100 % de esas fuentes al 31 de diciembre de 2027 (OBJ-03).\n2. El SIEM aplica, como mínimo, reglas de correlación para inicios de sesión administrativos anómalos, tráfico entre la red de sucursales y el centro de datos, extracción masiva desde las bases del core o de canales y patrones de toma de cuentas de clientes.\n3. Toda alerta de severidad alta se notifica al equipo de guardia de TI y se atiende dentro de 4 horas, todos los días; las de severidad media, dentro del día hábil siguiente.\n4. Las alertas y los registros se revisan al menos una vez por semana, con un informe firmado por el analista (OBJ-03); los eventos de seguridad y los registros del entorno de tarjetas, cada día, con la revisión automatizada del SIEM (PCI DSS v4.0.1, 10.4.1; REQ-05).\n5. Los umbrales de las alertas se ajustan cada mes según los falsos positivos y los incidentes del mes.\n6. Los registros de flujo de tráfico de los cortafuegos se recogen en el SIEM. Todos los registros se conservan al menos 90 días (8.10, p. 45), y los del entorno de tarjetas, 12 meses, con los tres más recientes disponibles para análisis inmediato (PCI DSS v4.0.1, 10.5.1; REQ-05).\n7. El tráfico entre segmentos se filtra con las reglas aprobadas del control 12, y todo tráfico denegado entre la red de sucursales y el centro de datos genera un registro en el SIEM.\n8. Toda alerta confirmada como incidente pasa a la respuesta a incidentes (fila 5 de E.06) y, si afecta datos personales, a la evaluación de la notificación en 72 horas (fila 6).","Roles y responsabilidades":"La Presidencia aprueba esta política y el oficial de seguridad de la información la redacta (fila 1 de E.06). El oficial rinde cuentas por el control; Operaciones y Tecnología lo opera con el analista de alertas y, fuera de horario, con el equipo de guardia de TI (A-05); Banca de Personas y Finanzas, dueñas de los sistemas de canales y de compensación, son consultadas sobre las reglas de sus fuentes. Auditoría Interna verifica el cumplimiento en la auditoría de E.09 (fila 8).\nFila 23 de E.06, «Centralizar en el SIEM los registros de auditoría y las alertas de seguridad, y revisarlos cada semana»: A (rinde cuentas): oficial de seguridad de la información; R (ejecuta): Operaciones y Tecnología; C (consultada): Banca de Personas y Finanzas; I (informada): Presidencia.\nFila 22 de E.06, «Segmentar la red entre las sucursales y el centro de datos y aprobar las reglas de filtrado entre segmentos»: A (rinde cuentas): oficial de seguridad de la información; R (ejecuta): Operaciones y Tecnología; C (consultada): Banca de Personas y Finanzas; I (informada): Presidencia.\nFila 5 de E.06, «Responder a los incidentes de seguridad: contener, erradicar, recuperar y documentar»: A (rinde cuentas): oficial de seguridad de la información; R (ejecuta): Operaciones y Tecnología; C (consultada): Banca de Personas, Riesgos y Cumplimiento, Gerencia Legal, Finanzas y Recursos Humanos; I (informada): Presidencia y Banca Corporativa.","Cumplimiento y excepciones":"El incumplimiento de esta política se registra como hallazgo y se corrige con el procedimiento; si lo causó una persona, el oficial de seguridad lo informa a Recursos Humanos para la medida que corresponda, y si lo causó un proveedor, se aplica su contrato (control 15). Desactivar una regla de correlación o una fuente sin aprobación, además, se trata como posible incidente. Una fuente que no puede integrarse todavía (por ejemplo, por el formato de los registros del IBM i) admite una excepción de 90 días como máximo, con la revisión manual semanal de sus registros como medida compensatoria. La excepción se pide por escrito, con la justificación, la medida compensatoria y la fecha de vencimiento; la propone el dueño del proceso, la evalúa el oficial de seguridad de la información (visto bueno) y la firma la Presidencia, como toda aceptación de riesgo según el apetito de E.05. Queda en el inventario de excepciones, que la Presidencia revisa cada trimestre en la revisión por la dirección (E.02).","Revisión":"Anual y ante todo incidente significativo. Dueño del documento: el oficial de seguridad de la información. Las reglas y los umbrales se revisan cada mes con el procedimiento."},"f3":{"Objetivo y disparador":"Atención diaria de alertas, revisión semanal y afinamiento mensual del SIEM. Detectar a tiempo el movimiento lateral, la extracción de datos y la toma de cuentas, y asegurar que todas las fuentes reportan. Calendario: diario (atención de alertas), semanal (revisión), mensual (afinamiento y cobertura). Por evento: alerta de severidad alta a cualquier hora, fuente que deja de reportar o sistema nuevo.","Responsable y frecuencia":"El analista de alertas, una persona de TI de Operaciones y Tecnología dedicada a tiempo completo (su costo, el de una plaza técnica, está en S-15), en horario laboral, y el equipo de guardia de TI fuera de él; el oficial de seguridad revisa el informe semanal y el reporte mensual. Diario, semanal y mensual, según el paso.\nLos cargos que nombra este procedimiento son funciones que asume el personal de TI de Operaciones y Tecnología (85 personas, ficha), no plazas nuevas: el programa no crea plazas que la ficha no registra (E.02).","Pasos numerados":"1. Cada día hábil, revisar en Microsoft Sentinel la cola de alertas abiertas y clasificar cada una como falso positivo, evento sin impacto o incidente. Criterio: es incidente si afecta la confidencialidad, la integridad o la disponibilidad de un activo de E.04; en caso de duda, se trata como incidente.\n2. Alerta de severidad alta: la guardia de TI la atiende dentro de 4 horas. Criterio: si es un incidente, abre el caso de respuesta y avisa al oficial de seguridad.\n3. Verificar la salud de las fuentes. Criterio: una fuente del inventario sin eventos en 24 horas abre una solicitud a su administrador.\n4. Cada semana, revisar los tableros de inicios de sesión administrativos, tráfico denegado entre las sucursales y el centro de datos, consultas masivas a las bases del core y de canales, y fallos de autenticación de clientes en los canales. Criterio: todo patrón que no explica un cambio aprobado se investiga.\n5. Cada semana, emitir el informe de revisión firmado por el analista. Criterio: se emite aunque no haya hallazgos; una semana sin informe es un incumplimiento de OBJ-03.\n6. Cada mes, medir los falsos positivos de cada regla. Criterio: la regla en la que más de la mitad de las alertas del mes son falsos positivos se ajusta, y el cambio de umbral se documenta (13.11).\n7. Cada mes, comparar las fuentes integradas con el inventario de E.04 y calcular el porcentaje de OBJ-03. Criterio: una fuente sin conector o sin eventos en el mes cuenta como no integrada.\n8. Cada mes, reportar al oficial: alertas por severidad, tiempos de atención, incidentes, cobertura de fuentes y cambios de reglas. Criterio: se entrega antes del décimo día hábil del mes siguiente.","Evidencia generada":"Casos y bitácora de alertas en Microsoft Sentinel, con la hora de creación y de atención; informe semanal firmado; registro de cambios de reglas y umbrales; reporte mensual de cobertura de fuentes.\nAlimenta IND-05 y IND-06 de E.09: IND-05, «Fuentes de registros integradas al SIEM (OBJ-03)», mensual; IND-06, «Alertas de severidad alta atendidas a tiempo», mensual. Los mide Operaciones y Tecnología, que ejecuta el procedimiento, y los recibe el oficial de seguridad, que rinde cuentas (E.06).","Escalamiento":"Un incidente confirmado se informa de inmediato al oficial de seguridad, que decide la contención y, si hay datos personales, inicia el plazo de 72 horas con la Presidencia (fila 6 de E.06). Una fuente crítica (core, directorio o cortafuegos) que no reporta por más de 24 horas se informa al oficial y al Director de Operaciones y Tecnología y se trata como posible incidente. Una alerta alta sin atender en 4 horas se escala al Director de Operaciones y Tecnología."},"f4":{"Técnicos":"1. Microsoft Sentinel como SIEM, con 30 GB diarios de ingesta facturable de las fuentes de E.04 (S-15): controladores de dominio y servidores Windows, estaciones Windows 11, cortafuegos, Red Hat Enterprise Linux 8 y Oracle 19c de canales, IBM i del core y cajeros. Los registros de auditoría de Office 365 y la actividad de Azure se ingieren sin costo (Microsoft Learn, citado en S-15).\n2. Registro de auditoría de cada fuente configurado según el CIS Benchmark de su versión (lista oficial de CIS Benchmarks en cisecurity.org/cis-benchmarks, consultada el 7 de noviembre de 2026): CIS Microsoft Windows Server 2019 Benchmark v5.0.0 (controladores de dominio), CIS Microsoft Windows 11 Enterprise Benchmark v5.1.1 (estaciones; la ficha no declara la edición ni la versión de Windows 11, se cita la de Enterprise y se declara; su soporte depende de la versión que registre el inventario de 2.1 de E.08, y la 23H2 Enterprise lo perdió el 10 de noviembre de 2026), CIS Red Hat Enterprise Linux 8 Benchmark v4.0.0, CIS Oracle Database 19c Benchmark v2.0.0 y CIS IBM i V7R4M0 Benchmark v2.1.0. Con soporte del fabricante: Windows Server 2019 conserva el soporte extendido hasta el 9 de enero de 2029 (Microsoft Lifecycle); Red Hat Enterprise Linux 8 conserva el soporte de mantenimiento hasta el 31 de mayo de 2029 (Red Hat Product Life Cycles), y Oracle Database 19c conserva el Premier Support hasta diciembre de 2029 (Oracle Lifetime Support Policy); las tres fechas caen en el horizonte largo de E.10, que planifica su actualización. Hallazgo de fin de soporte: IBM i 7.4 dejó el soporte estándar el 30 de septiembre de 2026 y su extensión pagada termina el 30 de septiembre de 2029 (IBM, «Release life cycle», consultada el 7 de noviembre de 2026); la ficha no registra la extensión (R-11). La migración pasa a E.10 como iniciativa, igual que en el control 15.\n3. Filtrado entre segmentos con los cortafuegos internos del control 12 (13.4) y envío de sus registros de tráfico al SIEM (13.6).\n4. Reglas de correlación para los cuatro escenarios de la declaración 2, con umbrales afinados cada mes (13.11).","Administrativos":"1. Procedimiento de clasificación de alertas por severidad, con los plazos de la declaración 3.\n2. Informe semanal firmado por el analista y reporte mensual al oficial de seguridad.\n3. Turnos del equipo de guardia de TI que cubren las alertas altas fuera del horario laboral.\n4. Capacitación del analista y de la guardia en Microsoft Sentinel y en los escenarios de BUNICA (S-15).","Físicos":"1. El registro de acceso físico al centro de datos y al sitio de contingencia se revisa cada semana con las alertas y, si es electrónico, se integra al SIEM (ISO/IEC 27002:2022, 7.4).\n2. La consola de monitoreo se opera desde un área de TI de acceso restringido."}},{"id":15,"source":"E07_Desarrollo_Control_CIS_15_SENG.docx","f1":{"Control CIS v8.1":"Control 15 — Gestión de proveedores de servicios (Service Provider Management), CIS Critical Security Controls v8.1.2, p. 70–73.","Salvaguardas del IG asignado en este control":"7 salvaguardas, todas dentro del IG3 asignado (1 IG1, 3 IG2 y 3 IG3); nombre e IG de la tabla G.2 de E08 y página del texto oficial.\nDiseñadas ahora (6; la política, el SOP y la F.4 de este documento las resuelven y E.10 fija cuándo operan):\n15.1 Inventario de proveedores (IG1, p. 72)\n15.2 Política de gestión de proveedores (IG2, p. 72)\n15.3 Clasificación de proveedores (IG2, p. 72)\n15.4 Requisitos de seguridad en contratos (IG2, p. 72)\n15.5 Evaluación de proveedores (IG3, p. 73)\n15.6 Monitoreo de proveedores (IG3, p. 73)\nPor qué ahora: 15.1 es IG1. 15.2 a 15.4 son IG2 y forman la base que exige 15.4 («consistent with the enterprise’s service provider management policy»). 15.5 y 15.6, de IG3, se adelantan porque son el tratamiento de R-07 en E.05 (evaluación y monitoreo del procesador de tarjetas).\nAl roadmap de E.10 (1):\n15.7 Desvinculación segura (IG3, p. 73). Ninguno de los riesgos de E.05 la exige y la ficha no registra una salida de proveedor prevista. Se diseña antes de la primera terminación o cambio de un proveedor crítico; mientras tanto, la declaración 3 exige en cada contrato la devolución o destrucción de los datos al terminar.","Riesgos que mitiga":"R-07 (Alto, inherente 12): requisitos de seguridad y de notificación en el contrato del procesador de tarjetas, con evaluación y monitoreo (SPOF-04, BR-07).\nR-10 (Alto, inherente 12): requisitos de seguridad y nivel de servicio en el contrato del servicio de mitigación de la denegación de servicio.\nR-11 (Alto, inherente 12): soporte del fabricante de IBM i y del servidor IBM Power con contrato y nivel de servicio (A-24, BR-07).\nTambién trata R-12 (Medio, 9): contrato del proveedor de la red MPLS (BR-07).","Correspondencia ISO":"5.19, Information security in supplier relationships (seguridad de la información en las relaciones con proveedores).\n5.20, Addressing information security within supplier agreements (tratamiento de la seguridad de la información en los acuerdos con proveedores).\n5.21, Managing information security in the ICT supply chain (gestión de la seguridad de la información en la cadena de suministro de TIC).\n5.22, Monitoring, review and change management of supplier services (seguimiento, revisión y gestión de cambios de los servicios de proveedores).\n5.23, Information security for use of cloud services (seguridad de la información en el uso de servicios en la nube).\nTítulos del índice oficial de ISO/IEC 27002:2022 (vista previa de IEC, consultada el 7 de noviembre de 2026), con su traducción literal.","Función CSF 2.0":"Gobernar. El CIS asigna la función Gobernar a cinco de sus siete salvaguardas (15.2 a 15.6)."},"f2":{"Propósito":"Política de gestión de proveedores de servicios. La operación de BUNICA depende de terceros cuyos contratos y niveles de servicio la ficha no registra (BR-07): el procesador de tarjetas externo, sin alternativa registrada (SPOF-04), en un banco que registra 38 millones de transacciones con tarjeta al año y cumple PCI DSS como emisor; el proveedor de la red MPLS (SPOF-02), y el fabricante de IBM i y del servidor IBM Power (A-24), cuyo sistema operativo dejó el soporte estándar el 30 de septiembre de 2026 (R-11). A ellos se suman Microsoft (Microsoft 365, Azure y Entra ID) y Salesforce. Esta política fija cómo se inventarían, clasifican, contratan, evalúan y vigilan, para que la falla o el incidente de un tercero no deje a un proceso crítico sin respuesta.","Alcance":"Todo tercero que guarda, procesa o transmite datos de BUNICA o de sus clientes, o del que depende la disponibilidad de un proceso del alcance: el procesador de tarjetas (A-15), el proveedor de la red MPLS, IBM (A-24), Microsoft, Salesforce, el soporte de los cortafuegos Palo Alto, si está contratado, y los proveedores que agregue el programa (enlace de respaldo, mitigación de la denegación de servicio, verificación por SMS de la app y SIEM). El sistema de pagos del BCR, que opera el Banco Central y que E.02 excluye del alcance, se inventaría y se vigila; las cláusulas de la declaración 3 se aplican a los contratos que BUNICA negocia, no a la conexión con el BCR. Aplica a las unidades que contratan: Operaciones y Tecnología, Finanzas y Banca de Personas, con la Gerencia Legal.\nVigencia: rige desde el 4 de enero de 2027, arranque del programa. Las declaraciones que exigen implantar algo que hoy no existe son exigibles desde la fecha que indican o, si no la indican, desde que cierra su iniciativa en E.10, a más tardar al final del horizonte que E.10 le asigne; mientras tanto, el oficial de seguridad informa su avance en la revisión trimestral de la Presidencia (E.02).","Declaraciones de política":"1. Todo proveedor del alcance figura en el inventario de proveedores con su clasificación, los datos y los procesos que toca y un responsable de BUNICA; el inventario se revisa cada año y con cada contrato nuevo o renovado.\n2. Cada proveedor se clasifica como crítico, alto o bajo según la sensibilidad y el volumen de los datos, la disponibilidad que exige el proceso (MTPD de E.03), la regulación aplicable (PCI DSS, LPDP) y su riesgo en E.05. El procesador de tarjetas, el proveedor de la red MPLS, IBM y Microsoft son críticos.\n3. Ningún contrato con un proveedor crítico o alto se firma ni se renueva sin cláusulas de requisitos mínimos de seguridad, notificación a BUNICA de todo incidente con sus datos dentro de las 24 horas (para que BUNICA cumpla las 72 horas de la LPDP, art. 25), cifrado de los datos, devolución o destrucción de los datos al terminar, nivel de servicio con tiempo de restauración y derecho de evaluación.\n4. Cada proveedor crítico se evalúa antes de contratarlo y al menos una vez al año: el procesador de tarjetas, con su declaración de cumplimiento de PCI DSS (Attestation of Compliance, AoC) vigente; los servicios en la nube, con su informe SOC 2; los demás, con el cuestionario de seguridad de BUNICA.\n5. Cada proveedor crítico se vigila cada mes: cumplimiento del nivel de servicio, avisos de seguridad y notas de versión del fabricante, y vigencia de su AoC o de su informe SOC 2.\n6. Ningún componente de un proceso del alcance opera con un producto sin soporte del fabricante sin una excepción firmada (salvaguarda 2.2, en E.08) y un plan de migración con fecha.\n7. Todo acceso de un proveedor a los sistemas de BUNICA usa una cuenta nominal, con segundo factor y vencimiento, y se revoca de inmediato y, a más tardar, dentro de las 4 horas siguientes al fin de su necesidad (control 6, declaración 2; control 5).","Roles y responsabilidades":"La Presidencia aprueba esta política y el oficial de seguridad de la información la redacta (fila 1 de E.06). El oficial rinde cuentas por el control y aprueba la clasificación y las evaluaciones. Operaciones y Tecnología gestiona los proveedores de tecnología, y Finanzas, dueña del procesador de tarjetas en E.04 (A-15; incluye la tesorería, S-01), su contrato; la Gerencia Legal revisa las cláusulas. En la excepción del IBM i, la Presidencia es consultada porque acepta su riesgo residual (fila 28). Auditoría Interna verifica el cumplimiento en la auditoría de E.09 (fila 8).\nFila 26 de E.06, «Gestionar los proveedores de servicios: inventario, requisitos y nivel de servicio en los contratos, evaluación y monitoreo»: A (rinde cuentas): oficial de seguridad de la información; R (ejecuta): Operaciones y Tecnología y Finanzas; C (consultada): Banca de Personas, Riesgos y Cumplimiento y Gerencia Legal; I (informada): Presidencia.\nFila 28 de E.06, «Mantener el sistema operativo del core con soporte del fabricante o, sin la extensión, con la excepción de la 2.2, cuyo riesgo residual acepta la Presidencia, y planificar su migración»: A (rinde cuentas): oficial de seguridad de la información; R (ejecuta): Operaciones y Tecnología; C (consultada): Presidencia, Banca de Personas, Riesgos y Cumplimiento y Finanzas.\nFila 11 de E.06, «Mantener el cumplimiento de PCI DSS como emisor en el entorno de tarjetas»: A (rinde cuentas): oficial de seguridad de la información; R (ejecuta): Operaciones y Tecnología y Finanzas; C (consultada): Riesgos y Cumplimiento y Gerencia Legal; I (informada): Presidencia.","Cumplimiento y excepciones":"El incumplimiento de esta política se registra como hallazgo y se corrige con el procedimiento; si lo causó una persona, el oficial de seguridad lo informa a Recursos Humanos para la medida que corresponda, y si lo causó un proveedor, se aplica su contrato (control 15). Un contrato vigente que no tiene las cláusulas puede seguir hasta su renovación, como máximo 12 meses, con la evaluación anual y el monitoreo mensual como medidas compensatorias. Si el proveedor no acepta las cláusulas al renovar, decide la Presidencia con el riesgo residual de E.05. La excepción se pide por escrito, con la justificación, la medida compensatoria y la fecha de vencimiento; la propone el dueño del proceso, la evalúa el oficial de seguridad de la información (visto bueno) y la firma la Presidencia, como toda aceptación de riesgo según el apetito de E.05. Queda en el inventario de excepciones, que la Presidencia revisa cada trimestre en la revisión por la dirección (E.02).","Revisión":"Anual (lo pide 15.2) y ante todo cambio significativo: proveedor crítico nuevo, incidente de un proveedor o cambio de norma. Dueño del documento: el oficial de seguridad de la información."},"f3":{"Objetivo y disparador":"Alta, evaluación anual y vigilancia mensual de proveedores. Que cada proveedor del alcance esté inventariado, clasificado, con un contrato conforme a la política, evaluado y vigilado. Disparadores: solicitud de contratación o de renovación; cierre de cada mes (vigilancia); aniversario del contrato (evaluación); incidente de un proveedor.","Responsable y frecuencia":"El administrador de contratos de tecnología de Operaciones y Tecnología, con Finanzas para el procesador de tarjetas; la Gerencia Legal revisa las cláusulas y el oficial de seguridad aprueba la clasificación y la evaluación. Por evento, mensual, trimestral (reporte) y anual.\nLos cargos que nombra este procedimiento son funciones que asume el personal de TI de Operaciones y Tecnología (85 personas, ficha), no plazas nuevas: el programa no crea plazas que la ficha no registra (E.02).","Pasos numerados":"1. Al recibir una solicitud de contratación o de renovación, registrar al proveedor en el inventario de proveedores (registro controlado que mantiene Operaciones y Tecnología): servicio, datos, procesos, responsable de BUNICA y fechas del contrato. Criterio: sin registro no se tramita el contrato.\n2. Clasificarlo con los criterios de la declaración 2. Criterio: si toca los datos de toda una base de clientes o sostiene un proceso con MTPD de 24 horas, es crítico.\n3. Enviar el contrato a la Gerencia Legal, que lo compara con la lista de cláusulas de la declaración 3. Criterio: sin las cláusulas no se firma; si es una renovación inevitable, se tramita la excepción.\n4. Evaluar al proveedor crítico: pedir la AoC de PCI DSS al procesador, el informe SOC 2 a los servicios en la nube y el cuestionario al resto. Criterio: una AoC o un informe vencido, o un hallazgo grave sin plan de corrección, es una evaluación no conforme.\n5. Cada mes, revisar el cumplimiento del nivel de servicio de cada proveedor crítico (disponibilidad y tiempo de restauración), los avisos de seguridad y notas de versión de IBM, Microsoft y Palo Alto, y la vigencia de las AoC y de los informes SOC 2. Criterio: dos meses seguidos bajo el nivel de servicio, o un aviso de seguridad que afecta a un producto de BUNICA, abren un hallazgo.\n6. Registrar en el inventario la fecha de fin de soporte de cada producto que entrega un proveedor (IBM i, Windows Server, la versión de Windows 11 instalada en las estaciones, Red Hat Enterprise Linux, Oracle y PAN-OS). Criterio: lo que pierde el soporte en los próximos 12 meses abre un hallazgo para E.10.\n7. Cada año, revisar el inventario, la clasificación y todos los contratos para confirmar que ninguno carece de requisitos de seguridad. Criterio: el contrato sin requisitos se marca para renegociarlo en su próxima renovación.\n8. Emitir el reporte de proveedores: críticos con contrato conforme, críticos evaluados en los últimos 12 meses, incumplimientos de nivel de servicio, excepciones vigentes y hallazgos de fin de soporte. Criterio: se presenta en la revisión trimestral de la Presidencia (E.02).","Evidencia generada":"Inventario de proveedores con clasificación y fechas; lista de cláusulas verificada por la Gerencia Legal en cada contrato; informes de evaluación (AoC, SOC 2 o cuestionario); bitácora mensual de vigilancia; reporte de proveedores.\nAlimenta IND-03 y IND-04 de E.09: IND-03, «Proveedores críticos con contrato conforme», trimestral; IND-04, «Proveedores críticos evaluados en los últimos 12 meses», trimestral. Los mide Operaciones y Tecnología, que ejecuta el procedimiento, y los recibe el oficial de seguridad, que rinde cuentas (E.06).","Escalamiento":"Un incidente de un proveedor que afecta datos de BUNICA se informa de inmediato al oficial de seguridad, que activa la respuesta a incidentes (fila 5 de E.06) y evalúa la notificación de 72 horas (fila 6). El incumplimiento del nivel de servicio dos meses seguidos o una AoC o un informe SOC 2 vencido se informa al dueño del proceso y a la Presidencia en la revisión trimestral, con un plan de acción. Un producto sin soporte se registra como hallazgo para E.10 y requiere la excepción firmada."},"f4":{"Técnicos":"1. Cuentas de proveedores nominales en el directorio, o como invitados en Entra ID, con segundo factor, vencimiento automático y registro de sus accesos en el SIEM (controles 5, 6 y 13).\n2. Configuración de la parte de BUNICA en Microsoft 365 y en Azure según el CIS Microsoft 365 Foundations Benchmark v7.0.0 y el CIS Microsoft Azure Foundations Benchmark v7.0.0 (lista oficial de CIS Benchmarks en cisecurity.org/cis-benchmarks, consultada el 7 de noviembre de 2026); la plataforma la protege Microsoft, fuera del alcance (E.02).\n3. Interfaces con el procesador de tarjetas y con el sistema de pagos del BCR cifradas y limitadas a las direcciones y puertos acordados, en la zona de terceros del control 12.\n4. Hallazgo de fin de soporte: IBM i 7.4 (la versión que declara la ficha) dejó el soporte estándar el 30 de septiembre de 2026; la extensión de servicio pagada va del 1 de octubre de 2026 al 30 de septiembre de 2029 (IBM, «Release life cycle», ibm.com/support/pages/node/668157, consultada el 7 de noviembre de 2026). La ficha no registra que BUNICA tenga la extensión (R-11). Pasa a E.10 como iniciativa: contratar la extensión mientras dure la migración a una versión con soporte estándar (IBM i 7.5 o 7.6, cuyas fechas de fin IBM aún no anuncia; la elección queda para E.10). Hasta la migración, el IBM i se configura según el CIS IBM i V7R4M0 Benchmark v2.1.0, publicado para la versión que declara la ficha.","Administrativos":"1. Inventario y clasificación de proveedores revisados cada año (15.1, 15.3).\n2. Lista de cláusulas de seguridad (15.4) y de nivel de servicio (ISO/IEC 27002:2022, 5.20) que la Gerencia Legal aplica en cada contrato.\n3. Evaluación anual de los proveedores críticos: AoC de PCI DSS del procesador y SOC 2 de los servicios en la nube (15.5).\n4. Reporte de proveedores en la revisión trimestral de la Presidencia (E.02).","Físicos":"1. Visitas de proveedores al centro de datos y al sitio de contingencia con cita previa, acompañamiento y registro de entrada y salida.\n2. Todo equipo o medio que un proveedor retira para reparación sale sin datos o cifrado, con acta de entrega (ISO/IEC 27002:2022, 7.13, mantenimiento de equipos)."}}],"developedSafeguards":[{"control":5,"id":"5.1","name":"Inventario de cuentas","ig":"IG1","state":"diseñada ahora","source":"E.07"},{"control":5,"id":"5.2","name":"Contraseñas únicas","ig":"IG1","state":"diseñada ahora","source":"E.07"},{"control":5,"id":"5.3","name":"Deshabilitar cuentas inactivas","ig":"IG1","state":"diseñada ahora","source":"E.07"},{"control":5,"id":"5.4","name":"Restringir privilegios de administrador a cuentas dedicadas","ig":"IG1","state":"diseñada ahora","source":"E.07"},{"control":5,"id":"5.5","name":"Inventario de cuentas de servicio","ig":"IG2","state":"diseñada ahora","source":"E.07"},{"control":5,"id":"5.6","name":"Gestión centralizada de cuentas","ig":"IG2","state":"al roadmap","source":"E.07"},{"control":6,"id":"6.1","name":"Proceso de otorgamiento de acceso","ig":"IG1","state":"diseñada ahora","source":"E.07"},{"control":6,"id":"6.2","name":"Proceso de revocación","ig":"IG1","state":"diseñada ahora","source":"E.07"},{"control":6,"id":"6.3","name":"MFA en aplicaciones expuestas","ig":"IG1","state":"diseñada ahora","source":"E.07"},{"control":6,"id":"6.4","name":"MFA en acceso remoto a la red","ig":"IG1","state":"diseñada ahora","source":"E.07"},{"control":6,"id":"6.5","name":"MFA en acceso administrativo","ig":"IG1","state":"diseñada ahora","source":"E.07"},{"control":6,"id":"6.6","name":"Inventario de sistemas de autenticación y autorización","ig":"IG2","state":"diseñada ahora","source":"E.07"},{"control":6,"id":"6.7","name":"Control de acceso centralizado","ig":"IG2","state":"al roadmap","source":"E.07"},{"control":6,"id":"6.8","name":"Control de acceso basado en roles","ig":"IG3","state":"al roadmap","source":"E.07"},{"control":11,"id":"11.1","name":"Proceso de recuperación de datos","ig":"IG1","state":"diseñada ahora","source":"E.07"},{"control":11,"id":"11.2","name":"Respaldos automatizados","ig":"IG1","state":"diseñada ahora","source":"E.07"},{"control":11,"id":"11.3","name":"Protección de los datos de recuperación","ig":"IG1","state":"diseñada ahora","source":"E.07"},{"control":11,"id":"11.4","name":"Instancia aislada de datos de recuperación","ig":"IG1","state":"diseñada ahora","source":"E.07"},{"control":11,"id":"11.5","name":"Prueba de recuperación","ig":"IG2","state":"diseñada ahora","source":"E.07"},{"control":12,"id":"12.1","name":"Infraestructura de red actualizada","ig":"IG1","state":"diseñada ahora","source":"E.07"},{"control":12,"id":"12.2","name":"Arquitectura de red segura","ig":"IG2","state":"diseñada ahora","source":"E.07"},{"control":12,"id":"12.3","name":"Gestión segura de la infraestructura de red","ig":"IG2","state":"diseñada ahora","source":"E.07"},{"control":12,"id":"12.4","name":"Diagramas de arquitectura","ig":"IG2","state":"diseñada ahora","source":"E.07"},{"control":12,"id":"12.6","name":"Protocolos seguros de gestión y comunicación","ig":"IG2","state":"diseñada ahora","source":"E.07"},{"control":12,"id":"12.8","name":"Recursos de cómputo dedicados para administración","ig":"IG3","state":"diseñada ahora","source":"E.07"},{"control":12,"id":"12.5","name":"AAA centralizado","ig":"IG2","state":"al roadmap","source":"E.07"},{"control":12,"id":"12.7","name":"VPN y AAA para dispositivos remotos","ig":"IG2","state":"al roadmap","source":"E.07"},{"control":13,"id":"13.1","name":"Alertas centralizadas de eventos de seguridad","ig":"IG2","state":"diseñada ahora","source":"E.07"},{"control":13,"id":"13.4","name":"Filtrado de tráfico entre segmentos","ig":"IG2","state":"diseñada ahora","source":"E.07"},{"control":13,"id":"13.6","name":"Registros de flujo de red","ig":"IG2","state":"diseñada ahora","source":"E.07"},{"control":13,"id":"13.11","name":"Ajuste de umbrales de alerta","ig":"IG3","state":"diseñada ahora","source":"E.07"},{"control":13,"id":"13.2","name":"IDS

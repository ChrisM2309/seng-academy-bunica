<body data-mode="express">
  <div class="shell">

    </aside>

name":"Configuración segura de la infraestructura de red","ig":"IG1","measure":"Proceso de configuración segura de los cortafuegos Palo Alto con su Benchmark y de los enrutadores y conmutadores con su CIS Benchmark si la lista oficial lo publica o, si no, con la guía del fabricante, que el inventario (1.1) y el diagrama (12.4) registran; se revisa cada año.","state":"Por implementar","evidence":"Procedimiento y configuración de referencia por equipo","source":"E.08"},{"control":4,"id":"4.3","name":"Bloqueo automático de sesión","ig":"IG1","measure":"Bloqueo automático de sesión a los 15 minutos en Windows 11 y los servidores Windows (política del directorio), en RHEL 8 y en las sesiones del IBM i; a los 2 minutos en los móviles corporativos que registre el inventario de 1.1 (la ficha no los registra).","state":"Por implementar","evidence":"Configuración del bloqueo por plataforma","source":"E.08"},{"control":4,"id":"4.4","name":"Firewall en servidores","ig":"IG1","measure":"Cortafuegos del sistema operativo activo en los servidores Windows (Firewall de Windows) y RHEL 8 (firewalld), con solo los puertos de cada servicio, y filtrado IP en el IBM i donde el fabricante lo admite.","state":"Por implementar","evidence":"Reglas por servidor revisadas en cada cambio","source":"E.08"},{"control":4,"id":"4.5","name":"Firewall en dispositivos de usuario final","ig":"IG1","measure":"Firewall de Windows en las estaciones Windows 11 con la regla de denegar por defecto y solo los servicios autorizados, aplicado por política del directorio.","state":"Por implementar","evidence":"Cumplimiento de la política por estación","source":"E.08"},{"control":4,"id":"4.6","name":"Gestión segura de activos y software","ig":"IG1","measure":"Administración solo por protocolos seguros: SSH en RHEL 8, HTTPS en las consolas de los cortafuegos y de Azure, y las sesiones 5250 del IBM i solo por Telnet sobre TLS (puerto 992); Telnet sin cifrar (puerto 23) y HTTP deshabilitados salvo excepción documentada, y la configuración de Azure en código con control de versiones.","state":"Por implementar","evidence":"Escaneo de protocolos inseguros y excepciones","source":"E.08"},{"control":4,"id":"4.7","name":"Gestión de cuentas por defecto","ig":"IG1","measure":"Cuentas predeterminadas deshabilitadas o con contraseña única y sin uso diario: Administrator de Windows, root de RHEL 8 (sin acceso remoto), QSECOFR y demás perfiles de IBM en el IBM i, SYS y SYSTEM de Oracle y admin de los Palo Alto.","state":"Por implementar","evidence":"Inventario de cuentas predeterminadas y su estado","source":"E.08"},{"control":4,"id":"4.8","name":"Desinstalar o deshabilitar servicios innecesarios","ig":"IG2","measure":"Servicios innecesarios desinstalados o deshabilitados según el Benchmark de cada producto (4.1); en el IBM i, los servidores TCP/IP que el core no usa.","state":"Por implementar","evidence":"Comparación trimestral con la línea base","source":"E.08"},{"control":4,"id":"4.9","name":"Servidores DNS de confianza","ig":"IG2","measure":"Servidores DNS de confianza: los del directorio para la red interna, con reenvío al servicio de filtrado de 9.2; los cortafuegos, enrutadores y cajeros usan solo esos.","state":"Por implementar","evidence":"Configuración DNS de los equipos de red","source":"E.08"},{"control":4,"id":"4.10","name":"Bloqueo automático de dispositivos portátiles","ig":"IG2","measure":"Bloqueo del equipo tras 20 intentos fallidos en los portátiles y 10 en los móviles corporativos que registre el inventario de 1.1 (la ficha solo registra estaciones Windows 11).","state":"Por implementar","evidence":"Política de bloqueo aplicada por equipo","source":"E.08"},{"control":4,"id":"4.11","name":"Borrado remoto de dispositivos portátiles","ig":"IG2","measure":"Borrado remoto de los datos de BUNICA en los portátiles y móviles corporativos que registre el inventario de 1.1 (la ficha no los registra) cuando se pierden, los roban o su usuario se retira, con el aviso de baja de Recursos Humanos (control 5).","state":"Por implementar","evidence":"Registro de borrados remotos","source":"E.08"},{"control":4,"id":"4.12","name":"Espacios de trabajo separados en móviles","ig":"IG3","measure":"Perfil de trabajo separado para las aplicaciones y los datos de BUNICA (correo y Microsoft 365, S-18) en los móviles corporativos que registre el inventario de 1.1 (la ficha no los registra).","state":"Por implementar","evidence":"Móviles inscritos con perfil separado","source":"E.08"},{"control":7,"id":"7.1","name":"Proceso de gestión de vulnerabilidades","ig":"IG1","measure":"Proceso documentado de gestión de vulnerabilidades para los activos de E.04: escaneo mensual de lo expuesto y trimestral de lo interno, severidad y plazos de remediación; revisión anual (R-04; OBJ-02; BR-06).","state":"Por implementar","evidence":"Proceso aprobado y revisión anual","source":"E.08"},{"control":7,"id":"7.2","name":"Proceso de remediación","ig":"IG1","measure":"Estrategia de remediación por riesgo con revisión mensual: plazos por severidad, prioridad para lo expuesto a internet y el entorno de tarjetas, y excepciones firmadas (R-04; OBJ-02; BR-06).","state":"Por implementar","evidence":"Acta mensual de revisión de la remediación","source":"E.08"},{"control":7,"id":"7.3","name":"Parcheo automatizado de sistemas operativos","ig":"IG1","measure":"La ficha registra parches aplicados cuando el proveedor lo pide.\nBrecha: sin automatización ni ciclo mensual (BR-06); se cierra con el parcheo automatizado mensual de Windows 11, los servidores Windows y RHEL 8, y con los PTF del IBM i, que siguen llegando con la extensión de servicio (2.2, R-11), en la ventana que fije el dueño del core, fuera del cierre diario.","state":"Existente parcial","evidence":"Reporte mensual de cumplimiento de parches","source":"E.08"},{"control":7,"id":"7.4","name":"Parcheo automatizado de aplicaciones","ig":"IG1","measure":"La ficha registra parches aplicados cuando el proveedor lo pide, sin distinguir sistemas operativos y aplicaciones.\nBrecha: sin automatización ni ciclo mensual (BR-06); se cierra con la actualización automática mensual de navegadores, aplicaciones de Microsoft 365 y software de las estaciones, y con Oracle 19c y los componentes de los canales en el ciclo de 7.2.","state":"Existente parcial","evidence":"Reporte mensual de versiones de aplicaciones","source":"E.08"},{"control":7,"id":"7.5","name":"Escaneo automatizado de vulnerabilidades de activos internos","ig":"IG2","measure":"Escaneo autenticado y no autenticado de los activos internos cada trimestre con Nessus Expert (S-16), incluidos los servidores del core, de canales y del directorio y las estaciones (OBJ-02).","state":"Por implementar","evidence":"Informe trimestral de escaneo interno","source":"E.08"},{"control":7,"id":"7.6","name":"Escaneo de activos expuestos externamente","ig":"IG2","measure":"Escaneo mensual de la banca en línea, la app y todo lo expuesto a internet con Nessus Expert (S-16; R-04; OBJ-02) y, para lo expuesto que esté en el alcance de PCI DSS, el escaneo trimestral de un proveedor aprobado de escaneo (ASV) de PCI SSC (PCI DSS v4.0.1, 11.3.2; REQ-05).","state":"Por implementar","evidence":"Informe mensual de escaneo externo e informe trimestral del ASV","source":"E.08"},{"control":7,"id":"7.7","name":"Remediación de vulnerabilidades detectadas","ig":"IG2","measure":"Remediación mensual de lo detectado según 7.2, verificada con un nuevo escaneo; lo que no se corrige en plazo queda como excepción firmada (R-04; OBJ-02; BR-06).","state":"Por implementar","evidence":"Porcentaje de vulnerabilidades remediadas en el ciclo","source":"E.08"},{"control":8,"id":"8.1","name":"Proceso de gestión de bitácoras","ig":"IG1","measure":"Proceso documentado de gestión de registros: fuentes de E.04, eventos, revisión semanal (OBJ-03) y diaria en el entorno de tarjetas, y retención de 90 días y de 12 meses en ese entorno (PCI DSS v4.0.1, 10.5.1; REQ-05); revisión anual.","state":"Por implementar","evidence":"Proceso aprobado y revisión anual","source":"E.08"},{"control":8,"id":"8.2","name":"Recolección de bitácoras","ig":"IG1","measure":"Registro de auditoría activo en los controladores de dominio, los servidores Windows, las estaciones Windows 11, RHEL 8, Oracle 19c, el IBM i (diario de auditoría), los cortafuegos y los cajeros, según el Benchmark de cada producto (R-03; BR-05).","state":"Por implementar","evidence":"Configuración de auditoría por fuente","source":"E.08"},{"control":8,"id":"8.3","name":"Almacenamiento adecuado de bitácoras","ig":"IG1","measure":"Espacio suficiente en cada destino para la retención de 8.1: en el origen mientras los registros llegan al SIEM y en Microsoft Sentinel (30 GB diarios, S-15), con alerta de capacidad.","state":"Por implementar","evidence":"Reporte de capacidad de los destinos","source":"E.08"},{"control":8,"id":"8.4","name":"Sincronización de tiempo","ig":"IG2","measure":"Sincronización horaria con dos fuentes: la jerarquía de hora del directorio con dos servidores externos, y RHEL 8, el IBM i, los cortafuegos y los cajeros contra esas mismas fuentes.","state":"Por implementar","evidence":"Configuración de hora y desfase por equipo","source":"E.08"},{"control":8,"id":"8.5","name":"Bitácoras detalladas","ig":"IG2","measure":"Registros detallados (origen, fecha, usuario, hora y direcciones de origen y destino) en los activos con datos sensibles: base del core en IBM i, Oracle 19c de canales, expedientes KYC en Microsoft 365 y directorio.","state":"Por implementar","evidence":"Muestra de eventos con todos los campos","source":"E.08"},{"control":8,"id":"8.6","name":"Bitácoras de consultas DNS","ig":"IG2","measure":"Registro de las consultas DNS en los servidores DNS del directorio y en el servicio de filtrado de 9.2.","state":"Por implementar","evidence":"Registros de consultas DNS conservados","source":"E.08"},{"control":8,"id":"8.7","name":"Bitácoras de solicitudes URL","ig":"IG2","measure":"Registro de las solicitudes de URL en el filtrado de los cortafuegos Palo Alto (9.3).","state":"Por implementar","evidence":"Registros de URL conservados","source":"E.08"},{"control":8,"id":"8.8","name":"Bitácoras de línea de comandos","ig":"IG2","measure":"Registro de la línea de comandos: PowerShell en Windows, bash y sudo en RHEL 8 y los comandos de los perfiles privilegiados del IBM i en su diario de auditoría.","state":"Por implementar","evidence":"Muestra de registros de comandos por plataforma","source":"E.08"},{"control":8,"id":"8.9","name":"Centralización de bitácoras","ig":"IG2","measure":"Centralización de los registros en el SIEM del control 13 (Microsoft Sentinel, S-15), con las fuentes de E.04 (IND-05; R-03; OBJ-03; BR-05).","state":"Por implementar","evidence":"Cobertura mensual de fuentes (IND-05)","source":"E.08"},{"control":8,"id":"8.10","name":"Retención de bitácoras","ig":"IG2","measure":"Retención de 90 días como mínimo en todas las fuentes y de 12 meses en el entorno de tarjetas, con los tres más recientes disponibles de inmediato (PCI DSS v4.0.1, 10.5.1; REQ-05), como fija el control 13.","state":"Por implementar","evidence":"Configuración de retención del SIEM","source":"E.08"},{"control":8,"id":"8.11","name":"Revisión de bitácoras","ig":"IG2","measure":"Revisión semanal de los registros para detectar anomalías, y diaria de los eventos de seguridad y del entorno de tarjetas (PCI DSS v4.0.1, 10.4.1; REQ-05), con el informe firmado del control 13 (R-03; OBJ-03; BR-05).","state":"Por implementar","evidence":"Informe semanal firmado por el analista","source":"E.08"},{"control":8,"id":"8.12","name":"Bitácoras de proveedores de servicios","ig":"IG3","measure":"Registros de los proveedores en el SIEM: auditoría de Microsoft 365, Entra ID y Azure, y los del procesador de tarjetas y del proveedor de la MPLS como requisito de seguridad de su contrato (declaración 3 del control 15; 15.4).\nDependencia: el SIEM operando (OBJ-03, 31-dic-2027) y esa cláusula firmada en la próxima renovación de cada contrato (control 15).","state":"Al roadmap","evidence":"Fuentes de proveedores integradas al SIEM","source":"E.08"},{"control":9,"id":"9.1","name":"Navegadores y clientes de correo soportados","ig":"IG1","measure":"Solo Microsoft Edge y Outlook (S-18) en su última versión, con actualización automática y administrados por política del directorio; los demás navegadores y clientes de correo se desinstalan (2.3) y su ejecución se bloquea cuando opere la lista de 2.5.","state":"Por implementar","evidence":"Reporte de versiones de navegador y correo","source":"E.08"},{"control":9,"id":"9.2","name":"Filtrado DNS","ig":"IG1","measure":"Filtrado DNS que bloquea los dominios maliciosos conocidos: dentro de la red, los DNS del directorio reenvían a un servicio de filtrado; fuera de ella, un agente de filtrado DNS en los portátiles que registre el inventario de 1.1.","state":"Por implementar","evidence":"Reporte de dominios bloqueados","source":"E.08"},{"control":9,"id":"9.3","name":"Filtros de URL en red","ig":"IG2","measure":"Filtrado de URL por categoría y reputación en los cortafuegos Palo Alto por donde sale a internet la navegación (la ficha no registra si las sucursales salen por el centro de datos), con la suscripción de filtrado avanzado de URL de Palo Alto, que la ficha no registra y cuyo costo va a E.10.","state":"Por implementar","evidence":"Política de filtrado y registros de bloqueo","source":"E.08"},{"control":9,"id":"9.4","name":"Restricción de extensiones de navegador y correo","ig":"IG2","measure":"Solo extensiones autorizadas en Edge y complementos autorizados en Outlook (S-18), por política del directorio y de Microsoft 365.","state":"Por implementar","evidence":"Lista de extensiones permitidas aplicada","source":"E.08"},{"control":9,"id":"9.5","name":"DMARC","ig":"IG2","measure":"SPF, DKIM y DMARC con política de rechazo en los dominios de correo de BUNICA, que impiden suplantar su dominio exacto ante clientes y personal, y verificación DMARC del correo entrante.","state":"Por implementar","evidence":"Registros DNS y reportes DMARC","source":"E.08"},{"control":9,"id":"9.6","name":"Bloqueo de tipos de archivo innecesarios","ig":"IG2","measure":"Bloqueo en el correo de Microsoft 365 (S-18) de los adjuntos entrantes de tipos innecesarios: ejecutables, scripts y documentos habilitados para macros (docm, xlsm, pptm).","state":"Por implementar","evidence":"Política de adjuntos y mensajes bloqueados","source":"E.08"},{"control":9,"id":"9.7","name":"Antimalware en el servidor de correo","ig":"IG3","measure":"Protección antimalware del correo de Microsoft 365 (S-18), incluida en todo buzón en la nube, más el análisis de adjuntos con ejecución aislada (Safe Attachments de Microsoft Defender for Office 365 Plan 1, que traen algunos planes o se compra como complemento; la ficha no registra el plan, que se verifica en 2.1, y si falta su costo va a E.10).","state":"Por implementar","evidence":"Reporte de adjuntos analizados y bloqueados","source":"E.08"},{"control":10,"id":"10.1","name":"Antimalware desplegado","ig":"IG1","measure":"Antivirus corporativo en estaciones y servidores Windows (ficha).\nBrecha: los servidores RHEL 8 de canales, el IBM i del core y los cajeros no tienen antimalware registrado; se extiende a RHEL 8, a los cajeros y, en el IBM i, al antimalware que admita el fabricante.","state":"Existente parcial","evidence":"Consola del antivirus con cobertura por equipo","source":"E.08"},{"control":10,"id":"10.2","name":"Actualización automática de firmas","ig":"IG1","measure":"Actualización automática de las firmas del antivirus corporativo en todos los equipos, con alerta del que no se actualice en 24 horas (umbral del diseño, igual que la fuente sin eventos del control 13).","state":"Por implementar","evidence":"Reporte de antigüedad de firmas","source":"E.08"},{"control":10,"id":"10.3","name":"Deshabilitar autoejecución de medios removibles","ig":"IG1","measure":"Ejecución y reproducción automáticas de los medios extraíbles deshabilitadas en Windows 11 y los servidores Windows, por política del directorio.","state":"Por implementar","evidence":"Configuración de la política aplicada","source":"E.08"},{"control":10,"id":"10.4","name":"Escaneo automático de medios removibles","ig":"IG2","measure":"Análisis automático de los medios extraíbles al conectarlos, con el antivirus corporativo.","state":"Por implementar","evidence":"Configuración del antivirus y registros","source":"E.08"},{"control":10,"id":"10.5","name":"Funciones antiexplotación","ig":"IG2","measure":"Funciones antiexplotación de Windows 11 y de los servidores Windows (prevención de ejecución de datos y protección contra vulnerabilidades) activas por política del directorio.","state":"Por implementar","evidence":"Configuración antiexplotación por equipo","source":"E.08"},{"control":10,"id":"10.6","name":"Gestión centralizada del antimalware","ig":"IG2","measure":"Administración central del antivirus corporativo desde una consola con el estado, la versión y las alertas de cada equipo; la necesitan 10.1 y 10.2 (IG1) para saber qué equipo no está protegido o actualizado.","state":"Por implementar","evidence":"Consola central con el estado del parque","source":"E.08"},{"control":10,"id":"10.7","name":"Antimalware basado en comportamiento","ig":"IG2","measure":"Antimalware por comportamiento (detección y respuesta en el equipo) en estaciones y servidores Windows y RHEL 8, con el mismo agente de 13.2 y 13.7 (control 13).\nDependencia: el SIEM operando (control 13; OBJ-03, 31-dic-2027), igual que 13.2: sin el SIEM y la guardia del control 13, nadie atiende las alertas del agente fuera del horario laboral.","state":"Al roadmap","evidence":"Cobertura del agente y detecciones","source":"E.08"},{"control":14,"id":"14.1","name":"Programa de concientización en seguridad","ig":"IG1","measure":"Programa de concientización para los 1 200 empleados: al ingreso y cada año, con contenido revisado cada año; lo ejecuta Recursos Humanos (fila 7 de E.06).","state":"Por implementar","evidence":"Plan anual y registro de asistencia","source":"E.08"},{"control":14,"id":"14.2","name":"Reconocer ataques de ingeniería social","ig":"IG1","measure":"Capacitación para reconocer phishing, compromiso de correo, pretexto y acceso por seguimiento, con simulaciones; en el centro de llamadas, la suplantación con voz clonada y la devolución de la llamada al número registrado (R-13).","state":"Por implementar","evidence":"Resultados de las simulaciones de phishing","source":"E.08"},{"control":14,"id":"14.3","name":"Buenas prácticas de autenticación","ig":"IG1","measure":"Capacitación en autenticación: segundo factor y llaves FIDO2 de los administradores (control 6), contraseñas largas y no reutilizadas, y manejo de credenciales.","state":"Por implementar","evidence":"Registro de capacitación por persona","source":"E.08"},{"control":14,"id":"14.4","name":"Buenas prácticas de manejo de datos","ig":"IG1","measure":"Capacitación en el manejo de datos según los cuatro niveles de E.04 (3.7): guardar, transferir, archivar y destruir; y escritorio y pantalla limpios, incluidos los reportes impresos del alterno.","state":"Por implementar","evidence":"Registro de capacitación y revisión de puestos","source":"E.08"},{"control":14,"id":"14.5","name":"Causas de exposición no intencional de datos","ig":"IG1","measure":"Capacitación en las causas de exposición involuntaria: envío a destinatarios equivocados, pérdida de equipos y expedientes de Microsoft 365 compartidos fuera de BUNICA.","state":"Por implementar","evidence":"Registro de capacitación","source":"E.08"},{"control":14,"id":"14.6","name":"Reconocer y reportar incidentes","ig":"IG1","measure":"Capacitación para reconocer un incidente y reportarlo por el canal de 17.3, sin demora, porque la notificación de la LPDP corre desde que se conoce (REQ-01).","state":"Por implementar","evidence":"Reportes de incidentes del personal","source":"E.08"},{"control":14,"id":"14.7","name":"Identificar y reportar actualizaciones faltantes","ig":"IG1","measure":"Capacitación para verificar y reportar a TI los equipos sin actualizaciones y las fallas de las herramientas automáticas (7.3, 10.2).","state":"Por implementar","evidence":"Registro de capacitación y solicitudes a TI","source":"E.08"},{"control":14,"id":"14.8","name":"Riesgos de conectarse a redes inseguras","ig":"IG1","measure":"Capacitación sobre las redes inseguras: desde una red pública, los equipos de BUNICA solo se conectan por el acceso remoto con segundo factor que exige el control 6 (6.4) y, si hay teletrabajo (la ficha no lo registra), la red del hogar se configura con seguridad.","state":"Por implementar","evidence":"Registro de capacitación","source":"E.08"},{"control":14,"id":"14.9","name":"Capacitación por rol","ig":"IG2","measure":"Capacitación por rol: administración segura para el personal de TI, OWASP Top 10 para el desarrollo de la banca en línea y la app (16.9) e ingeniería social avanzada para la Presidencia, las direcciones, tesorería y el centro de llamadas.","state":"Por implementar","evidence":"Plan por rol y registros de asistencia","source":"E.08"},{"control":16,"id":"16.1","name":"Proceso de desarrollo seguro","ig":"IG2","measure":"Proceso de desarrollo seguro de la banca en línea, la app y la aplicación del core: estándares de diseño y de código, capacitación, vulnerabilidades, código de terceros y pruebas; revisión anual. La ficha registra el core como aplicación propia y los canales como desarrollo a medida, sin decir quién los desarrolla: el proceso rige al personal propio y, para un tercero, es requisito de seguridad de su contrato (declaración 3 del control 15).","state":"Por implementar","evidence":"Proceso aprobado y revisión anual","source":"E.08"},{"control":16,"id":"16.2","name":"Proceso para aceptar y atender vulnerabilidades de software","ig":"IG2","measure":"Proceso para recibir y atender reportes de vulnerabilidades de la banca en línea, la app y el core, con un canal publicado para externos (clientes e investigadores), un responsable de TI y un registro con severidad y tiempos de corrección según 7.2; revisión anual.","state":"Por implementar","evidence":"Registro de reportes y tiempos de corrección","source":"E.08"},{"control":16,"id":"16.3","name":"Análisis de causa raíz de vulnerabilidades","ig":"IG2","measure":"Análisis de causa raíz de cada vulnerabilidad de la banca en línea, la app y el core, para corregir el patrón y no solo el caso.","state":"Por implementar","evidence":"Informes de causa raíz","source":"E.08"},{"control":16,"id":"16.4","name":"Inventario de componentes de terceros","ig":"IG2","measure":"Inventario de los componentes de terceros (lista de materiales) de la banca en línea y la app, con su riesgo y su soporte, evaluado cada mes; complementa el escaneo de 7.6 frente a R-04, porque el escáner no ve las bibliotecas vulnerables dentro de la app.","state":"Por implementar","evidence":"Lista de materiales revisada cada mes","source":"E.08"},{"control":16,"id":"16.5","name":"Componentes de terceros actualizados y confiables","ig":"IG2","measure":"Solo bibliotecas y marcos Java actualizados y de repositorios confiables en la banca en línea y la app, analizados antes de incorporarlos a la lista de materiales de 16.4.","state":"Por implementar","evidence":"Registro de aprobación de componentes","source":"E.08"},{"control":16,"id":"16.6","name":"Sistema de calificación de severidad","ig":"IG2","measure":"Escala de severidad de las vulnerabilidades de aplicación con el nivel mínimo para publicar: no se publica con vulnerabilidades críticas o altas abiertas; revisión anual.","state":"Por implementar","evidence":"Escala aprobada y decisiones de publicación","source":"E.08"},{"control":16,"id":"16.7","name":"Plantillas de configuración endurecida para infraestructura de aplicaciones","ig":"IG2","measure":"Infraestructura de las aplicaciones endurecida con los Benchmarks de 4.1 (RHEL 8 y Oracle 19c) y el servidor de aplicaciones Java, que la ficha no declara, con su CIS Benchmark si la lista oficial lo publica o, si no, con la guía de su fabricante; el software propio no debilita esa configuración.","state":"Por implementar","evidence":"Comparación con la línea base en cada publicación","source":"E.08"},{"control":16,"id":"16.8","name":"Separación de producción y no producción","ig":"IG2","measure":"Ambientes de desarrollo y pruebas separados de producción para la banca en línea, la app y el core, sin datos reales de clientes fuera de producción.","state":"Por implementar","evidence":"Diagrama de ambientes y reglas de acceso","source":"E.08"},{"control":16,"id":"16.9","name":"Capacitación de desarrolladores en seguridad","ig":"IG2","measure":"Capacitación anual en código seguro para todo el personal de desarrollo (14.9).","state":"Por implementar","evidence":"Registro anual de capacitación","source":"E.08"},{"control":16,"id":"16.10","name":"Principios de diseño seguro","ig":"IG2","measure":"Diseño seguro de la banca en línea y la app: mínimo privilegio, validación de toda entrada y sin puertos, servicios ni cuentas predeterminadas innecesarios.","state":"Por implementar","evidence":"Revisión de diseño de cada cambio mayor","source":"E.08"},{"control":16,"id":"16.11","name":"Módulos o servicios verificados para componentes de seguridad","ig":"IG2","measure":"Módulos verificados para las funciones de seguridad: el segundo factor de la app (6.3, control 6), cifrado con algoritmos estándar y registros de auditoría de la plataforma.","state":"Por implementar","evidence":"Registro de componentes de seguridad usados","source":"E.08"},{"control":16,"id":"16.12","name":"Verificaciones de seguridad a nivel de código","ig":"IG3","measure":"Análisis estático y dinámico del código de la banca en línea y la app antes de cada publicación.\nDependencia: el proceso de desarrollo seguro (16.1) y la escala de severidad (16.6), que fijan el umbral de publicación.","state":"Al roadmap","evidence":"Informe de análisis por publicación","source":"E.08"},{"control":16,"id":"16.13","name":"Pruebas de penetración de aplicaciones","ig":"IG3","measure":"Prueba de penetración autenticada de la banca en línea y la app, centrada en la lógica de negocio y en la toma de cuentas.\nDependencia: el programa de pruebas de penetración (18.1) con su firma contratada (18.2).","state":"Al roadmap","evidence":"Informe de la prueba y hallazgos","source":"E.08"},{"control":16,"id":"16.14","name":"Modelado de amenazas","ig":"IG3","measure":"Modelado de amenazas de los cambios de diseño de la banca en línea, la app y sus interfaces con el core, por personal capacitado.\nDependencia: el proceso de 16.1 y la capacitación de 16.9.","state":"Al roadmap","evidence":"Modelos de amenazas aprobados","source":"E.08"},{"control":17,"id":"17.1","name":"Personal designado para gestionar incidentes","ig":"IG1","measure":"El oficial de seguridad de la información gestiona los incidentes, con un suplente de TI de Operaciones y Tecnología; revisión anual (fila 5 de E.06).","state":"Por implementar","evidence":"Designación firmada y revisión anual","source":"E.08"},{"control":17,"id":"17.2","name":"Información de contacto para reportar","ig":"IG1","measure":"Contactos verificados cada año: Superintendencia del Sistema Financiero, Agencia de Ciberseguridad del Estado, FGR, UIF, BCR, procesador de tarjetas, proveedor de la MPLS, Microsoft e IBM (REQ-01; OBJ-05).","state":"Por implementar","evidence":"Lista de contactos con fecha de verificación","source":"E.08"},{"control":17,"id":"17.3","name":"Proceso empresarial de reporte","ig":"IG1","measure":"Proceso publicado para que todo el personal reporte un incidente: plazo inmediato, a quién, por qué medio y con qué datos mínimos; revisión anual (OBJ-05).","state":"Por implementar","evidence":"Proceso publicado y reportes recibidos","source":"E.08"},{"control":17,"id":"17.4","name":"Proceso de respuesta a incidentes","ig":"IG2","measure":"Proceso de respuesta a incidentes con roles, obligaciones (reporte a la SSF, notificación en 72 horas de la LPDP, PCI DSS) y plan de comunicación; revisión anual (REQ-01; OBJ-05).","state":"Por implementar","evidence":"Proceso aprobado y registro de vulneraciones con la hora de conocimiento y de cada notificación","source":"E.08"},{"control":17,"id":"17.5","name":"Roles y responsabilidades clave","ig":"IG2","measure":"Roles clave asignados con las filas 5 y 6 de E.06: el oficial de seguridad coordina; Operaciones y Tecnología responde por TI y por las instalaciones del centro de datos (A-08); la Gerencia Legal, Recursos Humanos y las dos bancas, por su parte; la Presidencia, por la comunicación externa; los proveedores críticos, por contrato (control 15); revisión anual.","state":"Por implementar","evidence":"Matriz de roles revisada cada año","source":"E.08"},{"control":17,"id":"17.6","name":"Mecanismos de comunicación durante la respuesta","ig":"IG2","measure":"Medio primario y medio secundario para comunicarse durante un incidente: teléfono y mensajería fuera de Microsoft 365, porque el correo (S-18) puede estar comprometido; revisión anual.","state":"Por implementar","evidence":"Plan de comunicación con medios alternos","source":"E.08"},{"control":17,"id":"17.7","name":"Ejercicios periódicos","ig":"IG2","measure":"Ejercicio anual con escenarios de BUNICA (cifrado del core, toma de cuentas y exposición de datos con notificación en 72 horas) y simulacro de los procedimientos alternos del core y de la compensación junto con la prueba de OBJ-01 (BR-08); los primeros, al 30-jun-2027 (OBJ-05).","state":"Por implementar","evidence":"Acta anual del ejercicio","source":"E.08"},{"control":17,"id":"17.8","name":"Revisiones posincidente","ig":"IG2","measure":"Revisión posterior a cada incidente, con lecciones aprendidas y acciones de seguimiento, como los de 2023 a 2026 que registra la ficha.","state":"Por implementar","evidence":"Informe posincidente con acciones","source":"E.08"},{"control":17,"id":"17.9","name":"Umbrales de incidente","ig":"IG3","measure":"Umbrales que distinguen evento de incidente (actividad anormal, vulneración de datos personales, interrupción que se reporta a la SSF), alineados con la clasificación de alertas del control 13; revisión anual.","state":"Por implementar","evidence":"Umbrales aprobados y revisados","source":"E.08"},{"control":18,"id":"18.1","name":"Programa de pruebas de penetración","ig":"IG2","measure":"Programa de pruebas de penetración con la metodología que exige PCI DSS v4.0.1 (11.4.1; REQ-05): alcance (perímetro del entorno de tarjetas, red, banca en línea, app, interfaces con el BCR y con el procesador, controles de segmentación), frecuencia anual y tras cada cambio significativo, horario fuera del cierre diario y de las ventanas del BCR, contactos y circuito de remediación (fila 34 de E.06).","state":"Por implementar","evidence":"Programa aprobado","source":"E.08"},{"control":18,"id":"18.2","name":"Pruebas de penetración externas periódicas","ig":"IG2","measure":"Prueba externa anual y tras cada cambio significativo (PCI DSS v4.0.1, 11.4.3; REQ-05), por una firma calificada e independiente, con reconocimiento previo; como no hay contrato firmado, la medida es el contrato con alcance, horario, confidencialidad e informe (control 15).","state":"Por implementar","evidence":"Contrato firmado e informe anual","source":"E.08"},{"control":18,"id":"18.3","name":"Remediación de hallazgos de pruebas","ig":"IG2","measure":"Remediación de los hallazgos según el proceso de 7.2, con plazo y esfuerzo por su impacto, y nueva prueba que confirme cada corrección (PCI DSS v4.0.1, 11.4.4; REQ-05).","state":"Por implementar","evidence":"Seguimiento de hallazgos hasta su cierre","source":"E.08"},{"control":18,"id":"18.4","name":"Validación de medidas de seguridad","ig":"IG3","measure":"Validación después de cada prueba: se ajustan las reglas del SIEM y de los cortafuegos para detectar las técnicas usadas.\nDependencia: el SIEM operando (OBJ-03, 31-dic-2027) y la primera prueba hecha (18.2).","state":"Al roadmap","evidence":"Reglas ajustadas tras cada prueba","source":"E.08"},{"control":18,"id":"18.5","name":"Pruebas de penetración internas periódicas","ig":"IG3","measure":"Prueba interna anual y tras cada cambio significativo (PCI DSS v4.0.1, 11.4.2), que incluye los controles que hoy aíslan el entorno de tarjetas (11.4.5; REQ-05) y se amplía a los segmentos nuevos cuando cierre OBJ-04 (control 12).","state":"Por implementar","evidence":"Informe anual de la prueba interna","source":"E.08"}],"indicators":[{"id":"IND-01","name":"Sistemas del core y de la compensación en segmentos con reglas aprobadas (OBJ-04)","purpose":"Mide si la segmentación separa de la red de sucursales los sistemas de P-01 y P-03, que es lo que promete el control 12.","formula":"Sistemas de P-01 y P-03 en segmentos con reglas de filtrado aprobadas ÷ sistemas de P-01 y P-03 × 100.\nDenominador: los sistemas de esos dos procesos en el inventario de E.04 y en el diagrama de zonas. Numerador: los que están en una zona del diagrama aprobado y solo reciben tráfico de la red de sucursales a través de los cortafuegos internos, con reglas aprobadas por el oficial de seguridad (declaraciones 1 y 2), comprobado con la prueba de aislamiento del paso 3.","metaDetail":"Meta: 100 % al 31 de diciembre de 2027 (OBJ-04) y en cada trimestre posterior.\nUmbral de alerta: desde el 31 de diciembre de 2027, cualquier valor por debajo del 100 %. Sin tolerancia: R-01 es Crítico y su residual esperado (P 4 → 2, E.05) supone que el malware de una estación ya no llega al core; la política no admite excepciones para el tráfico hacia el core.\nAntes de esa fecha, el reporte trimestral informa el avance frente a la iniciativa de E.10.\nLínea base: la ficha registra la red interna plana entre sucursales y centro de datos, salvo el entorno de tarjetas.","frequencyDetail":"Trimestral desde abril de 2027 (primera revisión del procedimiento).","evidence":"Reporte trimestral de la revisión de la segmentación, firmado por el oficial, con el registro de la prueba de aislamiento (F.3 del control 12 de E.07, pasos 3 y 9).","responsibility":"Mide: Operaciones y Tecnología, R de la fila 22 de E.06 («Segmentar la red entre las sucursales y el centro de datos y aprobar las reglas de filtrado entre segmentos»); lo calcula el administrador de red, que ejecuta el procedimiento.\nRecibe: el oficial de seguridad de la información, A de la fila 22, que lo presenta en la revisión trimestral de la Presidencia (E.02).","control":"12","goal":"100 % al 31 de diciembre de 2027 (OBJ-04) y en cada trimestre posterior","alert":"Desde el 31 de diciembre de 2027, cualquier valor por debajo del 100 %","frequency":"Trimestral","relation":"R-01 y R-03; OBJ-04"},{"id":"IND-02","name":"Enlaces críticos con medio alterno probado","purpose":"Mide si cada enlace crítico de los procesos del alcance tiene un medio alterno o un servicio de mitigación que funciona.","formula":"Enlaces críticos con medio alterno o mitigación probados en los últimos 12 meses ÷ enlaces críticos (red MPLS de sucursales y cajeros, conexión con el BCR y salida a internet de los canales) × 100.\nUn enlace cuenta en el numerador si la prueba del paso 8 se completó sin interrumpir la operación y con el tiempo de conmutación medido (declaración 8).","metaDetail":"Meta: 100 % (los tres enlaces) desde el cierre de la iniciativa de E.10 que implanta los medios alternos, y en cada prueba anual.\nUmbral de alerta: un enlace sin prueba vigente o con la prueba fallida. Sin tolerancia porque el universo es de tres enlaces: un porcentaje con margen no tendría sentido. R-08 y R-10 son Altos y R-12 Medio; su residual esperado supone que el alterno o la mitigación existen (E.05, D.5-ter), y la política exige además probarlos cada año (declaración 8).\nLa política lo exige desde que cierra esa iniciativa (vigencia de las políticas, E.07); hasta entonces, el oficial informa el avance en la revisión trimestral.\nLínea base: la ficha no registra enlace de respaldo de la red MPLS, un segundo medio de conexión con el BCR ni protección contra la denegación de servicio en la salida a internet de los canales (SPOF-02, SPOF-05; R-10).","frequencyDetail":"Por evento (cada prueba de los enlaces: al menos una vez al año y después de cambiar un enlace).","evidence":"Acta anual de la prueba de los enlaces (F.3 del control 12 de E.07, paso 8).","responsibility":"Mide: Operaciones y Tecnología, R de la fila 25 de E.06 («Asegurar la disponibilidad de la red: enlace de respaldo, segundo medio de conexión con el BCR y mitigación de la denegación de servicio»); lo calcula el administrador de red, que ejecuta el procedimiento.\nRecibe: el oficial de seguridad de la información, A de la fila 25, que lo presenta en la revisión trimestral de la Presidencia (E.02).","control":"12","goal":"100 % (los tres enlaces) desde el cierre de la iniciativa de E.10 que implanta los medios alternos, y en cada prueba anual","alert":"Un enlace sin prueba vigente o con la prueba fallida","frequency":"Por evento","relation":"R-08, R-10 y R-12"},{"id":"IND-03","name":"Proveedores críticos con contrato conforme","purpose":"Mide si los contratos de los proveedores críticos traen las cláusulas de seguridad que exige la política.","formula":"Proveedores críticos cuyo contrato tiene todas las cláusulas de la política ÷ proveedores críticos × 100.\nProveedores críticos: los de la declaración 2 (el procesador de tarjetas, el proveedor de la red MPLS, IBM y Microsoft) y los que el inventario clasifique como tales. Un contrato cuenta si la Gerencia Legal verificó todas las cláusulas de la declaración 3.","metaDetail":"Meta: 100 % desde el 4 de enero de 2028, cuando vence el plazo máximo de 12 meses que la excepción del control 15 da a los contratos vigentes.\nUmbral de alerta: un proveedor crítico sin las cláusulas cuyo contrato se firmó o renovó desde el 4 de enero de 2027, o cualquiera sin ellas desde el 4 de enero de 2028. Sin tolerancia porque el universo es pequeño (los cuatro de la declaración 2 y los que agregue el inventario). El residual esperado de R-07 (P 3 → 2) depende de las cláusulas del contrato del procesador (15.4, E.05).\nDurante 2027, el reporte sigue el calendario de renovaciones (AC-04).\nLínea base: la ficha no registra contratos ni niveles de servicio con el procesador de tarjetas, el proveedor de la red MPLS ni el fabricante del core (BR-07).","frequencyDetail":"Trimestral.","evidence":"Lista de cláusulas verificada por la Gerencia Legal en cada contrato e inventario de proveedores (F.3 del control 15 de E.07, pasos 1, 3 y 8).","responsibility":"Mide: Operaciones y Tecnología, R de la fila 26 de E.06 («Gestionar los proveedores de servicios: inventario, requisitos y nivel de servicio en los contratos, evaluación y monitoreo»); lo calcula el administrador de contratos de tecnología, que ejecuta el procedimiento con Finanzas para el procesador de tarjetas.\nRecibe: el oficial de seguridad de la información, A de la fila 26, que lo presenta en la revisión trimestral de la Presidencia (E.02).","control":"15","goal":"100 % desde el 4 de enero de 2028, cuando vence el plazo máximo de 12 meses que la excepción del control 15 da a los contratos vigentes","alert":"Un proveedor crítico sin las cláusulas cuyo contrato se firmó o renovó desde el 4 de enero de 2027, o cualquiera sin ellas desde el 4 de enero de 2028","frequency":"Trimestral","relation":"R-07, R-10, R-11 y R-12"},{"id":"IND-04","name":"Proveedores críticos evaluados en los últimos 12 meses","purpose":"Mide si BUNICA verifica cada año la seguridad de sus proveedores críticos, en lugar de confiar en el contrato.","formula":"Proveedores críticos con evaluación vigente (AoC, SOC 2 o cuestionario) ÷ proveedores críticos × 100.\nEvaluación vigente: la AoC de PCI DSS del procesador, el informe SOC 2 de los servicios en la nube o el cuestionario de seguridad de BUNICA, con menos de 12 meses y sin un hallazgo grave abierto sin plan de corrección (declaración 4; paso 4).","metaDetail":"Meta: 100 % desde el 4 de enero de 2028, 12 meses después de la vigencia de la política (declaración 4: al menos una vez al año), y en cada trimestre posterior.\nUmbral de alerta: desde esa fecha, un proveedor crítico sin evaluación vigente; en cualquier momento, un proveedor crítico contratado sin evaluación previa. Sin tolerancia por el tamaño del universo, igual que IND-03. El residual esperado de R-07 incluye la evaluación y el monitoreo del proveedor (15.5 y 15.6, E.05).\nLínea base: la ficha no registra evaluaciones de proveedores.","frequencyDetail":"Trimestral.","evidence":"Informes de evaluación (AoC, SOC 2 o cuestionario) y reporte de proveedores (F.3 del control 15 de E.07, pasos 4 y 8).","responsibility":"Mide: Operaciones y Tecnología, R de la fila 26 de E.06 («Gestionar los proveedores de servicios: inventario, requisitos y nivel de servicio en los contratos, evaluación y monitoreo»); lo calcula el administrador de contratos de tecnología, que ejecuta el procedimiento.\nRecibe: el oficial de seguridad de la información, A de la fila 26, que lo presenta en la revisión trimestral de la Presidencia (E.02).","control":"15","goal":"100 % desde el 4 de enero de 2028, 12 meses después de la vigencia de la política (declaración 4: al menos una vez al año), y en cada trimestre posterior","alert":"Desde esa fecha, un proveedor crítico sin evaluación vigente; en cualquier momento, un proveedor crítico contratado sin evaluación previa","frequency":"Trimestral","relation":"R-07 y R-11"},{"id":"IND-05","name":"Fuentes de registros integradas al SIEM (OBJ-03)","purpose":"Mide qué parte de los sistemas del core y de los canales ve el SIEM: lo que no envía registros no se puede detectar.","formula":"Fuentes de A-02, A-06, A-07, A-09, A-18 y A-23 integradas al SIEM ÷ fuentes de esos activos × 100.\nDenominador: las fuentes de esos activos en el inventario de E.04. Una fuente sin conector o sin eventos en el mes cuenta como no integrada (paso 7), aunque tenga excepción vigente.","metaDetail":"Meta: 100 % al 31 de diciembre de 2027 (OBJ-03) y en cada mes posterior.\nUmbral de alerta: desde esa fecha, menos del 95 %, o una fuente crítica (core, directorio o cortafuegos) sin integrar y sin excepción vigente. Margen: cubre las fuentes que todavía no pueden integrarse y están en la excepción de 90 días del control 13, con revisión manual semanal. Una fuente crítica solo puede quedar fuera con esa excepción firmada; sin ella, la alerta es inmediata. R-03 es Alto y su residual esperado (8) queda por debajo del límite del apetito (E.05).\nAntes de esa fecha, el reporte mensual informa el avance frente a la iniciativa de E.10.\nLínea base: la ficha registra que no hay SIEM ni monitoreo centralizado (BR-05).","frequencyDetail":"Mensual.","evidence":"Reporte mensual de cobertura de fuentes (F.3 del control 13 de E.07, pasos 7 y 8).","responsibility":"Mide: Operaciones y Tecnología, R de la fila 23 de E.06 («Centralizar en el SIEM los registros de auditoría y las alertas de seguridad, y revisarlos cada semana»); lo calcula el analista de alertas, que ejecuta el procedimiento.\nRecibe: el oficial de seguridad de la información, A de la fila 23, que lo presenta en la revisión trimestral de la Presidencia (E.02).","control":"13","goal":"100 % al 31 de diciembre de 2027 (OBJ-03) y en cada mes posterior","alert":"Desde esa fecha, menos del 95 %, o una fuente crítica (core, directorio o cortafuegos) sin integrar y sin excepción vigente","frequency":"Mensual","relation":"R-03; OBJ-03"},{"id":"IND-06","name":"Alertas de severidad alta atendidas a tiempo","purpose":"Mide si la detección llega a tiempo: una alerta que nadie atiende no detiene el movimiento lateral ni la extracción.","formula":"Alertas altas atendidas dentro de 4 horas ÷ alertas altas del mes × 100.\nAtendida: clasificada por la guardia como falso positivo, evento sin impacto o incidente (pasos 1 y 2), con la hora de creación y la de atención de cada caso en Microsoft Sentinel, el SIEM de S-15 (declaración 3: toda alerta de severidad alta se atiende dentro de 4 horas, todos los días).","metaDetail":"Meta: 100 % desde que el SIEM recibe las fuentes (iniciativa de E.10; OBJ-03 al 31 de diciembre de 2027).\nUmbral de alerta: desde entonces, menos del 95 % en el mes. Margen: cada alerta alta que pasa las 4 horas ya se escala, una por una, al Director de Operaciones y Tecnología (escalamiento del procedimiento); el umbral señala un problema del turno de guardia o de las reglas, no un caso aislado. R-03 es Alto, con residual esperado 8 (E.05).\nLínea base: sin SIEM no hay alertas centralizadas; la campaña de phishing de 2024 duró tres semanas (ficha).","frequencyDetail":"Mensual.","evidence":"Casos y bitácora de alertas de Microsoft Sentinel (F.3 del control 13 de E.07, pasos 1, 2 y 8).","responsibility":"Mide: Operaciones y Tecnología, R de la fila 23 de E.06 («Centralizar en el SIEM los registros de auditoría y las alertas de seguridad, y revisarlos cada semana»); lo calcula el analista de alertas, que ejecuta el procedimiento.\nRecibe: el oficial de seguridad de la información, A de la fila 23, que lo presenta en la revisión trimestral de la Presidencia (E.02).","control":"13","goal":"100 % desde que el SIEM recibe las fuentes (iniciativa de E.10; OBJ-03 al 31 de diciembre de 2027)","alert":"Desde entonces, menos del 95 % en el mes","frequency":"Mensual","relation":"R-03"},{"id":"IND-07","name":"Cuentas de administración con segundo factor resistente al phishing","purpose":"Mide si el robo de una contraseña de administrador sigue bastando para tomar el directorio, Azure, Microsoft 365 o el core.","formula":"Cuentas de administración con llave FIDO2 exigida ÷ cuentas de administración × 100.\nCuenta en el numerador la que la plataforma solo deja usar con la llave o, donde la plataforma no la admite (el inventario de sistemas de autenticación, 6.6, lo registra), la que solo se usa desde una estación de la zona de administración cuyo inicio de sesión la exige (declaración 3; 12.8). Los inicios de sesión administrativos sin segundo factor tienen que ser cero (paso 5).","metaDetail":"Meta: 100 % a más tardar el 30 de junio de 2027 (corto plazo: 6.5 es IG1 y es el tratamiento de R-02; BIA_P07, recomendación 1) y en cada mes posterior.\nUmbral de alerta: desde el 30 de junio de 2027, cualquier valor por debajo del 100 %. Sin tolerancia: R-02 es Crítico y su residual esperado (P 4 → 1, E.05) supone que el robo de la credencial deja de bastar; la política no admite excepciones en las cuentas del directorio, de Azure y de Microsoft 365.\nLínea base: 0 %: la ficha registra segundo factor para la banca en línea de clientes y no para los administradores (BR-03).","frequencyDetail":"Mensual.","evidence":"Registros de inicio de sesión de Entra ID y de los controladores de dominio y registro de enrolamiento de llaves, con el inventario de cuentas del control 5 como denominador (F.3 del control 6 de E.07, pasos 4, 5 y 8).","responsibility":"Mide: Operaciones y Tecnología, R de la fila 20 de E.06 («Exigir un segundo factor resistente al phishing en todo acceso administrativo»); lo calcula el administrador de identidades, que ejecuta el procedimiento.\nRecibe: el oficial de seguridad de la información, A de la fila 20, que lo presenta en la revisión trimestral de la Presidencia (E.02).","control":"6","goal":"100 % a más tardar el 30 de junio de 2027 (corto plazo: 6.5 es IG1 y es el tratamiento de R-02; BIA_P07, recomendación 1) y en cada mes posterior","alert":"Desde el 30 de junio de 2027, cualquier valor por debajo del 100 %","frequency":"Mensual","relation":"R-02"},{"id":"IND-08","name":"Usuarios activos de la app con segundo factor","purpose":"Mide si la contraseña robada de un cliente todavía basta para operar desde la app.","formula":"Usuarios activos de la app con dispositivo vinculado ÷ usuarios activos de la app × 100.\nUsuario activo: el que inició sesión en el mes. Dispositivo vinculado: el confirmado con segundo factor (declaración 4), que también se exige al registrar un destinatario nuevo (paso 6).","metaDetail":"Meta: 100 % desde que el segundo factor es obligatorio en la app (cierre de su iniciativa en E.10).\nUmbral de alerta: desde esa fecha, cualquier valor por debajo del 100 %. Sin tolerancia: un usuario activo sin dispositivo vinculado significa que la app dejó operar sin el segundo factor, y el residual esperado de R-05 (9) ya está en el límite del apetito (Medio, de 5 a 9; E.05).\nAntes de esa fecha, el reporte mensual informa el avance de la vinculación.\nLínea base: la ficha registra segundo factor para la banca en línea de clientes y no lo registra para la app.","frequencyDetail":"Mensual.","evidence":"Reporte mensual de la plataforma de la app (F.3 del control 6 de E.07, pasos 6 y 8).","responsibility":"Mide: Operaciones y Tecnología, R de la fila 21 de E.06 («Implantar el segundo factor en la app y al registrar destinatarios nuevos»); lo calcula el administrador de identidades, que ejecuta el procedimiento.\nRecibe: el oficial de seguridad de la información, A de la fila 21, que lo presenta en la revisión trimestral de la Presidencia (E.02).","control":"6","goal":"100 % desde que el segundo factor es obligatorio en la app (cierre de su iniciativa en E.10)","alert":"Desde esa fecha, cualquier valor por debajo del 100 %","frequency":"Mensual","relation":"R-05"},{"id":"IND-09","name":"Tiempo real de recuperación del core frente al RTO (OBJ-01)","purpose":"Mide si BUNICA recupera de verdad el core dentro del RTO que fijó el BIA.","formula":"Horas desde la declaración hasta el core operativo en la prueba completa, frente al RTO de 8 h.\nConteo en horas en la prueba anual del paso 5, que solo cuenta como completa si el core queda operativo en el sitio de contingencia y se ejecutan los dos procedimientos alternos. El acta informa además los datos perdidos frente al RPO de 15 minutos (paso 6).","metaDetail":"Meta: 8 horas o menos (RTO de P-01, E.03; S-07) en la primera prueba completa, a más tardar el 30 de junio de 2027 (OBJ-01), y en cada prueba anual.\nUmbral de alerta: más de 8 horas. Sin tolerancia: R-01 es Crítico y su residual esperado (I 5 → 4, E.05) supone la recuperación probada; el procedimiento ya ordena un plan de corrección en 30 días y una nueva prueba. El RPO de 15 minutos sigue abierto (BR-02, AC-01).\nLínea base: 11 horas en la última prueba de recuperación, parcial y solo del core (ficha).","frequencyDetail":"Por evento (cada prueba completa de recuperación, al menos una vez al año).","evidence":"Acta anual de recuperación (F.3 del control 11 de E.07, pasos 5, 6 y 8).","responsibility":"Mide: Operaciones y Tecnología, R de la fila 24 de E.06 («Probar cada trimestre la restauración de una muestra y cada año la recuperación completa del core en el sitio de contingencia, y simular los procedimientos alternos»); lo calcula el administrador de respaldos, que ejecuta el procedimiento; Finanzas, también R de la fila, ejecuta el procedimiento alterno de la compensación.\nRecibe: el oficial de seguridad de la información, A de la fila 24, que lo presenta en la revisión trimestral de la Presidencia (E.02).","control":"11","goal":"8 horas o menos (RTO de P-01, E.03; S-07) en la primera prueba completa, a más tardar el 30 de junio de 2027 (OBJ-01), y en cada prueba anual","alert":"Más de 8 horas","frequency":"Por evento","relation":"R-01 y R-06; OBJ-01"},{"id":"IND-10","name":"Restauraciones de muestra exitosas","purpose":"Mide si las copias sirven para restaurar los datos, no solo si se hicieron.","formula":"Restauraciones trimestrales confirmadas por el dueño ÷ restauraciones programadas × 100.\nUna restauración es exitosa si el dueño confirma la integridad de los datos; la muestra rota entre el core, la base de canales, el directorio y Microsoft 365 (paso 4). 11.5 (p. 56) pide probar cada trimestre una muestra de los activos del alcance.","metaDetail":"Meta: 100 % en cada trimestre desde el cierre de su iniciativa en E.10, a más tardar el segundo trimestre de 2027 (abril a junio), el de la primera prueba completa de OBJ-01.\nUmbral de alerta: desde entonces, cualquier valor por debajo del 100 %. Sin tolerancia: R-01 es Crítico y la política no admite excepciones a la prueba trimestral.\nLínea base: la ficha registra pruebas parciales y poco frecuentes («Controles que ya existen»).","frequencyDetail":"Trimestral.","evidence":"Actas trimestrales de restauración (F.3 del control 11 de E.07, paso 4).","responsibility":"Mide: Operaciones y Tecnología, R de la fila 24 de E.06 («Probar cada trimestre la restauración de una muestra y cada año la recuperación completa del core en el sitio de contingencia, y simular los procedimientos alternos»); lo calcula el administrador de respaldos, que ejecuta el procedimiento.\nRecibe: el oficial de seguridad de la información, A de la fila 24, que lo presenta en la revisión trimestral de la Presidencia (E.02).","control":"11","goal":"100 % en cada trimestre desde el cierre de su iniciativa en E.10, a más tardar el segundo trimestre de 2027 (abril a junio), el de la primera prueba completa de OBJ-01","alert":"Desde entonces, cualquier valor por debajo del 100 %","frequency":"Trimestral","relation":"R-01"},{"id":"IND-11","name":"Cuentas activas validadas por sus dueños","purpose":"Mide si cada cuenta que puede entrar a los sistemas tiene detrás una persona o un servicio autorizados.","formula":"Cuentas activas validadas en la revisión trimestral ÷ cuentas activas × 100.\nSe mide al vencer los 10 días hábiles que el paso 5 da a los dueños, antes de deshabilitar: denominador, las cuentas activas del inventario consolidado enviadas a validar, incluidas las de servicio; numerador, las que su dueño confirmó. Las que se deshabilitan por falta de confirmación cuentan como no validadas.","metaDetail":"Meta: 100 % en cada revisión trimestral, desde que el inventario de cuentas está completo (iniciativa de E.10 en el corto plazo: 5.1 y 5.3 son IG1).\nUmbral de alerta: desde entonces, menos del 95 %. Margen: las cuentas que el dueño no confirma ya se deshabilitan solas (paso 5), así que una proporción pequeña no deja accesos abiertos; más del 5 % sin confirmar indica que los dueños no están revisando. No es el tratamiento de un riesgo de E.05: el de R-02 lo miden IND-07 e IND-12.\nLínea base: la ficha no registra un inventario de cuentas.","frequencyDetail":"Trimestral.","evidence":"Actas de validación trimestral e inventario de cuentas (F.3 del control 5 de E.07, pasos 5, 7 y 8).","responsibility":"Mide: Operaciones y Tecnología, R de la fila 3 de E.06 («Administrar las cuentas y los accesos: altas, cambios, bajas y revisión de privilegios»); lo calcula el administrador de identidades, que ejecuta el procedimiento con los dueños de la información.\nRecibe: el oficial de seguridad de la información, A de la fila 3, que lo presenta en la revisión trimestral de la Presidencia (E.02).","control":"5","goal":"100 % en cada revisión trimestral, desde que el inventario de cuentas está completo (iniciativa de E.10 en el corto plazo: 5.1 y 5.3 son IG1)","alert":"Desde entonces, menos del 95 %","frequency":"Trimestral","relation":"Control 5 (5.1 y 5.3); no es el tratamiento de un riesgo de E.05"},{"id":"IND-12","name":"Administradores con cuenta de administración separada","purpose":"Mide si un correo o una página web maliciosos pueden alcanzar una cuenta con privilegios.","formula":"Administradores con cuenta dedicada sin buzón ni navegación ÷ administradores × 100.\nCuenta en el numerador el administrador cuyos privilegios solo están en una cuenta de administración dedicada, sin buzón de correo y usada solo en la zona de administración (declaración 5; paso 4).","metaDetail":"Meta: 100 % a más tardar el 30 de junio de 2027 (corto plazo: 5.4 es IG1 y es, con 6.5, el tratamiento de R-02; BIA_P07, recomendación 1) y en cada mes posterior.\nUmbral de alerta: desde el 30 de junio de 2027, cualquier valor por debajo del 100 %. Sin tolerancia: R-02 es Crítico y la política no admite excepciones a la separación de cuentas de los administradores del directorio, de Azure y de Microsoft 365.\nLínea base: la ficha no registra cuentas de administración separadas.","frequencyDetail":"Mensual.","evidence":"Inventario de cuentas, versión de la depuración mensual (F.3 del control 5 de E.07, paso 4).","responsibility":"Mide: Operaciones y Tecnología, R de la fila 20 de E.06 («Exigir un segundo factor resistente al phishing en todo acceso administrativo»); lo calcula el administrador de identidades, que ejecuta el procedimiento.\nRecibe: el oficial de seguridad de la información, A de la fila 20, que lo presenta en la revisión trimestral de la Presidencia (E.02).","control":"5","goal":"100 % a más tardar el 30 de junio de 2027 (corto plazo: 5.4 es IG1 y es, con 6.5, el tratamiento de R-02; BIA_P07, recomendación 1) y en cada mes posterior","alert":"Desde el 30 de junio de 2027, cualquier valor por debajo del 100 %","frequency":"Mensual","relation":"R-02"},{"id":"IND-13","name":"Activos escaneados dentro de su ciclo (OBJ-02)","purpose":"Mide qué parte de los activos se revisa en busca de vulnerabilidades con la frecuencia que exige OBJ-02.","formula":"(Activos expuestos a internet escaneados en cada mes del trimestre + activos internos escaneados en el trimestre) ÷ (activos expuestos + activos internos que cubre el proceso de 7.1) × 100.\nCiclo: mensual para lo expuesto a internet (7.6, p. 42) y trimestral para lo interno (7.5, p. 42), con los activos de E.04 y el escáner Nessus Expert de S-16. Un activo expuesto cuenta en el numerador solo si se escaneó los tres meses. Se mide cada trimestre porque el informe interno es trimestral.","metaDetail":"Meta: 100 % en el trimestre que termina el 30 de junio de 2027 (OBJ-02) y en cada trimestre posterior.\nUmbral de alerta: desde esa fecha, menos del 95 %, o un activo de la banca en línea o de la app expuesto a internet que no se escaneó en alguno de los meses del trimestre. Margen: cubre equipos internos apagados en su ventana de escaneo, que se escanean en la siguiente; lo expuesto no tiene margen porque es la entrada de R-04, Alto, con residual esperado 8 (E.05).\nLínea base: la ficha registra que no hay programa formal de gestión de vulnerabilidades (BR-06).","frequencyDetail":"Trimestral.","evidence":"Informe mensual de escaneo externo e informe trimestral de escaneo interno (evidencia de 7.6 y 7.5 en E.08).","responsibility":"Mide: Operaciones y Tecnología, R de la fila 2 de E.06 («Gestionar las vulnerabilidades y los parches, con escaneo y remediación en ciclos»).\nRecibe: el oficial de seguridad de la información, A de la fila 2, que lo presenta en la revisión trimestral de la Presidencia (E.02).","control":"7 (E.08)","goal":"100 % en el trimestre que termina el 30 de junio de 2027 (OBJ-02) y en cada trimestre posterior","alert":"Desde esa fecha, menos del 95 %, o un activo de la banca en línea o de la app expuesto a internet que no se escaneó en alguno de los meses del trimestre","frequency":"Trimestral","relation":"R-04; OBJ-02"},{"id":"IND-14","name":"Vulnerabilidades remediadas dentro de su plazo (OBJ-02)","purpose":"Mide si lo que el escaneo encuentra se corrige dentro del plazo que fija la estrategia de remediación.","formula":"Vulnerabilidades corregidas dentro del plazo de su severidad y verificadas con un nuevo escaneo ÷ vulnerabilidades cuyo plazo venció en el mes × 100.\nPlazo: el que la estrategia de remediación de 7.2 fija para cada severidad que asigna el escáner; para las críticas y altas, el ciclo mensual de OBJ-02. Las que quedan con excepción firmada no cuentan como remediadas; el acta mensual las informa aparte (7.7).","metaDetail":"Meta: 100 % al 30 de junio de 2027 (OBJ-02) y en cada ciclo posterior.\nUmbral de alerta: desde esa fecha, menos del 95 %, o una vulnerabilidad crítica de un activo expuesto a internet sin corregir ni excepción firmada al vencer su plazo. Margen: cubre las correcciones que el fabricante todavía no publica, que quedan con excepción firmada y medida compensatoria (7.7). R-04 es Alto, con residual esperado 8 (E.05).\nLínea base: los parches se aplican cuando el proveedor lo pide (ficha; BR-06).","frequencyDetail":"Mensual.","evidence":"Acta mensual de revisión de la remediación y porcentaje de vulnerabilidades remediadas en el ciclo (evidencia de 7.2 y 7.7 en E.08).","responsibility":"Mide: Operaciones y Tecnología, R de la fila 2 de E.06 («Gestionar las vulnerabilidades y los parches, con escaneo y remediación en ciclos»).\nRecibe: el oficial de seguridad de la información, A de la fila 2, que lo presenta en la revisión trimestral de la Presidencia (E.02).","control":"7 (E.08)","goal":"100 % al 30 de junio de 2027 (OBJ-02) y en cada ciclo posterior","alert":"Desde esa fecha, menos del 95 %, o una vulnerabilidad crítica de un activo expuesto a internet sin corregir ni excepción firmada al vencer su plazo","frequency":"Mensual","relation":"R-04; OBJ-02"},{"id":"IND-15","name":"Vulneraciones de datos personales notificadas en 72 horas (OBJ-05)","purpose":"Mide si BUNICA cumple la notificación que exige la LPDP cuando de verdad ocurre una vulneración.","formula":"Vulneraciones de datos personales notificadas a la Agencia de Ciberseguridad del Estado, a la FGR y a los titulares dentro de las 72 horas desde el conocimiento ÷ vulneraciones de datos personales confirmadas × 100.\nUna vulneración cuenta en el numerador solo si las tres notificaciones salieron dentro del plazo (REQ-01; LPDP, art. 25).","metaDetail":"Meta: 100 % desde el 4 de enero de 2027 (OBJ-05).\nUmbral de alerta: cualquier vulneración notificada fuera de las 72 horas. Sin tolerancia: es una obligación legal (REQ-01). Dentro de cada evento, si a las 48 horas falta alguna de las tres notificaciones, el oficial lo informa a la Presidencia para que el plazo no venza.\nLínea base: la ficha no registra un procedimiento de notificación.","frequencyDetail":"Por evento y consolidado cada trimestre para la revisión de la Presidencia.","evidence":"Registro de vulneraciones con la hora de conocimiento y de cada notificación (evidencia de 17.4 en E.08).","responsibility":"Mide: el oficial de seguridad de la información, R de la fila 6 de E.06 («Notificar en 72 horas las vulneraciones de datos personales a la Agencia de Ciberseguridad del Estado, a la Fiscalía General de la República y a los titulares, y probar el procedimiento cada año»).\nRecibe: la Presidencia, A de la fila 6, que lo trata en su revisión trimestral (E.02).","control":"17 (E.08)","goal":"100 % desde el 4 de enero de 2027 (OBJ-05)","alert":"Cualquier vulneración notificada fuera de las 72 horas","frequency":"Por evento","relation":"R-03, R-04 y R-09; OBJ-05; REQ-01"},{"id":"IND-16","name":"Tiempo de notificación en el ejercicio anual (OBJ-05)","purpose":"Mide si el procedimiento de notificación funciona antes de que haga falta, aunque en el año no haya vulneraciones reales.","formula":"Horas desde el conocimiento simulado hasta la tercera notificación simulada (Agencia, FGR y titulares) en el ejercicio anual, frente a 72 h.\nConteo en horas en el escenario de exposición de datos con notificación en 72 horas que E.08 diseña para el ejercicio anual de 17.7; el CIS pide un ejercicio al año como mínimo (17.7, p. 85).","metaDetail":"Meta: 72 horas o menos en el primer ejercicio, a más tardar el 30 de junio de 2027 (OBJ-05), y en cada ejercicio anual.\nUmbral de alerta: más de 72 horas, o un año sin ejercicio. Sin tolerancia: mide la misma obligación legal que IND-15 (REQ-01).\nLínea base: la ficha no registra ejercicios de respuesta a incidentes.","frequencyDetail":"Por evento (cada ejercicio de respuesta, al menos uno al año).","evidence":"Acta anual del ejercicio (evidencia de 17.7 en E.08).","responsibility":"Mide: el oficial de seguridad de la información, R de la fila 6 de E.06 («Notificar en 72 horas las vulneraciones de datos personales a la Agencia de Ciberseguridad del Estado, a la Fiscalía General de la República y a los titulares, y probar el procedimiento cada año»).\nRecibe: la Presidencia, A de la fila 6, que lo trata en su revisión trimestral (E.02).","control":"17 (E.08)","goal":"72 horas o menos en el primer ejercicio, a más tardar el 30 de junio de 2027 (OBJ-05), y en cada ejercicio anual","alert":"Más de 72 horas, o un año sin ejercicio","frequency":"Por evento","relation":"R-03, R-04 y R-09; OBJ-05; REQ-01"}],"initiatives":[{"id":"INI-01","name":"Inventario de activos y de software con dueño","origin":"Origen: E.08.","safeguards":"E.08, por implementar: 1.1, 1.2, 2.1, 2.3","ig":"IG1 (4)","horizon":"Corto · ene–mar 2027","owner":"Operaciones y Tecnología (R de la fila 30 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Parte de los 24 activos de E.04. Es la base del programa: sin el inventario no hay universo para la configuración segura, el antimalware, el escaneo, los registros ni el diseño de las zonas.","outcome":"Inventario de todo el parque con dueño y autorización de conexión (servidores IBM Power, Windows y RHEL 8, estaciones Windows 11, cajeros, equipos de red y servicios de Azure, Microsoft 365 y Salesforce), que registra la generación del servidor IBM Power y el fabricante de los enrutadores y conmutadores; inventario de software con versión, edición y licencias (Oracle 19c, plan de Microsoft 365, versión de PAN-OS y suscripciones de Palo Alto); equipos no autorizados tratados cada semana (1.2) y software no autorizado retirado cada mes (2.3)."},{"id":"INI-02","name":"Software con soporte del fabricante y extensión de servicio de IBM i 7.4","origin":"Origen: E.08 y E.09 (AC-03).","safeguards":"E.08, por implementar: 2.2","ig":"IG1 (1)","horizon":"Corto · ene–abr 2027","owner":"Operaciones y Tecnología (R de la fila 28 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-01 (versiones de los demás productos).\nSi BUNICA no tiene la extensión del IBM i (la ficha no lo registra), se tramita desde enero, sin esperar el inventario, porque su soporte estándar terminó el 30 de septiembre de 2026 (R-11; AC-03).","outcome":"Extensión de servicio de IBM i 7.4 contratada, que va hasta el 30 de septiembre de 2029, o, mientras no se contrate, la excepción de 2.2 firmada por la Presidencia con sus controles compensatorios (AC-03); fecha de fin de soporte de cada producto registrada y revisada cada mes; estaciones Windows 11 en una versión con soporte (la 23H2 Enterprise lo perdió el 10 de noviembre de 2026) y actualizadas a la siguiente antes de cada fin de servicio (24H2: 12 de octubre de 2027; 25H2: 10 de octubre de 2028; E.08), con la revisión mensual de 2.2."},{"id":"INI-03","name":"Inventario de cuentas y ciclo de altas, cambios y bajas de accesos","origin":"Origen: E.07 (F.1).","safeguards":"E.07, diseñadas ahora: 5.1 a 5.3, 5.5, 6.1, 6.2, 6.6","ig":"IG1 (5) · IG2 (2)","horizon":"Corto · ene–mar 2027","owner":"Operaciones y Tecnología (R de la fila 3 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Ninguna previa: las cuentas se inventarían en cada plataforma.\nSe adelantan: 5.5 (IG2, del mediano) por R-02: las cuentas de servicio con privilegios en el directorio son un camino para tomarlo y la ficha no las registra (E.07, control 5); delimitan la separación de privilegios de 5.4, tratamiento de R-02; 6.6 (IG2, del mediano) por R-02: delimita los sistemas donde se exige el segundo factor de 6.5, tratamiento de R-02 (E.07, control 6).","outcome":"Inventario de las cuentas de usuario, de administración y de servicio de todas las plataformas, validado por sus dueños (5.1, 5.5); contraseñas únicas (5.2); cuentas sin uso durante 45 días deshabilitadas (5.3); altas y bajas con su proceso, con el aviso de Recursos Humanos (6.1, 6.2); inventario de los sistemas de autenticación (6.6). IND-11 se mide desde la primera revisión trimestral, de abril a junio de 2027."},{"id":"INI-04","name":"Segundo factor resistente al phishing, cuentas de administración dedicadas y zona de administración","origin":"Origen: E.07 (F.1) y E.09 (AC-08).","safeguards":"E.07, diseñadas ahora: 5.4, 6.4, 6.5, 12.8","ig":"IG1 (3) · IG3 (1)","horizon":"Corto · feb–jun 2027","owner":"Operaciones y Tecnología (R de la fila 20 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-03 (inventario de cuentas, denominador de IND-07).\nSe adelanta 12.8 (IG3, del largo) por R-02: administrar desde estaciones o sesiones dedicadas sin internet ni correo impide que el phishing contra el personal de TI alcance una sesión administrativa, y es el medio con que el control 6 exige el segundo factor donde la plataforma no admite la llave FIDO2 (AC-08).","outcome":"IND-07 e IND-12 al 100 % al 30 de junio de 2027: toda cuenta de administración del directorio, de Entra ID, de Azure, de Microsoft 365, del IBM i, de Oracle, de los cortafuegos y del portal del sistema de pagos del BCR con llave FIDO2 exigida o, donde la plataforma no la admite, accesible solo desde la zona de administración (12.8; AC-08); ninguna cuenta de administración con buzón ni navegación (5.4); el acceso remoto a la red que exista, con segundo factor (6.4)."},{"id":"INI-05","name":"Segundo factor en la app y al registrar destinatarios nuevos","origin":"Origen: E.07 (F.1).","safeguards":"E.07, diseñadas ahora: 6.3","ig":"IG1 (1)","horizon":"Corto · ene–jun 2027","owner":"Banca de Personas y Operaciones y Tecnología (R de la fila 21 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Ninguna previa: es un desarrollo propio de la app (S-17).","outcome":"Segundo factor obligatorio en la app con dispositivo vinculado y confirmación de cada destinatario nuevo en la app y en la banca en línea; IND-08 al 100 % desde el 30 de junio de 2027."},{"id":"INI-06","name":"Copia aislada del core y recuperación probada en el sitio de contingencia","origin":"Origen: E.07 (F.1) y E.09 (AC-02).","safeguards":"E.07, diseñadas ahora: 11.1 a 11.5","ig":"IG1 (4) · IG2 (1)","horizon":"Corto · ene–jun 2027","owner":"Operaciones y Tecnología (R de las filas 4 y 24 de E.06) y Finanzas (R de la fila 24 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Ninguna previa: el respaldo diario a cinta y el sitio de contingencia ya existen (ficha).\nSe adelanta 11.5 (IG2, del mediano) por OBJ-01 y R-01: OBJ-01 exige la primera prueba completa al 30 de junio de 2027, y la recuperación probada es el tratamiento de R-01 que acota el cifrado del core al MTPD de 24 horas.","outcome":"Proceso de recuperación de los activos del alcance, incluido el directorio (11.1); copia aislada e inmutable semanal del core en cartucho WORM fuera de línea (11.3, 11.4); restauración trimestral de una muestra confirmada por su dueño desde el segundo trimestre de 2027 (IND-10); primera prueba completa de recuperación del core en el sitio de contingencia, con la conmutación, en 8 horas o menos a más tardar el 30 de junio de 2027 (IND-09; OBJ-01), junto con el simulacro de los procedimientos alternos (17.7, INI-14). Si la prueba supera las 8 horas, plan de corrección en 30 días y nueva prueba en el trimestre siguiente; si la causa es la conmutación manual, la automatiza INI-50 (AC-02)."},{"id":"INI-07","name":"Gestión de vulnerabilidades y parches en ciclos mensuales","origin":"Origen: E.08.","safeguards":"E.08, por implementar: 7.1, 7.2, 7.5 a 7.7\nE.08, existentes parciales: 7.3, 7.4","ig":"IG1 (4) · IG2 (3)","horizon":"Corto · ene–jun 2027","owner":"Operaciones y Tecnología (R de la fila 2 de E.06); rinde cuentas el oficial de seguridad (A)","dependencies":"Previas: INI-01 (activos expuestos e internos que se escanean); INI-02 (parches del IBM i que llegan con la extensión de servicio).\nSe adelantan: 7.5 (IG2, del mediano) por OBJ-02: OBJ-02 exige el escaneo trimestral de los activos internos al 30 de

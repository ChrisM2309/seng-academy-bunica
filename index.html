 enlazados si necesitás comprobar una afirmación.\u003c/p>\u003csection class=\"panel deep-study\">\u003cspan class=\"eyebrow\">GUÍA DETALLADA\u003c/span>\u003ch3>1 · Abrir la conversación como consultor\u003c/h3>\u003cp>La portada no es solo una presentación del equipo: fija el encargo del cliente. SENG debe dejar claro qué analizó, qué recomienda y qué decisiones necesita de dirección. BUNICA es un caso académico simulado; IG3 define el baseline esperado, no una certificación ni un estado logrado.\u003c/p>\u003cul class=\"dense-list\">\u003cli>Nombrá a los seis integrantes y sus funciones sin leer toda la portada.\u003c/li>\u003cli>Explicá IG3 como el nivel asignado a BUNICA: 153 salvaguardas acumuladas de IG1, IG2 e IG3.\u003c/li>\u003cli>Prometé tres resultados de la exposición: exposición prioritaria, controles seleccionados y orden de implementación.\u003c/li>\u003c/ul>\u003cdiv class=\"callout\">\u003cb>Ensayo:\u003c/b> Practicá una apertura de 20 segundos que termine con la decisión que buscarás al cierre.\u003c/div>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E01/E01_Acta_Equipo_Seleccion_Empresa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.01 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E08/E08_Checklist_Baseline_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.08 ↗\u003c/a> · \u003ca href=\"fuentes_originales/E12/E12_Presentacion_Ejecutiva_BUNICA_SENG.pptx\" target=\"_blank\" rel=\"noopener\">E.12 ↗\u003c/a>\u003c/div>\u003c/section>\u003csection class=\"panel deep-study\">\u003cspan class=\"eyebrow\">GUÍA DETALLADA\u003c/span>\u003ch3>2 · Delimitar qué está dentro del SGSI\u003c/h3>\u003cp>El perfil inicial nombra cuatro procesos críticos. El BIA añadió operación de infraestructura y gestión de identidades como procesos de soporte. El alcance también incluye los sistemas, sedes, datos, identidades e interfaces que BUNICA controla. Una exclusión limita el control directo; no elimina la obligación de gestionar la relación y el riesgo del proveedor.\u003c/p>\u003cul class=\"dense-list\">\u003cli>Si preguntan por Azure: distinguí plataforma física del proveedor de configuración, permisos, datos e interfaces controlados por BUNICA.\u003c/li>\u003cli>Si preguntan por el procesador de tarjetas: explicá dependencia contractual y R-07; CIS 15 aborda esa relación.\u003c/li>\u003cli>No confundás cuatro procesos críticos del perfil con los dos que el BIA clasifica críticos por disponibilidad.\u003c/li>\u003c/ul>\u003cdiv class=\"callout\">\u003cb>Ensayo:\u003c/b> Resumí en una frase qué queda fuera y en otra qué responsabilidades se mantienen.\u003c/div>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E02/E02_Compromiso_Direccion_Alcance_SGSI_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.02 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/E03_BIA_Consolidacion_Procesos_Criticos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.03 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E05/E05_Matriz_Riesgos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.05 ↗\u003c/a>\u003c/div>\u003c/section>\u003csection class=\"panel deep-study\">\u003cspan class=\"eyebrow\">GUÍA DETALLADA\u003c/span>\u003ch3>3 · Cerrar con una petición que se pueda aprobar\u003c/h3>\u003cp>La última diapositiva convierte el análisis en tres autorizaciones concretas. El costo de USD 278 360 es lo cuantificado para 2027, no el precio total hasta IG3; quedan partidas por cotizar. IBM i 7.4 ya perdió soporte estándar según el caso, por eso se pide extensión o una excepción formal. La prueba completa debe comprobar el RTO antes del 30 de junio de 2027.\u003c/p>\u003cul class=\"dense-list\">\u003cli>Primero: aprobar roadmap y costo de 2027.\u003c/li>\u003cli>Segundo: resolver soporte IBM i 7.4 antes del 30 de abril.\u003c/li>\u003cli>Tercero: autorizar la prueba completa del core antes del 30 de junio.\u003c/li>\u003c/ul>\u003cdiv class=\"callout\">\u003cb>Ensayo:\u003c/b> Pedí cada decisión con verbo, fecha y razón. Si el cliente objeta el monto, nombrá qué incluye y qué queda por cotizar.\u003c/div>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E10/E10_Roadmap_Madurez_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.10 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E11/E11_Documento_Final_LineaBase_BUNICA_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.11 ↗\u003c/a> · \u003ca href=\"fuentes_originales/E12/E12_Presentacion_Ejecutiva_BUNICA_SENG.pptx\" target=\"_blank\" rel=\"noopener\">E.12 ↗\u003c/a>\u003c/div>\u003c/section>\u003ch2>Las cifras e ideas que debés tener claras\u003c/h2>\u003cul class=\"dense-list\">\u003cli>BUNICA: 650 000 clientes, 420 000 usuarios digitales y USD 210 M de ingresos anuales.\u003c/li>\u003cli>El alcance incluye seis procesos: cuatro del perfil más infraestructura e identidades identificadas por el BIA.\u003c/li>\u003cli>Pedir tres decisiones: aprobar roadmap/costo 2027, resolver soporte IBM i 7.4 y autorizar prueba completa del core.\u003c/li>\u003c/ul>\u003ch2>Preguntas que podrían dirigirte\u003c/h2>\u003cdetails class=\"accordion\">\u003csummary>¿Por qué dejan fuera Azure o el procesador?\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>La plataforma física la opera un tercero; la configuración, identidades, interfaces, contratos y datos siguen bajo gobierno de BUNICA. E.02; riesgo de tercero R-07.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"accordion\">\u003csummary>¿Qué debe decidir dirección primero?\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>Aprobar el roadmap y su costo cuantificado de 2027, contratar extensión o formalizar excepción de IBM i 7.4 y autorizar la prueba completa antes del 30 de junio.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"accordion\">\u003csummary>¿El costo de USD 278 360 cubre todo el programa?\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>No. Es el costo cuantificado para 2027, 11,6 % del presupuesto de USD 2,4 M; quedan partidas por cotizar.\u003c/p>\u003c/div>\u003c/details>\u003csection class=\"panel\">\u003ch3>Ruta breve de estudio\u003c/h3>\u003col>\u003cli>Revisá tu diapositiva en la PPT vigente y el bloque correspondiente del guion.\u003c/li>\u003cli>Abrí los entregables fuente y marcá dónde están los IDs, valores y condiciones citados.\u003c/li>\u003cli>Ensayá tu intervención con cronómetro; dejá margen antes del corte de 10 minutos.\u003c/li>\u003cli>Pedile a un compañero una repregunta; respondé con evidencia y explicá qué aún no está comprobado.\u003c/li>\u003c/ol>\u003cp>\u003cb>Preparación común:\u003c/b> repasá también las nueve preguntas del cliente y hacé una práctica aleatoria.\u003c/p>\u003cbutton class=\"primary-btn\" data-nav=\"b8\">Estudiar las nueve preguntas →\u003c/button>\u003cbutton class=\"plain-btn\" data-nav=\"entrenador\">Practicar pregunta aleatoria →\u003c/button>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E01/E01_Acta_Equipo_Seleccion_Empresa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.01 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E02/E02_Compromiso_Direccion_Alcance_SGSI_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.02 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/E03_BIA_Consolidacion_Procesos_Criticos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.03 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E10/E10_Roadmap_Madurez_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.10 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E11/E11_Documento_Final_LineaBase_BUNICA_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.11 ↗\u003c/a> · \u003ca href=\"fuentes_originales/E12/E12_Presentacion_Ejecutiva_BUNICA_SENG.pptx\" target=\"_blank\" rel=\"noopener\">E.12 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E12/Guion_Defensa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">Guion ↗\u003c/a>\u003c/div>\u003c/section>","c2":"\u003cdiv class=\"callout\">\u003cb>Roberto Carlos Morán Gómez · Analista de riesgos · responsable declarado\u003c/b>\u003cbr>Exponés las diapositivas 3 (1:30 en total). Suplencia según el guion: Oscar Pleités (3). El rol y la presentación son dos responsabilidades distintas; esta guía prepara ambas sin reemplazar E.12.\u003c/div>\u003csection class=\"panel blue\">\u003ch2>Tu objetivo al presentar\u003c/h2>\u003cp>Traducir el BIA a continuidad y pérdidas: decir qué proceso debe volver, cuánto tiempo tolera el negocio y qué brecha existe hoy.\u003c/p>\u003cp>\u003cb>Antes del ensayo:\u003c/b> leé en voz alta tu guion, comprobá cada cifra en la fuente enlazada y prepará una respuesta de 20–30 segundos para la pregunta probable. Después practicá dos preguntas de otros bloques; el profesor puede dirigirlas a cualquiera.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E03/E03_BIA_Consolidacion_Procesos_Criticos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.03 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/BIA_P02_Ficha_BIA_Proceso_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P02 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/BIA_P03_Matriz_Impacto_Tiempo_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P03 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/BIA_P05_Matriz_Criticidad_Priorizacion_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P05 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/BIA_P06_Registro_Supuestos_SPOF_Brechas_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P06 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E05/E05_Matriz_Riesgos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.05 ↗\u003c/a> · \u003ca href=\"fuentes_originales/E12/E12_Presentacion_Ejecutiva_BUNICA_SENG.pptx\" target=\"_blank\" rel=\"noopener\">E.12 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E12/Guion_Defensa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">Guion ↗\u003c/a>\u003c/div>\u003c/section>\u003ch2>Estudio en profundidad\u003c/h2>\u003cp>Seguí estas secciones en orden: primero entendé el mensaje del bloque, luego las cifras y finalmente las objeciones. Abrí los documentos fuente enlazados si necesitás comprobar una afirmación.\u003c/p>\u003csection class=\"panel deep-study\">\u003cspan class=\"eyebrow\">GUÍA DETALLADA\u003c/span>\u003ch3>1 · Leer el BIA como cadena de continuidad\u003c/h3>\u003cp>El BIA empieza con los procesos y pregunta qué impacto tendría detenerlos, cuánto tiempo tolera el negocio y qué nivel mínimo debe sostenerse. De ahí salen MTPD, RTO, WRT y RPO. No son sinónimos: MTPD es el límite tolerable; RTO es la meta de recuperación; WRT es el trabajo posterior para volver a la normalidad; RPO limita cuánto dato se puede perder.\u003c/p>\u003cul class=\"dense-list\">\u003cli>P-01: 4,42; MTPD 24 h; RTO 8 h; WRT 4 h; RPO 15 min.\u003c/li>\u003cli>P-03 compensación: puntaje 3,54; MTPD 24 h; RTO 4 h; WRT 4 h; RPO 15 min.\u003c/li>\u003cli>La recuperación técnica y el tiempo para retomar el trabajo se suman al comparar con MTPD: P-01 da 12 h, P-03 da 8 h.\u003c/li>\u003c/ul>\u003cdiv class=\"callout\">\u003cb>Ensayo:\u003c/b> Explicá por qué un RTO de 8 h no significa que el negocio pueda estar detenido 24 h sin consecuencias.\u003c/div>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E03/E03_BIA_Consolidacion_Procesos_Criticos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.03 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/BIA_P02_Ficha_BIA_Proceso_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P02 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/BIA_P03_Matriz_Impacto_Tiempo_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P03 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/BIA_P05_Matriz_Criticidad_Priorizacion_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P05 ↗\u003c/a>\u003c/div>\u003c/section>\u003csection class=\"panel deep-study\">\u003cspan class=\"eyebrow\">GUÍA DETALLADA\u003c/span>\u003ch3>2 · Separar pérdida horaria y pérdida por evento\u003c/h3>\u003cp>La diapositiva usa dos escalas para hacer visible el impacto. El costo horario de P-01 es al menos USD 10 924 durante horario de sucursales; el SLE de USD 612 000 estima una pérdida por evento de ransomware. Para anualizar un escenario se usa ALE = SLE × ARO. En R-01, E.05 supone ARO 0,5, por eso ALE es USD 306 000/año. La frecuencia es supuesto, no una cuenta de incidentes ya observados.\u003c/p>\u003cul class=\"dense-list\">\u003cli>Costo/hora ayuda a decidir urgencia operativa.\u003c/li>\u003cli>SLE expresa pérdida de un evento; ALE expresa pérdida anual esperada bajo una frecuencia supuesta.\u003c/li>\u003cli>No sumés métricas si describen el mismo daño o si una ya está incluida en otra.\u003c/li>\u003c/ul>\u003cdiv class=\"callout\">\u003cb>Ensayo:\u003c/b> Respondé qué representa cada cifra antes de calcular: unidad, periodo y supuesto.\u003c/div>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E03/E03_BIA_Consolidacion_Procesos_Criticos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.03 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E05/E05_Matriz_Riesgos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.05 ↗\u003c/a>\u003c/div>\u003c/section>\u003csection class=\"panel deep-study\">\u003cspan class=\"eyebrow\">GUÍA DETALLADA\u003c/span>\u003ch3>3 · Defender la brecha con evidencia\u003c/h3>\u003cp>El problema que presenta el BIA no es abstracto: la prueba más reciente fue parcial y tardó 11 h frente a un RTO de 8 h. Además, la réplica horaria no garantiza el RPO de 15 min, y la cinta diaria es la única copia independiente descrita. Por eso la recomendación incluye copia aislada y prueba completa, no solo comprar respaldo.\u003c/p>\u003cul class=\"dense-list\">\u003cli>Una prueba parcial no acredita la recuperación completa del servicio.\u003c/li>\u003cli>El acta futura debe guardar hora de inicio y fin, datos restaurados y pérdida real frente al RPO.\u003c/li>\u003cli>Los seis SPOF ayudan a priorizar dependencias que pueden detener los procesos críticos.\u003c/li>\u003c/ul>\u003cdiv class=\"callout\">\u003cb>Ensayo:\u003c/b> Si preguntan ‘¿ya se recupera en ocho horas?’, contestá: todavía no está demostrado; la prueba parcial tardó once.\u003c/div>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E03/E03_BIA_Consolidacion_Procesos_Criticos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.03 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/BIA_P04_Mapa_Dependencias_Recursos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P04 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/BIA_P06_Registro_Supuestos_SPOF_Brechas_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P06 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E05/E05_Matriz_Riesgos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.05 ↗\u003c/a>\u003c/div>\u003c/section>\u003ch2>Las cifras e ideas que debés tener claras\u003c/h2>\u003cul class=\"dense-list\">\u003cli>P-01 core: puntaje BIA 4,42; MTPD 24 h; RTO 8 h + WRT 4 h; RPO 15 min.\u003c/li>\u003cli>Cada hora sin core cuesta al menos USD 10 924 en horario de sucursales; SLE de cifrado: USD 612 000 por evento.\u003c/li>\u003cli>La última prueba parcial tardó 11 h y la réplica es horaria: la recuperación y el RPO objetivo no están demostrados.\u003c/li>\u003c/ul>\u003ch2>Preguntas que podrían dirigirte\u003c/h2>\u003cdetails class=\"accordion\">\u003csummary>El perfil dice cuatro procesos críticos y el BIA dos; ¿por qué?\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>El perfil define criticidad inicial y alcance. El BIA mide impacto por interrupción: core y compensación son críticos por disponibilidad; canales y AML/KYC siguen dentro por datos sensibles.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"accordion\">\u003csummary>¿Cuánto cuesta cada hora detenida?\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>Al menos USD 10 924 para P-01 en horario de sucursales. Es un piso: las multas no están monetizadas.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"accordion\">\u003csummary>¿Por qué no suman USD 10 924 por hora y USD 612 000?\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>Son métricas distintas: costo horario de interrupción y pérdida por evento de ransomware. Sumarlas como pérdidas independientes puede duplicar el daño.\u003c/p>\u003c/div>\u003c/details>\u003csection class=\"panel\">\u003ch3>Ruta breve de estudio\u003c/h3>\u003col>\u003cli>Revisá tu diapositiva en la PPT vigente y el bloque correspondiente del guion.\u003c/li>\u003cli>Abrí los entregables fuente y marcá dónde están los IDs, valores y condiciones citados.\u003c/li>\u003cli>Ensayá tu intervención con cronómetro; dejá margen antes del corte de 10 minutos.\u003c/li>\u003cli>Pedile a un compañero una repregunta; respondé con evidencia y explicá qué aún no está comprobado.\u003c/li>\u003c/ol>\u003cp>\u003cb>Preparación común:\u003c/b> repasá también las nueve preguntas del cliente y hacé una práctica aleatoria.\u003c/p>\u003cbutton class=\"primary-btn\" data-nav=\"b8\">Estudiar las nueve preguntas →\u003c/button>\u003cbutton class=\"plain-btn\" data-nav=\"entrenador\">Practicar pregunta aleatoria →\u003c/button>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E03/E03_BIA_Consolidacion_Procesos_Criticos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.03 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/BIA_P02_Ficha_BIA_Proceso_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P02 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/BIA_P03_Matriz_Impacto_Tiempo_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P03 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/BIA_P05_Matriz_Criticidad_Priorizacion_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P05 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E03/BIA_P06_Registro_Supuestos_SPOF_Brechas_SENG.pdf\" target=\"_blank\" rel=\"noopener\">BIA_P06 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E05/E05_Matriz_Riesgos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.05 ↗\u003c/a> · \u003ca href=\"fuentes_originales/E12/E12_Presentacion_Ejecutiva_BUNICA_SENG.pptx\" target=\"_blank\" rel=\"noopener\">E.12 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E12/Guion_Defensa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">Guion ↗\u003c/a>\u003c/div>\u003c/section>","c3":"\u003cdiv class=\"callout\">\u003cb>Oscar José Pleités Lemus · Analista de riesgos · rol compartido\u003c/b>\u003cbr>Exponés las diapositivas 4 (1:30 en total). Suplencia según el guion: Roberto Morán (4). El rol y la presentación son dos responsabilidades distintas; esta guía prepara ambas sin reemplazar E.12.\u003c/div>\u003csection class=\"panel blue\">\u003ch2>Tu objetivo al presentar\u003c/h2>\u003cp>Explicar el mapa inherente: qué escenarios encabezan la prioridad, cómo ocurren y qué significa el apetito residual aprobado.\u003c/p>\u003cp>\u003cb>Antes del ensayo:\u003c/b> leé en voz alta tu guion, comprobá cada cifra en la fuente enlazada y prepará una respuesta de 20–30 segundos para la pregunta probable. Después practicá dos preguntas de otros bloques; el profesor puede dirigirlas a cualquiera.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E04/E04_Inventario_Clasificacion_Activos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.04 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E05/E05_Matriz_Riesgos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.05 ↗\u003c/a> · \u003ca href=\"fuentes_originales/E12/E12_Presentacion_Ejecutiva_BUNICA_SENG.pptx\" target=\"_blank\" rel=\"noopener\">E.12 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E12/Guion_Defensa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">Guion ↗\u003c/a>\u003c/div>\u003c/section>\u003ch2>Estudio en profundidad\u003c/h2>\u003cp>Seguí estas secciones en orden: primero entendé el mensaje del bloque, luego las cifras y finalmente las objeciones. Abrí los documentos fuente enlazados si necesitás comprobar una afirmación.\u003c/p>\u003csection class=\"panel deep-study\">\u003cspan class=\"eyebrow\">GUÍA DETALLADA\u003c/span>\u003ch3>1 · Cómo se lee el mapa de calor\u003c/h3>\u003cp>Cada punto es un escenario de E.05 ubicado por probabilidad e impacto inherentes. El producto da la puntuación: 4 × 5 = 20 y categoría Crítico. La matriz prioriza conversación y tratamiento; no convierte un escenario posible en un incidente ocurrido.\u003c/p>\u003cul class=\"dense-list\">\u003cli>14 escenarios: 2 Críticos, 9 Altos, 2 Medios y 1 Bajo.\u003c/li>\u003cli>R-01 y R-02 quedan en 20/25; no son dos pérdidas comprobadas.\u003c/li>\u003cli>Al explicar una celda, nombrá riesgo, amenaza, vulnerabilidad y activo afectado.\u003c/li>\u003c/ul>\u003cdiv class=\"callout\">\u003cb>Ensayo:\u003c/b> Practicá recorrer el gráfico en 15 segundos: ejes, dos riesgos prioritarios y concentración del impacto.\u003c/div>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E05/E05_Matriz_Riesgos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.05 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E04/E04_Inventario_Clasificacion_Activos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.04 ↗\u003c/a>\u003c/div>\u003c/section>\u003csection class=\"panel deep-study\">\u003cspan class=\"eyebrow\">GUÍA DETALLADA\u003c/span>\u003ch3>2 · Comparar las dos rutas al cifrado del core\u003c/h3>\u003cp>R-01 empieza con ransomware desde una estación de sucursal y aprovecha una red plana hasta el core, su réplica y respaldos en línea. R-02 empieza con la contraseña de un administrador del directorio sin segundo factor; el directorio único amplía el alcance de la toma. El desenlace puede coincidir, pero la puerta de entrada y las salvaguardas no son las mismas.\u003c/p>\u003cul class=\"dense-list\">\u003cli>R-01: red plana, réplica expuesta y recuperación no demostrada.\u003c/li>\u003cli>R-02: cuenta privilegiada y falta de segundo factor.\u003c/li>\u003cli>La misma SLE puede describir una pérdida compartida; no sumes automáticamente ambas como eventos independientes.\u003c/li>\u003c/ul>\u003cdiv class=\"callout\">\u003cb>Ensayo:\u003c/b> Contestá cuál control corta cada ruta: segmentación y recuperación para R-01; FIDO2 y cuentas separadas para R-02.\u003c/div>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E05/E05_Matriz_Riesgos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.05 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_06_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS6 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_11_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS11 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_12_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS12 ↗\u003c/a>\u003c/div>\u003c/section>\u003csection class=\"panel deep-study\">\u003cspan class=\"eyebrow\">GUÍA DETALLADA\u003c/span>\u003ch3>3 · Explicar apetito y residual sin sobreprometer\u003c/h3>\u003cp>La dirección simulada firma un apetito cuyo máximo residual es Medio. E.05 calcula residuales condicionados a que controles e iniciativas estén implantados y den evidencia. Para R-01, el cálculo esperado baja a 8 si la segmentación/detección reduce probabilidad y una recuperación probada reduce impacto. Hasta que E.09 valide esos resultados, se informa el inherente y la brecha.\u003c/p>\u003cul class=\"dense-list\">\u003cli>Inherente: exposición antes de tratamiento.\u003c/li>\u003cli>Residual: exposición estimada después de los controles, bajo supuestos explícitos.\u003c/li>\u003cli>La aceptación de R-14 en Bajo no significa que todos los riesgos sean aceptables ni que se ignore el seguimiento.\u003c/li>\u003c/ul>\u003cdiv class=\"callout\">\u003cb>Ensayo:\u003c/b> Usá ‘esperado si se implementa y verifica’, no ‘ya bajó’.\u003c/div>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E05/E05_Matriz_Riesgos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.05 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E09/E09_Indicadores_Auditoria_Interna_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.09 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E10/E10_Roadmap_Madurez_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.10 ↗\u003c/a>\u003c/div>\u003c/section>\u003ch2>Las cifras e ideas que debés tener claras\u003c/h2>\u003cul class=\"dense-list\">\u003cli>Hay 14 escenarios: 2 Críticos, 9 Altos, 2 Medios y 1 Bajo.\u003c/li>\u003cli>R-01 y R-02 son Críticos 20/25 y convergen en el cifrado del core por vías distintas.\u003c/li>\u003cli>El apetito residual máximo es Medio; los niveles residuales son esperados después del tratamiento, no resultados medidos hoy.\u003c/li>\u003c/ul>\u003ch2>Preguntas que podrían dirigirte\u003c/h2>\u003cdetails class=\"accordion\">\u003csummary>¿Cuánto cuesta R-01?\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>SLE USD 612 000 × ARO 0,5 = ALE USD 306 000/año, bajo el supuesto documentado; el residual R-01 es 8 si operan y se prueban los controles.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"accordion\">\u003csummary>¿Por qué dos riesgos distintos llegan al mismo daño?\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>R-01 describe entrada de ransomware desde una sucursal y movimiento por red plana; R-02 describe toma de credenciales administrativas. Ambos pueden cifrar el mismo core.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"accordion\">\u003csummary>¿Ya quedaron los 14 dentro del apetito?\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>Es el resultado esperado del tratamiento en E.05. Hasta demostrar operación con evidencia, no se debe afirmar que el residual ya ocurrió.\u003c/p>\u003c/div>\u003c/details>\u003csection class=\"panel\">\u003ch3>Ruta breve de estudio\u003c/h3>\u003col>\u003cli>Revisá tu diapositiva en la PPT vigente y el bloque correspondiente del guion.\u003c/li>\u003cli>Abrí los entregables fuente y marcá dónde están los IDs, valores y condiciones citados.\u003c/li>\u003cli>Ensayá tu intervención con cronómetro; dejá margen antes del corte de 10 minutos.\u003c/li>\u003cli>Pedile a un compañero una repregunta; respondé con evidencia y explicá qué aún no está comprobado.\u003c/li>\u003c/ol>\u003cp>\u003cb>Preparación común:\u003c/b> repasá también las nueve preguntas del cliente y hacé una práctica aleatoria.\u003c/p>\u003cbutton class=\"primary-btn\" data-nav=\"b8\">Estudiar las nueve preguntas →\u003c/button>\u003cbutton class=\"plain-btn\" data-nav=\"entrenador\">Practicar pregunta aleatoria →\u003c/button>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E04/E04_Inventario_Clasificacion_Activos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.04 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E05/E05_Matriz_Riesgos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.05 ↗\u003c/a> · \u003ca href=\"fuentes_originales/E12/E12_Presentacion_Ejecutiva_BUNICA_SENG.pptx\" target=\"_blank\" rel=\"noopener\">E.12 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E12/Guion_Defensa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">Guion ↗\u003c/a>\u003c/div>\u003c/section>","c4":"\u003cdiv class=\"callout\">\u003cb>Christopher Alexander Marroquín Figueroa · Arquitecto de controles\u003c/b>\u003cbr>Exponés las diapositivas 5 (2:00 en total). Suplencia según el guion: Diego Arévalo (5); Christopher también suple 6 y 7. El rol y la presentación son dos responsabilidades distintas; esta guía prepara ambas sin reemplazar E.12.\u003c/div>\u003csection class=\"panel blue\">\u003ch2>Tu objetivo al presentar\u003c/h2>\u003cp>Defender la regla de selección y conectar cada control con el riesgo que trata, una medida concreta y evidencia verificable.\u003c/p>\u003cp>\u003cb>Antes del ensayo:\u003c/b> leé en voz alta tu guion, comprobá cada cifra en la fuente enlazada y prepará una respuesta de 20–30 segundos para la pregunta probable. Después practicá dos preguntas de otros bloques; el profesor puede dirigirlas a cualquiera.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E01/E01_Acta_Equipo_Seleccion_Empresa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.01 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E05/E05_Matriz_Riesgos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.05 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_05_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS5 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_06_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS6 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_11_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS11 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_12_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS12 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_13_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS13 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_15_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS15 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E08/E08_Checklist_Baseline_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.08 ↗\u003c/a> · \u003ca href=\"fuentes_originales/E12/E12_Presentacion_Ejecutiva_BUNICA_SENG.pptx\" target=\"_blank\" rel=\"noopener\">E.12 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E12/Guion_Defensa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">Guion ↗\u003c/a>\u003c/div>\u003c/section>\u003ch2>Estudio en profundidad\u003c/h2>\u003cp>Seguí estas secciones en orden: primero entendé el mensaje del bloque, luego las cifras y finalmente las objeciones. Abrí los documentos fuente enlazados si necesitás comprobar una afirmación.\u003c/p>\u003csection class=\"panel deep-study\">\u003cspan class=\"eyebrow\">GUÍA DETALLADA\u003c/span>\u003ch3>1 · De la matriz de riesgos a una selección reproducible\u003c/h3>\u003cp>E.07 no elige seis nombres por preferencia. Cuenta qué controles CIS están asociados a los riesgos Críticos y Altos de E.05; después aplica desempates declarados. Así el cliente puede reconstruir por qué la lista prioritaria es CIS 12, 15, 13, 6, 11 y 5.\u003c/p>\u003cul class=\"dense-list\">\u003cli>CIS 12 cubre cuatro riesgos; CIS 15 cubre tres.\u003c/li>\u003cli>CIS 13, 6 y 11 cubren dos cada uno y alcanzan un Crítico; la suma de inherentes desempata.\u003c/li>\u003cli>CIS 5 ocupa el sexto lugar por ser el candidato de un riesgo que trata R-02, Crítico.\u003c/li>\u003c/ul>\u003cdiv class=\"callout\">\u003cb>Ensayo:\u003c/b> Si preguntan ‘¿por qué no CIS 4?’, explicá que el puesto final se asigna según el criterio documentado; CIS 4 sigue en el baseline y trata brechas que el análisis mantiene en E.08.\u003c/div>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E05/E05_Matriz_Riesgos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.05 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_05_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS5 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_12_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS12 ↗\u003c/a>\u003c/div>\u003c/section>\u003csection class=\"panel deep-study\">\u003cspan class=\"eyebrow\">GUÍA DETALLADA\u003c/span>\u003ch3>2 · Explicar qué hace cada control\u003c/h3>\u003cp>Vinculá la familia CIS con una medida que el cliente pueda imaginar y con el efecto esperado. CIS 12 delimita el tráfico entre zonas; CIS 15 pone requisitos en proveedores; CIS 13 concentra eventos y alertas; CIS 6 protege accesos; CIS 11 aísla y prueba copias; CIS 5 hace visibles las cuentas privilegiadas. La política establece el resultado exigido, el SOP los pasos y la evidencia el comprobante.\u003c/p>\u003cul class=\"dense-list\">\u003cli>No recités solo nombres: decí qué riesgo cubre y qué resultado se observaría.\u003c/li>\u003cli>Nombra una salvaguarda concreta por control: por ejemplo 11.4 copia aislada, o FIDO2 para administrador.\u003c/li>\u003cli>Usá IDs como R-01, R-02 e IND-09 para mostrar trazabilidad.\u003c/li>\u003c/ul>\u003cdiv class=\"callout\">\u003cb>Ensayo:\u003c/b> Para cada control, practicá una frase: ‘CIS __ reduce R-__ mediante __; lo comprobaríamos con __’.\u003c/div>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E05/E05_Matriz_Riesgos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.05 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_05_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS5 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_06_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS6 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_11_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS11 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_12_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS12 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_13_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS13 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_15_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS15 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E09/E09_Indicadores_Auditoria_Interna_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.09 ↗\u003c/a>\u003c/div>\u003c/section>\u003csection class=\"panel deep-study\">\u003cspan class=\"eyebrow\">GUÍA DETALLADA\u003c/span>\u003ch3>3 · Mantener separados E.07, E.08 y tu responsabilidad\u003c/h3>\u003cp>E.07 desarrolla seis controles a profundidad. E.08 completa el baseline IG3 de 153 salvaguardas: 45 documentadas en E.07 y otras 108 en E.08. E.01 te asigna el rol de arquitecto y E.08 te asigna CIS 4 y CIS 16, 26 filas entre ambas familias. Las especificaste en el checklist; no son séptimo y octavo controles seleccionados y no significa que estén ya operativas.\u003c/p>\u003cul class=\"dense-list\">\u003cli>CIS 4: configuración segura; apoya la gestión de configuraciones y R-09.\u003c/li>\u003cli>CIS 16: seguridad del software; sus dependencias pueden mover salvaguardas al roadmap.\u003c/li>\u003cli>Al hablar de ROSI, indicá fórmula, supuestos y sensibilidad; no lo presentes como ahorro observado.\u003c/li>\u003c/ul>\u003cdiv class=\"callout\">\u003cb>Ensayo:\u003c/b> Este apartado complementa tu ruta B1–B8; conserva esa ruta para estudiar procedimientos, controles y tus salvaguardas en detalle.\u003c/div>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E01/E01_Acta_Equipo_Seleccion_Empresa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.01 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E05/E05_Matriz_Riesgos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.05 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E08/E08_Checklist_Baseline_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.08 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E10/E10_Roadmap_Madurez_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.10 ↗\u003c/a>\u003c/div>\u003c/section>\u003ch2>Las cifras e ideas que debés tener claras\u003c/h2>\u003cul class=\"dense-list\">\u003cli>CIS 12 trata R-01/R-03/R-08/R-10; CIS 15 R-07/R-10/R-11; CIS 13 R-01/R-03.\u003c/li>\u003cli>CIS 6 trata R-02/R-05; CIS 11 R-01/R-06; CIS 5 R-02. En conjunto cubren 9 de 11 riesgos Críticos y Altos.\u003c/li>\u003cli>Tu trabajo individual CIS 4 y 16 es parte de E.08 (26 salvaguardas), no reemplaza ni modifica los seis E.07.\u003c/li>\u003c/ul>\u003ch2>Preguntas que podrían dirigirte\u003c/h2>\u003cdetails class=\"accordion\">\u003csummary>¿Por qué esos seis controles?\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>E.07 prioriza cobertura de riesgos Críticos y Altos: 12 cubre 4 riesgos, 15 cubre 3, 13/6/11 cubren 2 y un Crítico; CIS 5 gana el último lugar al cubrir R-02.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"accordion\">\u003csummary>¿Por qué CIS 4 y 16 son parte tuya?\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>E.01 asigna E.07–E.09 al arquitecto de controles y E.08 distribuye CIS 4/16 a Christopher: 26 filas del baseline IG3. Es reparto de entregables, no la selección de seis.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"accordion\">\u003csummary>¿ROSI 3 345 % significa ahorro comprobado?\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>No. Es estimación de E.05 bajo SLE, ARO y costo anual asumidos; las llaves FIDO2 y el beneficio deben verificarse al cotizar e implantar.\u003c/p>\u003c/div>\u003c/details>\u003csection class=\"panel\">\u003ch3>Ruta breve de estudio\u003c/h3>\u003col>\u003cli>Revisá tu diapositiva en la PPT vigente y el bloque correspondiente del guion.\u003c/li>\u003cli>Abrí los entregables fuente y marcá dónde están los IDs, valores y condiciones citados.\u003c/li>\u003cli>Ensayá tu intervención con cronómetro; dejá margen antes del corte de 10 minutos.\u003c/li>\u003cli>Pedile a un compañero una repregunta; respondé con evidencia y explicá qué aún no está comprobado.\u003c/li>\u003c/ol>\u003cp>\u003cb>Preparación común:\u003c/b> repasá también las nueve preguntas del cliente y hacé una práctica aleatoria.\u003c/p>\u003cbutton class=\"primary-btn\" data-nav=\"b8\">Estudiar las nueve preguntas →\u003c/button>\u003cbutton class=\"plain-btn\" data-nav=\"entrenador\">Practicar pregunta aleatoria →\u003c/button>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E01/E01_Acta_Equipo_Seleccion_Empresa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.01 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E05/E05_Matriz_Riesgos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.05 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_05_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS5 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_06_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS6 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_11_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS11 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_12_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS12 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_13_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS13 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_15_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS15 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E08/E08_Checklist_Baseline_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.08 ↗\u003c/a> · \u003ca href=\"fuentes_originales/E12/E12_Presentacion_Ejecutiva_BUNICA_SENG.pptx\" target=\"_blank\" rel=\"noopener\">E.12 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E12/Guion_Defensa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">Guion ↗\u003c/a>\u003c/div>\u003c/section>","c5":"\u003cdiv class=\"callout\">\u003cb>Roberto Josué Polanco Hernández · Oficial de documentación\u003c/b>\u003cbr>Exponés las diapositivas 8 (1:30 en total). Suplencia según el guion: Diego Arévalo (8). El rol y la presentación son dos responsabilidades distintas; esta guía prepara ambas sin reemplazar E.12.\u003c/div>\u003csection class=\"panel blue\">\u003ch2>Tu objetivo al presentar\u003c/h2>\u003cp>Contar el orden de ejecución, qué depende de qué, cuándo se esperan los hitos y qué costo está cuantificado.\u003c/p>\u003cp>\u003cb>Antes del ensayo:\u003c/b> leé en voz alta tu guion, comprobá cada cifra en la fuente enlazada y prepará una respuesta de 20–30 segundos para la pregunta probable. Después practicá dos preguntas de otros bloques; el profesor puede dirigirlas a cualquiera.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E06/E06_Matriz_RACI_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.06 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E08/E08_Checklist_Baseline_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.08 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E10/E10_Roadmap_Madurez_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.10 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E11/E11_Documento_Final_LineaBase_BUNICA_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.11 ↗\u003c/a> · \u003ca href=\"fuentes_originales/E12/E12_Presentacion_Ejecutiva_BUNICA_SENG.pptx\" target=\"_blank\" rel=\"noopener\">E.12 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E12/Guion_Defensa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">Guion ↗\u003c/a>\u003c/div>\u003c/section>\u003ch2>Estudio en profundidad\u003c/h2>\u003cp>Seguí estas secciones en orden: primero entendé el mensaje del bloque, luego las cifras y finalmente las objeciones. Abrí los documentos fuente enlazados si necesitás comprobar una afirmación.\u003c/p>\u003csection class=\"panel deep-study\">\u003cspan class=\"eyebrow\">GUÍA DETALLADA\u003c/span>\u003ch3>1 · El roadmap convierte prioridades en trabajo con dependencias\u003c/h3>\u003cp>Una iniciativa INI es un paquete de tareas, responsables y resultados; una salvaguarda CIS es una medida concreta que debe quedar operativa. Una iniciativa puede habilitar varias salvaguardas o depender de otra capacidad. E.10 ordena el trabajo para que BUNICA cierre primero brechas esenciales y después complete las dependencias que exige IG2 e IG3.\u003c/p>\u003cul class=\"dense-list\">\u003cli>El plan abarca 48 iniciativas entre enero de 2027 y diciembre de 2029.\u003c/li>\u003cli>Los avances 75, 137 y 153 son totales acumulados, no tres cantidades aisladas.\u003c/li>\u003cli>Las fechas son metas del roadmap: una línea en el plan no demuestra que la tarea se ejecutó.\u003c/li>\u003c/ul>\u003cdiv class=\"callout\">\u003cb>Ensayo:\u003c/b> Explicá con tus palabras la diferencia entre iniciativa, control CIS y salvaguarda.\u003c/div>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E08/E08_Checklist_Baseline_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.08 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E10/E10_Roadmap_Madurez_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.10 ↗\u003c/a>\u003c/div>\u003c/section>\u003csection class=\"panel deep-study\">\u003cspan class=\"eyebrow\">GUÍA DETALLADA\u003c/span>\u003ch3>2 · Qué ocurre en cada horizonte\u003c/h3>\u003cp>Corto plazo: 16 iniciativas y meta de 75 salvaguardas al 30 de junio de 2027; se completa IG1 y se adelantan tratamientos para riesgos Críticos. Mediano: 18 iniciativas y meta acumulada de 137 al 30 de junio de 2028; se completa IG2 con segmentación, SIEM y proveedores. Largo: 14 iniciativas y meta de 153 al 31 de diciembre de 2029; se completan salvaguardas IG3 y migraciones tecnológicas.\u003c/p>\u003cul class=\"dense-list\">\u003cli>75 acumuladas = 56 IG1 + 17 IG2 + 2 IG3.\u003c/li>\u003cli>62 adicionales llevan a 137; el horizonte añade 57 IG2 y 5 IG3.\u003c/li>\u003cli>16 adicionales completan las 153, con IG1 e IG2 completos.\u003c/li>\u003c/ul>\u003cdiv class=\"callout\">\u003cb>Ensayo:\u003c/b> Si dirección pregunta qué hacemos primero, empezá por FIDO2/cuentas dedicadas y copia aislada/prueba del core; luego explica las dependencias de segmentación y SIEM.\u003c/div>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E10/E10_Roadmap_Madurez_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.10 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E11/E11_Documento_Final_LineaBase_BUNICA_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.11 ↗\u003c/a>\u003c/div>\u003c/section>\u003csection class=\"panel deep-study\">\u003cspan class=\"eyebrow\">GUÍA DETALLADA\u003c/span>\u003ch3>3 · Justificar el orden y comunicar el presupuesto\u003c/h3>\u003cp>El orden sigue IG1 → IG2 → IG3, pero algunas salvaguardas se adelantan si tratan un Crítico/Alto, cumplen una obligación o sirven a un objetivo con fecha. La segmentación necesita inventario, diseño de zonas y cortafuegos; por eso se programa después de esas entregas. USD 278 360 es el costo de 2027 cuantificado en el caso (11,6 % de USD 2,4 M); hay partidas por cotizar.\u003c/p>\u003cul class=\"dense-list\">\u003cli>Nombra la dependencia que debe cerrarse antes de cada iniciativa importante.\u003c/li>\u003cli>Explica el riesgo temporal y la medida puente, como copia aislada antes de que opere la segmentación.\u003c/li>\u003cli>No describas el presupuesto de 2027 como costo total hasta 2029.\u003c/li>\u003c/ul>\u003cdiv class=\"callout\">\u003cb>Ensayo:\u003c/b> Practicá contestar: ‘¿por qué no se hace todo al inicio?’ con dependencias, ventana de compra/instalación y medida provisional.\u003c/div>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E05/E05_Matriz_Riesgos_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.05 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E10/E10_Roadmap_Madurez_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.10 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E11/E11_Documento_Final_LineaBase_BUNICA_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.11 ↗\u003c/a>\u003c/div>\u003c/section>\u003ch2>Las cifras e ideas que debés tener claras\u003c/h2>\u003cul class=\"dense-list\">\u003cli>Roadmap: 48 iniciativas en 36 meses, del 4 ene 2027 al 31 dic 2029.\u003c/li>\u003cli>75 salvaguardas acumuladas al 30 jun 2027; 137 al 30 jun 2028; las 153 del IG3 al 31 dic 2029.\u003c/li>\u003cli>Inventario, diseño de zonas y compra preceden segmentación; por eso SIEM y segmentación no empiezan como primera tarea.\u003c/li>\u003c/ul>\u003ch2>Preguntas que podrían dirigirte\u003c/h2>\u003cdetails class=\"accordion\">\u003csummary>¿Por qué no segmentar desde el primer día?\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>Se requiere inventario de activos, diseño de zonas y compra/instalación de cortafuegos. Mientras tanto, copia aislada y recuperación probada reducen la exposición de R-01.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"accordion\">\u003csummary>¿75, 137 y 153 son lotes nuevos?\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>Son metas acumuladas de salvaguardas que se espera tener operativas a cada fecha.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"accordion\">\u003csummary>¿El presupuesto 2027 está cerrado?\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>USD 278 360 está cuantificado; el plan conserva partidas por cotizar y no representa el costo final de las 153 salvaguardas.\u003c/p>\u003c/div>\u003c/details>\u003csection class=\"panel\">\u003ch3>Ruta breve de estudio\u003c/h3>\u003col>\u003cli>Revisá tu diapositiva en la PPT vigente y el bloque correspondiente del guion.\u003c/li>\u003cli>Abrí los entregables fuente y marcá dónde están los IDs, valores y condiciones citados.\u003c/li>\u003cli>Ensayá tu intervención con cronómetro; dejá margen antes del corte de 10 minutos.\u003c/li>\u003cli>Pedile a un compañero una repregunta; respondé con evidencia y explicá qué aún no está comprobado.\u003c/li>\u003c/ol>\u003cp>\u003cb>Preparación común:\u003c/b> repasá también las nueve preguntas del cliente y hacé una práctica aleatoria.\u003c/p>\u003cbutton class=\"primary-btn\" data-nav=\"b8\">Estudiar las nueve preguntas →\u003c/button>\u003cbutton class=\"plain-btn\" data-nav=\"entrenador\">Practicar pregunta aleatoria →\u003c/button>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E06/E06_Matriz_RACI_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.06 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E08/E08_Checklist_Baseline_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.08 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E10/E10_Roadmap_Madurez_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.10 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E11/E11_Documento_Final_LineaBase_BUNICA_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.11 ↗\u003c/a> · \u003ca href=\"fuentes_originales/E12/E12_Presentacion_Ejecutiva_BUNICA_SENG.pptx\" target=\"_blank\" rel=\"noopener\">E.12 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E12/Guion_Defensa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">Guion ↗\u003c/a>\u003c/div>\u003c/section>","c6":"\u003cdiv class=\"callout\">\u003cb>Angie Fiorella Alberto Guzmán · Oficial de Calidad\u003c/b>\u003cbr>Exponés las diapositivas 6 y 7 (1:30 en total). Suplencia según el guion: Christopher Marroquín (6–7). El rol y la presentación son dos responsabilidades distintas; esta guía prepara ambas sin reemplazar E.12.\u003c/div>\u003csection class=\"panel blue\">\u003ch2>Tu objetivo al presentar\u003c/h2>\u003cp>Presentar el estado del baseline y cómo dirección comprobará que las medidas funcionen, manteniendo consistencia entre cifra, estado, indicador y fuente.\u003c/p>\u003cp>\u003cb>Antes del ensayo:\u003c/b> leé en voz alta tu guion, comprobá cada cifra en la fuente enlazada y prepará una respuesta de 20–30 segundos para la pregunta probable. Después practicá dos preguntas de otros bloques; el profesor puede dirigirlas a cualquiera.\u003c/p>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E01/E01_Acta_Equipo_Seleccion_Empresa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.01 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E06/E06_Matriz_RACI_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.06 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_11_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS11 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E08/E08_Checklist_Baseline_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.08 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E09/E09_Indicadores_Auditoria_Interna_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.09 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E10/E10_Roadmap_Madurez_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.10 ↗\u003c/a> · \u003ca href=\"fuentes_originales/E12/E12_Presentacion_Ejecutiva_BUNICA_SENG.pptx\" target=\"_blank\" rel=\"noopener\">E.12 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E12/Guion_Defensa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">Guion ↗\u003c/a>\u003c/div>\u003c/section>\u003ch2>Estudio en profundidad\u003c/h2>\u003cp>Seguí estas secciones en orden: primero entendé el mensaje del bloque, luego las cifras y finalmente las objeciones. Abrí los documentos fuente enlazados si necesitás comprobar una afirmación.\u003c/p>\u003csection class=\"panel deep-study\">\u003cspan class=\"eyebrow\">GUÍA DETALLADA\u003c/span>\u003ch3>1 · Presentar el estado sin mezclar categorías\u003c/h3>\u003cp>La diapositiva separa operación actual, diseño y trabajo futuro. ‘0 completas’ significa que ninguna alcanza hoy toda la cobertura exigida; ‘4 parciales’ tienen alguna capacidad existente pero brechas abiertas; ‘125 listas para implementar’ tienen medida especificada; ‘24 al roadmap’ dependen de capacidades todavía pendientes. Una medida escrita no se vuelve operativa por estar en un checklist.\u003c/p>\u003cul class=\"dense-list\">\u003cli>La cuenta concilia: 0 completas + 4 parciales + 125 listas + 24 al roadmap = 153.\u003c/li>\u003cli>El baseline se distribuye entre 45 salvaguardas en E.07 y 108 en E.08.\u003c/li>\u003cli>Las 26 filas de CIS 4/16 de Christopher están dentro de E.08, no se suman encima de las 153.\u003c/li>\u003c/ul>\u003cdiv class=\"callout\">\u003cb>Ensayo:\u003c/b> Si te preguntan ‘¿cuántas cumple hoy?’, especificá qué quiere decir ‘cumplir’ y luego di el estado documentado.\u003c/div>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_11_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS11 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E08/E08_Checklist_Baseline_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.08 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E10/E10_Roadmap_Madurez_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.10 ↗\u003c/a>\u003c/div>\u003c/section>\u003csection class=\"panel deep-study\">\u003cspan class=\"eyebrow\">GUÍA DETALLADA\u003c/span>\u003ch3>2 · Indicador, meta, evidencia y auditoría\u003c/h3>\u003cp>Un indicador define qué se cuenta, de qué universo, con qué frecuencia y contra qué meta. IND-07 mide cobertura de FIDO2 en cuentas administrativas. IND-09 compara horas reales de recuperación con el RTO de ocho horas. Los responsables producen registros; Auditoría Interna verifica muestras, recalcula y comunica hallazgos de forma independiente.\u003c/p>\u003cul class=\"dense-list\">\u003cli>0 % actual y 100 % meta para FIDO2 al 30 de junio de 2027.\u003c/li>\u003cli>La prueba parcial duró 11 h; la meta de recuperación es ≤8 h.\u003c/li>\u003cli>Auditoría es un programa propuesto con fechas futuras, no una auditoría ya realizada.\u003c/li>\u003c/ul>\u003cdiv class=\"callout\">\u003cb>Ensayo:\u003c/b> Responde quién registra, quién calcula, quién revisa y cuál documento conserva la prueba.\u003c/div>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E06/E06_Matriz_RACI_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.06 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E09/E09_Indicadores_Auditoria_Interna_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.09 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E10/E10_Roadmap_Madurez_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.10 ↗\u003c/a>\u003c/div>\u003c/section>\u003csection class=\"panel deep-study\">\u003cspan class=\"eyebrow\">GUÍA DETALLADA\u003c/span>\u003ch3>3 · Aplicar la revisión de calidad a las nueve diapositivas\u003c/h3>\u003cp>Como Oficial de Calidad, revisá que cada dato coincida con su fuente y que los términos se usen de forma consistente: IG3 asignado no es IG3 implementado; residual esperado no es resultado medido; costo cuantificado no equivale al costo total. Revisa nombres/roles, cifras, fechas, fuentes legibles y que el tiempo ensayado termine con margen.\u003c/p>\u003cul class=\"dense-list\">\u003cli>Cotejá en el guion y la PPT quién expone y quién es suplente.\u003c/li>\u003cli>Controlá que cada cifra ejecutiva tenga entregable citado y que el texto no contradiga el estado actual.\u003c/li>\u003cli>Registra duración de ensayos y señala qué frase se debe recortar sin eliminar la cifra clave.\u003c/li>\u003c/ul>\u003cdiv class=\"callout\">\u003cb>Ensayo:\u003c/b> Hacé dos revisiones: primero exactitud con los documentos; después claridad oral con cronómetro y cambios de expositor.\u003c/div>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E01/E01_Acta_Equipo_Seleccion_Empresa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.01 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E09/E09_Indicadores_Auditoria_Interna_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.09 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E11/E11_Documento_Final_LineaBase_BUNICA_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.11 ↗\u003c/a> · \u003ca href=\"fuentes_originales/E12/E12_Presentacion_Ejecutiva_BUNICA_SENG.pptx\" target=\"_blank\" rel=\"noopener\">E.12 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E12/Guion_Defensa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">Guion ↗\u003c/a>\u003c/div>\u003c/section>\u003ch2>Las cifras e ideas que debés tener claras\u003c/h2>\u003cul class=\"dense-list\">\u003cli>153 salvaguardas: 0 completas, 4 parciales, 125 con medida diseñada para implementar y 24 al roadmap.\u003c/li>\u003cli>E.07 aporta 45 salvaguardas y E.08 aporta 108; diseño no equivale a operación.\u003c/li>\u003cli>E.09 propone 16 indicadores. IND-07: FIDO2 administrativo 0 % hoy → 100 % meta; IND-09: recuperación 11 h → ≤8 h.\u003c/li>\u003c/ul>\u003ch2>Preguntas que podrían dirigirte\u003c/h2>\u003cdetails class=\"accordion\">\u003csummary>¿Por qué ninguna salvaguarda cuenta como completa?\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>La descripción o el procedimiento no prueban operación con cobertura total. Se necesita evidencia de ejecución y validación; las cuatro parciales no equivalen a completas.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"accordion\">\u003csummary>¿Quién comprueba que los controles funcionan?\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>Los responsables calculan indicadores con registros y evidencia; Auditoría Interna revisa independientemente y da seguimiento a hallazgos.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"accordion\">\u003csummary>¿Qué valida el rol de calidad en la presentación?\u003c/summary>\u003cdiv class=\"accordion-body\">\u003cp>Que cada cifra tenga fuente, los estados no confundan diseño con operación y los totales concilien: 4 + 125 + 24 = 153.\u003c/p>\u003c/div>\u003c/details>\u003csection class=\"panel\">\u003ch3>Ruta breve de estudio\u003c/h3>\u003col>\u003cli>Revisá tu diapositiva en la PPT vigente y el bloque correspondiente del guion.\u003c/li>\u003cli>Abrí los entregables fuente y marcá dónde están los IDs, valores y condiciones citados.\u003c/li>\u003cli>Ensayá tu intervención con cronómetro; dejá margen antes del corte de 10 minutos.\u003c/li>\u003cli>Pedile a un compañero una repregunta; respondé con evidencia y explicá qué aún no está comprobado.\u003c/li>\u003c/ol>\u003cp>\u003cb>Preparación común:\u003c/b> repasá también las nueve preguntas del cliente y hacé una práctica aleatoria.\u003c/p>\u003cbutton class=\"primary-btn\" data-nav=\"b8\">Estudiar las nueve preguntas →\u003c/button>\u003cbutton class=\"plain-btn\" data-nav=\"entrenador\">Practicar pregunta aleatoria →\u003c/button>\u003cdiv class=\"source-line\">\u003cb>Fuentes:\u003c/b> \u003ca href=\"fuentes_pdf/E01/E01_Acta_Equipo_Seleccion_Empresa_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.01 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E06/E06_Matriz_RACI_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.06 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E07/E07_Desarrollo_Control_CIS_11_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.07-CIS11 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E08/E08_Checklist_Baseline_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.08 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E09/E09_Indicadores_Auditoria_Interna_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.09 ↗\u003c/a> · \u003ca href=\"fuentes_pdf/E10/E10_Roadmap_Madurez_IG_SENG.pdf\" target=\"_blank\" rel=\"noopener\">E.10 ↗\u003c/a> · \u003ca href=\"fuentes_originales/E12/E12_Presentacion_Ejecutiva_BUNICA_SENG.pptx\" target=\"_blank\" rel=\"noopener\">E.12 ↗\u003c/a> · \u003ca mientos, fórmulas, fuentes y los registros completos. <b>Defensa</b> prioriza el argumento, la objeción probable y una respuesta honesta. Podés cambiar de modo sin perder el capítulo.</p>${src("E.01","E.11")}</div><div class="callout warning"><b>Lectura crítica:</b> los entregables describen una organización y entrevistas simuladas. El baseline es diseño, no evidencia de implantación. E.12 ya tiene una versión de trabajo de 13 diapositivas y un guion; la PPT se actualizará. Esta academia se basa en la versión vigente y distingue las metas de la implantación comprobada.</div>`;}

    const SAFE_STUDY={
      "4.1":["Definir una configuración aprobada por producto y revisarla cada año; así se puede comparar cualquier equipo con un patrón seguro.","Como una receta oficial: cada cocina puede variar ingredientes, pero el plato seguro tiene una receta controlada.","Inventario 1.1 y versiones; CIS Benchmarks de IBM i, RHEL, Windows, Oracle, Microsoft 365 y demás productos según corresponda.","R-09 formalmente; también reduce errores de configuración que abren otras rutas.","E.04 muestra Microsoft 365 con expedientes KYC y E.05 identifica permisos/configuración excesivos; una línea base verificable cierra parte de esa brecha.","¿Un documento de configuración basta para decir «cumple»?","No. Hay que comparar configuraciones reales, registrar desvíos y corregirlos."],
      "4.2":["Fijar configuraciones seguras para cortafuegos, enrutadores y conmutadores.","Como definir semáforos y barreras de una ciudad antes de abrir las vías.","Inventario de equipos 1.1 y diagrama 12.4; Benchmark oficial o guía del fabricante si no existe.","Apoya R-01, R-03 y R-09; E.05 asocia formalmente R-09 con CIS 4.","La segmentación de CIS 12 pierde valor si las reglas y equipos de red tienen ajustes inseguros.","¿Por qué no aplicar el mismo Benchmark a todo equipo?","Cada producto y versión necesita su propio patrón; si no existe, se usa la guía del fabricante y se documenta."],
      "4.3":["Cerrar una sesión inactiva para que otra persona no herede acceso.","Es cerrar la ventanilla cuando el cajero se ausenta.","Política del directorio y configuraciones específicas de RHEL, IBM i y móviles inventariados.","Reduce abuso de sesiones; apoya R-02.","Una estación o sesión de administración desatendida puede convertir una cuenta válida en acceso ajeno.","¿Qué límite propone E.08?","15 minutos en Windows, RHEL e IBM i; 2 minutos en móviles corporativos que el inventario llegue a registrar."],
      "4.4":["Activar el cortafuegos del propio servidor y permitir solo puertos necesarios.","Cada edificio mantiene puertas internas aunque la ciudad tenga muralla exterior.","Catálogo de servicios de cada servidor y cambios aprobados; capacidad de filtrado del IBM i.","Apoya R-01 y R-03 al limitar movimiento lateral.","El cortafuegos perimetral no frena todo tráfico entre segmentos o servidores.","¿Por qué un firewall de host si ya hay Palo Alto?","Porque el perímetro y el servidor cubren rutas distintas; mínimo acceso en ambos niveles."],
      "4.5":["Aplicar firewall de host a estaciones de usuario con denegación por defecto.","Cada puesto de trabajo tiene su propia cerradura.","Inventario de estaciones Windows 11 y política del directorio.","Apoya R-01/R-03 frente a entrada y propagación desde sucursales.","R-01 comienza en una estación de sucursal; limitar conexiones reduce superficie de movimiento.","¿Qué evidencia lo confirma?","El reporte de cumplimiento de la política por estación, no solo la existencia de una GPO."],
      "4.6":["Administrar equipos y servicios únicamente por canales cifrados y controlados.","Una orden de mando viaja por un canal sellado, no en una postal.","Inventario de protocolos, excepciones aprobadas y configuración versionada de Azure.","Apoya R-02 y R-09; evita exposición de credenciales y cambios inseguros.","La administración sin cifrado puede entregar credenciales que controlan activos críticos.","¿Qué hace BUNICA con Telnet del IBM i?","E.08 propone sesiones 5250 sobre TLS por puerto 992 y deshabilitar Telnet claro por 23 salvo excepción."],
      "4.7":["Deshabilitar o individualizar cuentas predeterminadas y no usarlas a diario.","Cambiar la llave maestra que llegó con todos los edificios.","Inventario de cuentas del control 5 y configuración por plataforma.","Apoya R-02.","Las credenciales por defecto son conocidas o compartidas y borran trazabilidad individual.","¿Basta cambiar la contraseña de root?","No; hay que limitar acceso remoto, uso diario y registrar el estado de todas las cuentas por plataforma."],
      "4.8":["Quitar servicios que el negocio no necesita.","Cerrar puertas y ventanas de un edificio que nunca se usan.","Línea base 4.1 por producto y revisión trimestral.","Apoya reducción de exposición de R-01/R-09.","Cada servicio innecesario suma una posible ruta de ataque y mantenimiento.","¿Qué ejemplo da el caso?","Deshabilitar servidores TCP/IP del IBM i que el core no utiliza, comparando con su línea base."],
      "4.9":["Obligar a los equipos a usar servidores DNS aprobados.","La ciudad consulta una guía oficial en lugar de direcciones entregadas por desconocidos.","DNS del directorio y filtrado 9.2; inventario de cortafuegos, enrutadores y cajeros.","Apoya R-01 y R-09 de forma preventiva.","Una respuesta DNS manipulada puede desviar estaciones o servicios a destinos hostiles.","¿Qué se revisa en auditoría?","La configuración DNS real de los equipos de red y su concordancia con los servidores aprobados."],
      "4.10":["Bloquear un dispositivo portátil tras intentos fallidos repetidos.","Una cerradura se traba después de demasiadas llaves equivocadas.","Inventario 1.1 debe identificar portátiles y móviles; la ficha solo registra estaciones Windows 11.","Protege cuentas y datos si un equipo se pierde; apoyo indirecto a R-02/R-09.","Sin umbral, un atacante con el equipo puede probar credenciales indefinidamente.","¿Qué supuso E.08 sobre móviles?","No afirma que existan hoy en la ficha; la medida aplica a los que el inventario registre."],
      "4.11":["Borrar a distancia datos del banco en un portátil o móvil perdido o retirado.","Vaciar una maleta extraviada antes de que otro la abra.","Inventario 1.1, administración de dispositivos y avisos de baja de Recursos Humanos.","Reduce exposición de datos, incluido el tipo de R-09.","La pérdida física no debe convertirse en divulgación permanente de datos empresariales.","¿Cuándo se activa?","Ante pérdida, robo o baja de usuario, con registro de la orden y resultado."],
      "4.12":["Separar aplicaciones y datos laborales del espacio personal en un móvil.","Dos compartimentos de una misma maleta, uno bajo llave del banco.","Inventario de móviles, bloqueo/borrado 4.10/4.11 y correo Microsoft 365 supuesto S-18.","Reduce exposición de datos; apoyo a R-09.","La separación permite retirar datos de BUNICA sin mezclar información personal.","¿Por qué está en IG3 y no se afirma operativa?","E.08 la deja por implementar; depende de móviles identificados y de capacidades anteriores."],
      "16.1":["Crear un ciclo de desarrollo seguro con reglas de diseño, código, revisión y pruebas.","Como exigir plano, inspección y prueba antes de abrir un puente.","Inventario de aplicaciones, responsables y contratos si un tercero desarrolla canales.","Apoya R-04 y R-05; E.05 asigna formalmente R-04 a CIS 7 y R-05 a CIS 6.","La app y la banca en línea son a medida; seguridad debe entrar antes de publicarlas.","¿Quién aplica el proceso si el desarrollo es externo?","El personal propio y el tercero por cláusula contractual; la ficha no dice quién desarrolla los canales."],
      "16.2":["Recibir, clasificar y corregir reportes de vulnerabilidades de aplicaciones.","Un buzón de averías con plazo y responsable, no avisos dispersos.","Proceso 16.1 y plazos de remediación del control 7.","Apoya R-04.","Un defecto conocido sin dueño ni plazo se convierte en exposición sostenida de la app.","¿Qué prueba el cierre?","Registro del reporte, severidad, corrección y verificación posterior."],
      "16.3":["Buscar la causa que permitió un defecto, no solo parchear un caso.","Arreglar la tubería que gotea, no secar cada charco.","Proceso de vulnerabilidades 16.2 y datos de incidentes/defectos.","Apoya R-04.","Si la misma práctica insegura persiste, reaparece el defecto en otras funciones.","¿Qué cambia después del análisis?","Estándar de código, revisión o prueba que evitó repetir el patrón."],
      "16.4":["Mantener una lista de bibliotecas y componentes de terceros de cada aplicación.","El inventario de piezas de un vehículo permite saber cuál retirar cuando hay un defecto.","Inventario de software 2.1, repositorios y versiones del código.","Apoya R-04.","Sin lista de materiales no se sabe si una dependencia Java vulnerable está en la app.","¿La lista de componentes sustituye el escaneo?","No. Permite saber qué hay; 16.5 y el control 7 determinan actualización y remediación."],
      "16.5":["Usar dependencias actuales y de origen confiable, analizarlas antes de integrarlas.","Comprar piezas certificadas y revisar sus retiros del mercado.","Inventario 16.4 y proceso de vulnerabilidades 16.2.","Apoya R-04.","Una biblioteca insegura puede comprometer toda la banca digital aunque el código propio sea correcto.","¿Qué se hace ante una biblioteca abandonada?","Se reemplaza o se documenta una excepción con mitigación y fecha, según el proceso."],
      "16.6":["Definir severidad y un umbral para publicar o bloquear una versión.","Un puente no se inaugura con una falla estructural crítica.","Proceso 16.1 y criterios de remediación del control 7.","Apoya R-04.","Sin escala común, desarrollo y seguridad discuten caso por caso y se libera código inseguro.","¿Para qué sirve antes de 16.12?","El análisis de código necesita saber qué hallazgos detienen la publicación."],
      "16.7":["Endurecer servidores y bases que ejecutan las aplicaciones con plantillas aprobadas.","No basta un edificio seguro si sus cimientos quedan abiertos.","Líneas base 4.1 para RHEL 8, Oracle 19c y servidor Java por verificar.","Apoya R-04 y R-09.","El software propio no debe debilitar una configuración segura de infraestructura.","¿Qué no confirma la ficha?","No declara el servidor de aplicaciones Java ni la edición de Oracle; primero se inventarían."],
      "16.8":["Separar desarrollo y pruebas de producción y evitar datos reales en ambientes de ensayo.","El laboratorio no comparte la caja fuerte del banco.","Proceso 16.1, inventario de ambientes y datos de prueba protegidos.","Apoya R-04 y privacidad de datos de clientes.","Un cambio experimental o una copia de datos reales puede afectar producción o exponer clientes.","¿Por qué los datos de prueba importan?","Porque una base copiada puede contener clientes reales aunque el entorno se llame «pruebas»."],
      "16.9":["Capacitar al personal de desarrollo en fallos comunes y diseño seguro.","El constructor aprende el código de seguridad antes de levantar el edificio.","Programa por rol 14.9 y proceso 16.1.","Apoya R-04/R-05.","Las herramientas no sustituyen decisiones de diseño y código de las personas.","¿Con qué frecuencia?","E.08 propone capacitación anual en código seguro para quienes desarrollan."],
      "16.10":["Aplicar principios como mínimo privilegio y validar entradas desde el diseño.","Diseñar calles con límites y filtros, no poner barreras al final.","Proceso 16.1 y revisión de cambios mayores.","Apoya R-04 y R-05.","Un diseño inseguro crea clases enteras de fallos que un parche puntual no corrige.","¿Qué revisarías en una transferencia de la app?","Validación de entradas, autorización por usuario y ausencia de cuentas/servicios innecesarios."],
      "16.11":["Usar módulos probados para funciones críticas de seguridad.","La cerradura principal se compra y prueba con estándares, no se improvisa.","Diseño seguro 16.10, MFA de 6.3 y selección de algoritmos estándar.","Apoya R-05 y protección de datos.","Inventar criptografía o autenticación propia aumenta errores difíciles de descubrir.","¿Qué funciones menciona E.08?","Segundo factor de la app, cifrado estándar y registros de auditoría de la plataforma."],
      "16.12":["Analizar estática y dinámicamente el código antes de publicarlo.","Un puente pasa inspección de planos y prueba de carga antes de abrir.","Proceso 16.1 y severidad 16.6 fijan qué hallazgos bloquean publicación.","Apoya R-04; programada en E.10.","Las pruebas automáticas y manuales encuentran defectos antes de exponer la app.","¿Por qué al roadmap?","Primero se necesita proceso y umbral para que el reporte tenga consecuencias reales."],
      "16.13":["Probar la aplicación como atacante autenticado, incluida lógica de negocio.","Un inspector intenta abrir puertas siguiendo caminos que un cliente real podría usar.","Programa 18.1 y contratación de firma 18.2.","Apoya R-04/R-05; programada en E.10.","Un escaneo de vulnerabilidades no descubre todos los abusos de flujos bancarios.","¿Por qué prueba autenticada?","Permite revisar autorización, transferencias y toma de cuentas desde dentro de una sesión."],
      "16.14":["Dibujar posibles atacantes, objetivos y caminos antes de cambios importantes.","Antes de construir una vía, imaginar por dónde entraría un intruso.","Proceso 16.1 y formación 16.9.","Apoya R-04/R-05; programada en E.10.","Reduce defectos de arquitectura que serían caros de corregir tras publicar.","¿Qué interfaces modelarías?","Banca en línea, app y sus interfaces con el core, sin inventar protocolos que el caso no documenta."]

    function chapterB5(){

      ${shown.map(x=>{const p=SAFE_STUDY[x.id];return `<details class="accordion" id="safe-${x.id.replace(".","-")}"><summary><span class="tag">${x.id}</span>${esc(x.name)}<span class="tag ${x.state==="Al roadmap"?"amber":"gray"}">${x.ig} · ${esc(x.state)}</span></summary><div class="accordion-body"><p><b>Qué es:</b> ${p[0]}</p><p><b>Analogía:</b> ${p[1]}</p><p><b>Aplicación y medida de SENG en BUNICA:</b> ${fmt(x.measure)}</p><p><b>Estado:</b> ${esc(x.state)}. La propuesta documentada no demuestra configuración, prueba ni operación actual.</p><p><b>Evidencia esperada:</b> ${esc(x.evidence)}.</p><div class="detail-only"><p><b>Dependencias:</b> ${p[2]}</p><p><b>Riesgos:</b> ${p[3]}</p><p><b>Por qué este diseño:</b> ${p[4]}</p></div><div class="defense-only callout"><b>Pregunta:</b> ${p[5]}<br><b>Respuesta:</b> ${p[6]}</div>${src("E.08","E.10")}</div></details>`}).join("")}
      <div class="detail-only panel"><h3>Secuencia para memorizar con lógica</h3><p><b>CIS 4:</b> inventario → línea base 4.1 → red 4.2 → sesiones, firewalls y cuentas 4.3–4.7 → servicios y DNS 4.8–4.9 → portátiles y móviles 4.10–4.12. <b>CIS 16:</b> proceso 16.1 → reportar y analizar fallos 16.2–16.3 → componentes de terceros 16.4–16.5 → severidad 16.6 → infraestructura y ambientes 16.7–16.8 → formación y diseño 16.9–16.11 → verificaciones avanzadas 16.12–16.14.</p><p>El roadmap inicia CIS 4 IG1 en INI-08, amplía 4.8–4.11 en INI-24 y reserva 4.12 para INI-37. CIS 16.1–16.11 se ordenan en INI-28; 16.12–16.14 quedan al roadmap tras sus dependencias.</p>${src("E.08","E.10")}</div>
      ${question("¿Por qué 16.12–16.14 están al roadmap si son importantes?","Porque el análisis de código requiere un proceso y una escala de severidad; la prueba de penetración requiere un programa y una firma; el modelado de amenazas requiere proceso y capacitación. La dependencia explica la secuencia, no resta importancia al riesgo.")}`;

    function svgEdge(from,to,dashed=false){const x1=from.x+from.w,y1=from.y+from.h/2,x2=to.x,y2=to.y+to.h/2;const mid=(x1+x2)/2;return `<path d="M${x1} ${y1} C${mid} ${y1},${mid} ${y2},${x2} ${y2}" fill="none" stroke="${dashed?"#b8a074":"#adc5d9"}" stroke-width="1.4" ${dashed?'stroke-dasharray="4 4"':''} marker-end="url(#arrow)"></path>`;}

      const edges=assetIds.map(id=>[proc.id,id]).concat(assetIds.map(id=>[id,risk.id]),controls.map(n=>[risk.id,"CIS-"+n]));
